<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Panel Maestro de Control</title>
    <style>
        :root {
            --bg-base: #060707;
            --panel-bg: #0b0d0c;
            --border-subtle: #18221b;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0e1210;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px;
        }

        .main-container {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* LOGO Y ENCABEZADO CENTRALIZADO */
        .brand-header-center {
            text-align: center;
            padding: 10px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .diti-logo-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffffff;
            display: inline-flex;
            align-items: baseline;
            gap: 2px;
        }

        .diti-logo-title .green-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px var(--accent-green);
            margin-left: 2px;
        }

        .diti-logo-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* HEADER PANEL PRINCIPAL */
        .header-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        .header-title p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-primary-action {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .btn-primary-action:hover {
            background: #00c864;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.35);
            transform: translateY(-1px);
        }

        .btn-nav-top {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 11px 16px;
            border-radius: 8px;
            font-size: 0.82rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-nav-top:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        /* SEPARADOR ESTILIZADO */
        .enterprise-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 5px 0;
        }

        .enterprise-divider::before, .enterprise-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .divider-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-green);
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        /* SECCIÓN DE CARDS DE ADMINISTRADORES */
        .section-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metrics-counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(14, 18, 16, 0.9);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: 8px;
        }

        .metrics-counter-badge .metric-number {
            font-family: monospace;
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .metrics-counter-badge .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .admins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .admin-card-item {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .admin-card-item:hover {
            border-color: rgba(0, 230, 118, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.05);
        }

        .admin-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .admin-card-header h4 {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 600;
        }

        .admin-card-header span {
            font-family: monospace;
            font-size: 0.72rem;
            color: var(--accent-green);
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .admin-card-body {
            font-size: 0.81rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .admin-card-body strong {
            color: #e0e0e0;
        }

        .btn-view-details {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-view-details:hover {
            background: rgba(0, 230, 118, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* VENTANA EMERGENTE (MODAL WIZARD) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 4, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeInModal 0.25s ease;
        }

        @keyframes fadeInModal {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-container {
            width: 100%;
            max-width: 580px;
            background: #0d1210;
            border: 1px solid rgba(0, 230, 118, 0.25);
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .modal-header h3 {
            font-size: 1.15rem;
            color: #fff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-close-modal:hover {
            color: #fff;
        }

        .step-counter {
            font-family: monospace;
            font-size: 0.78rem;
            color: var(--accent-green);
            margin-bottom: 18px;
            display: block;
            letter-spacing: 0.05em;
        }

        .wizard-step {
            display: none;
        }

        .wizard-step.active {
            display: block;
            animation: fadeInStep 0.3s ease;
        }

        @keyframes fadeInStep {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-group label {
            display: block;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .field-group input, 
        .field-group select {
            width: 100%;
            height: 44px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: #fff;
            padding: 0 14px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .field-group input:focus, 
        .field-group select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.15);
        }

        .permissions-box {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 12px;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.84rem;
            color: #ccc;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .permission-item input {
            width: auto;
            height: auto;
            accent-color: var(--accent-green);
        }

        .wizard-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 28px;
        }

        .btn-enterprise {
            height: 42px;
            padding: 0 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
        }

        .btn-ghost:hover {
            border-color: #444;
            color: #fff;
        }

        .btn-solid {
            background: var(--accent-green);
            border: none;
            color: #000;
            flex-grow: 1;
        }

        .btn-solid:hover {
            background: #00c864;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.35);
        }

        .btn-danger {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.4);
            color: #ff6666;
        }

        .btn-danger:hover {
            background: rgba(255, 77, 77, 0.2);
            border-color: #ff4d4d;
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LOGOTIPO PROFESIONAL CENTRALIZADO -->
        <div class="brand-header-center">
            <div class="diti-logo-title">
                diti<span class="green-dot"></span>app
            </div>
            <div class="diti-logo-subtitle">Panel Maestro de Control — ReyDiti</div>
        </div>

        <!-- Encabezado Operativo -->
        <div class="header-panel">
            <div class="header-title">
                <h2>Gestión de Administradores</h2>
                <p>Estructuración de credenciales y privilegios de acceso</p>
            </div>
            <div class="header-actions">
                <button class="btn-primary-action" onclick="abrirModalRegistro()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Registrar Administrador
                </button>
                <a href="diti_adminpanel.html" class="btn-nav-top">Panel Principal →</a>
            </div>
        </div>

        <!-- Separador Estilizado -->
        <div class="enterprise-divider">
            <div class="divider-dot"></div>
        </div>

        <!-- Tarjetas de Administradores Autorizados -->
        <div class="section-card">
            <div class="section-header">
                <div class="section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Administradores Autorizados
                </div>
                <!-- Contador Métrico Gerencial -->
                <div class="metrics-counter-badge">
                    <span class="metric-number" id="total-admins-count">0</span>
                    <span class="metric-label">Activos</span>
                </div>
            </div>

            <div class="admins-grid" id="admins-grid-container">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>
    </div>

    <!-- VENTANA EMERGENTE (MODAL WIZARD PROFESIONAL) -->
    <div class="modal-overlay" id="admin-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="form-main-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    Registrar Administrador
                </h3>
                <button class="btn-close-modal" onclick="cerrarModal()">×</button>
            </div>

            <span class="step-counter" id="step-indicator-text">FASE 1 DE 3 — DATOS PERSONALES</span>

            <form id="admin-form">
                <input type="hidden" id="admin-id">

                <!-- PASO 1 -->
                <div class="wizard-step active" id="step-1">
                    <div class="field-group">
                        <label>Nombre y Apellido Completo</label>
                        <input type="text" id="nombre" placeholder="Ej. Carlos Mendoza">
                    </div>
                    <div class="field-group">
                        <label>Provincia / Región Operativa</label>
                        <input type="text" id="provincia" placeholder="Ej. Buenos Aires">
                    </div>

                    <div class="wizard-actions">
                        <button type="button" class="btn-enterprise btn-danger" id="btn-eliminar" style="display: none;" onclick="eliminarAdministrador()">Eliminar Admin</button>
                        <div style="flex-grow: 1;" id="spacer-step1"></div>
                        <button type="button" class="btn-enterprise btn-solid" onclick="cambiarPaso(1)">Siguiente Fase →</button>
                    </div>
                </div>

                <!-- PASO 2 -->
                <div class="wizard-step" id="step-2">
                    <div class="field-group">
                        <label>Usuario Asignado (Credencial de Acceso)</label>
                        <input type="text" id="usuario" placeholder="Ej. cmendoza_diti">
                    </div>
                    <div class="field-group">
                        <label>Contraseña de Seguridad</label>
                        <input type="text" id="password" placeholder="••••••••">
                    </div>

                    <div class="wizard-actions">
                        <button type="button" class="btn-enterprise btn-ghost" onclick="cambiarPaso(-1)">← Anterior</button>
                        <button type="button" class="btn-enterprise btn-solid" onclick="cambiarPaso(1)">Siguiente Fase →</button>
                    </div>
                </div>

                <!-- PASO 3 -->
                <div class="wizard-step" id="step-3">
                    <div class="field-group">
                        <label>Protocolo de Acceso al Menú</label>
                        <select id="tipoAcceso" onchange="toggleAccesoMenu()">
                            <option value="todas">Acceso total a todos los módulos</option>
                            <option value="manual">Asignación manual selectiva</option>
                        </select>
                    </div>

                    <div class="field-group" id="menu-permisos-container" style="display: none;">
                        <label>Módulos Autorizados</label>
                        <div class="permissions-box" id="lista-permisos-menu">
                            <!-- Opciones cargadas de Firebase -->
                        </div>
                    </div>

                    <div class="wizard-actions">
                        <button type="button" class="btn-enterprise btn-ghost" onclick="cambiarPaso(-1)">← Anterior</button>
                        <button type="submit" class="btn-enterprise btn-solid" id="btn-guardar">Completar Registro</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Firebase y Lógica -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, addDoc, onSnapshot, getDocs, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let currentStep = 1;
        const totalSteps = 3;

        const fasesNombres = [
            "FASE 1 DE 3 — DATOS PERSONALES",
            "FASE 2 DE 3 — CREDENCIALES DE ACCESO",
            "FASE 3 DE 3 — PRIVILEGIOS Y MÓDULOS"
        ];

        window.abrirModalRegistro = function() {
            resetFormulario();
            document.getElementById("admin-modal").classList.add("active");
        }

        window.cerrarModal = function() {
            document.getElementById("admin-modal").classList.remove("active");
        }

        window.cambiarPaso = function(direccion) {
            if (direccion === 1) {
                if (currentStep === 1) {
                    if (!document.getElementById("nombre").value.trim() || !document.getElementById("provincia").value.trim()) {
                        alert("Por favor ingrese el Nombre y la Provincia.");
                        return;
                    }
                } else if (currentStep === 2) {
                    if (!document.getElementById("usuario").value.trim() || !document.getElementById("password").value.trim()) {
                        alert("Por favor ingrese el Usuario y la Contraseña.");
                        return;
                    }
                }
            }

            currentStep += direccion;
            if (currentStep < 1) currentStep = 1;
            if (currentStep > totalSteps) currentStep = totalSteps;

            actualizarPasosUI();
        }

        function actualizarPasosUI() {
            for (let i = 1; i <= totalSteps; i++) {
                document.getElementById(`step-${i}`).classList.remove("active");
            }
            document.getElementById(`step-${currentStep}`).classList.add("active");
            document.getElementById("step-indicator-text").innerText = fasesNombres[currentStep - 1];
        }

        function calcularTiempoTranscurrido(timestampOFecha) {
            if (!timestampOFecha) return "Recién registrado";
            
            let fechaRegistro;
            if (timestampOFecha.toDate) {
                fechaRegistro = timestampOFecha.toDate();
            } else {
                fechaRegistro = new Date(timestampOFecha);
            }

            const ahora = new Date();
            const segundos = Math.floor((ahora - fechaRegistro) / 1000);
            
            if (isNaN(segundos) || segundos < 0) return "Hace un momento";

            const minutos = Math.floor(segundos / 60);
            const horas = Math.floor(minutos / 60);
            const dias = Math.floor(horas / 24);
            const meses = Math.floor(dias / 30);
            const anos = Math.floor(dias / 365);

            if (anos > 0) return `${anos} año${anos > 1 ? 's' : ''}`;
            if (meses > 0) return `${meses} mes${meses > 1 ? 'es' : ''}`;
            if (dias > 0) return `${dias} día${dias > 1 ? 's' : ''}`;
            if (horas > 0) return `${horas} hora${horas > 1 ? 's' : ''}`;
            if (minutos > 0) return `${minutos} minuto${minutos > 1 ? 's' : ''}`;
            return "Hace unos segundos";
        }

        const adminForm = document.getElementById("admin-form");
        const adminsGridContainer = document.getElementById("admins-grid-container");
        const totalAdminsCount = document.getElementById("total-admins-count");
        const listaPermisosMenu = document.getElementById("lista-permisos-menu");
        const tipoAccesoSelect = document.getElementById("tipoAcceso");
        const menuPermisosContainer = document.getElementById("menu-permisos-container");

        window.toggleAccesoMenu = function() {
            menuPermisosContainer.style.display = (tipoAccesoSelect.value === "manual") ? "block" : "none";
        }

        async function cargarOpcionesMenu(permisosActuales = []) {
            listaPermisosMenu.innerHTML = "";
            try {
                const querySnapshot = await getDocs(collection(db, "diti_reyditimenu"));
                if (querySnapshot.empty) {
                    listaPermisosMenu.innerHTML = '<div style="font-size:0.75rem; color:#888;">No hay módulos configurados en el sistema.</div>';
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const isChecked = permisosActuales.includes(data.titulo) ? "checked" : "";
                    listaPermisosMenu.innerHTML += `
                        <label class="permission-item">
                            <input type="checkbox" value="${data.titulo}" ${isChecked}>
                            ${data.titulo}
                        </label>
                    `;
                });
            } catch (e) {
                listaPermisosMenu.innerHTML = '<div style="font-size:0.75rem; color:#888;">Cargando módulos...</div>';
            }
        }

        function escucharAdministradores() {
            onSnapshot(collection(db, "diti_usuariosadmin"), (snapshot) => {
                adminsGridContainer.innerHTML = "";
                totalAdminsCount.innerText = snapshot.size;

                if (snapshot.empty) {
                    adminsGridContainer.innerHTML = `
                        <div style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding: 30px;">
                            No hay administradores registrados actualmente.
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const admin = docSnap.data();
                    const id = docSnap.id;
                    const tiempoEmpresaReal = calcularTiempoTranscurrido(admin.createdAt || admin.fechaRegistroIso);

                    adminsGridContainer.innerHTML += `
                        <div class="admin-card-item">
                            <div>
                                <div class="admin-card-header">
                                    <h4>${admin.nombre}</h4>
                                    <span>@${admin.usuario}</span>
                                </div>
                                <div class="admin-card-body">
                                    <div>Región: <strong>${admin.provincia}</strong></div>
                                    <div>Antigüedad: <strong style="color: var(--accent-green);">${tiempoEmpresaReal}</strong></div>
                                    <div>Registro: <span style="font-family: monospace; font-size: 0.75rem;">${admin.fechaRegistro || 'N/D'}</span></div>
                                </div>
                            </div>
                            <button class="btn-view-details" onclick='editarAdmin("${id}", ${JSON.stringify(admin)})'>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                Gestionar Credenciales y Permisos
                            </button>
                        </div>
                    `;
                });
            });
        }

        adminForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const adminId = document.getElementById("admin-id").value;
            const nombre = document.getElementById("nombre").value;
            const provincia = document.getElementById("provincia").value;
            const usuario = document.getElementById("usuario").value;
            const password = document.getElementById("password").value;
            const tipoAcceso = tipoAccesoSelect.value;

            let permisosSeleccionados = [];
            if (tipoAcceso === "manual") {
                const checkboxes = listaPermisosMenu.querySelectorAll("input[type='checkbox']:checked");
                checkboxes.forEach(cb => permisosSeleccionados.push(cb.value));
            }

            const datosAdmin = {
                nombre,
                provincia,
                usuario,
                password,
                tipoAcceso,
                permisosMenu: permisosSeleccionados
            };

            try {
                if (adminId) {
                    await updateDoc(doc(db, "diti_usuariosadmin", adminId), datosAdmin);
                    alert("¡Administrador actualizado con éxito!");
                } else {
                    datosAdmin.fechaRegistro = new Date().toLocaleString();
                    datosAdmin.fechaRegistroIso = new Date().toISOString();
                    datosAdmin.createdAt = serverTimestamp();
                    await addDoc(collection(db, "diti_usuariosadmin"), datosAdmin);
                    alert("¡Administrador registrado exitosamente!");
                }
                cerrarModal();
                resetFormulario();
            } catch (error) {
                console.error("Error:", error);
                alert("Error al procesar la solicitud en la base de datos.");
            }
        });

        window.eliminarAdministrador = async function() {
            const adminId = document.getElementById("admin-id").value;
            if (!adminId) return;

            if (confirm("¿Está seguro de eliminar permanentemente a este administrador del sistema? Esta acción no se puede deshacer.")) {
                try {
                    await deleteDoc(doc(db, "diti_usuariosadmin", adminId));
                    alert("Administrador eliminado correctamente.");
                    cerrarModal();
                    resetFormulario();
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert("No se pudo eliminar el administrador.");
                }
            }
        }

        window.editarAdmin = function(id, admin) {
            document.getElementById("admin-id").value = id;
            document.getElementById("nombre").value = admin.nombre;
            document.getElementById("provincia").value = admin.provincia;
            document.getElementById("usuario").value = admin.usuario;
            document.getElementById("password").value = admin.password;
            tipoAccesoSelect.value = admin.tipoAcceso || "todas";
            toggleAccesoMenu();
            cargarOpcionesMenu(admin.permisosMenu || []);

            currentStep = 1;
            actualizarPasosUI();
            document.getElementById("form-main-title").innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                Editar Administrador y Accesos
            `;
            document.getElementById("btn-guardar").innerText = "Actualizar Modificaciones";
            
            // Mostrar botón de eliminar al estar editando
            document.getElementById("btn-eliminar").style.display = "block";
            
            document.getElementById("admin-modal").classList.add("active");
        }

        window.resetFormulario = function() {
            adminForm.reset();
            document.getElementById("admin-id").value = "";
            currentStep = 1;
            actualizarPasosUI();
            document.getElementById("form-main-title").innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                Registrar Administrador
            `;
            document.getElementById("btn-guardar").innerText = "Completar Registro";
            document.getElementById("btn-eliminar").style.display = "none";
            tipoAccesoSelect.value = "todas";
            toggleAccesoMenu();
            cargarOpcionesMenu();
        }

        // Inicializar
        cargarOpcionesMenu();
        escucharAdministradores();
    </script>
</body>
</html>
