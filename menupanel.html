
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertix - Gestión de Menú</title>
    <style>
        :root {
            --bg-base: #070709;
            --bg-surface: rgba(18, 18, 22, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-accent: rgba(220, 20, 60, 0.4);
            --red-primary: #dc143c;
            --red-glow: rgba(220, 20, 60, 0.35);
            --text-main: #f1f1f5;
            --text-muted: #8a8a9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(180, 0, 0, 0.12) 0%, transparent 60%),
                linear-gradient(180deg, #09090d 0%, #040406 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 75px;
        }

        /* Header Fijo Profesional */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            z-index: 1000;
            background: rgba(10, 10, 14, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            border-color: var(--border-accent);
            background: rgba(220, 20, 60, 0.1);
            box-shadow: 0 0 12px var(--red-glow);
        }

        .brand-logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge-dot {
            width: 8px;
            height: 8px;
            background: var(--red-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--red-primary);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 40%, #a0a0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Botón Agregar Página Superior */
        .add-page-btn {
            background: linear-gradient(180deg, rgba(220, 20, 60, 0.9) 0%, rgba(140, 0, 30, 1) 100%);
            border: 1px solid rgba(255, 50, 50, 0.4);
            color: white;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.84rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px var(--red-glow);
        }

        .add-page-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.5);
        }

        .add-page-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }

        /* Contenido Principal */
        main {
            flex: 1;
            padding: 40px 32px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .page-header-info {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        /* Lista de Elementos Configurados */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item-row {
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            padding: 18px 24px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .menu-item-row:hover {
            border-color: rgba(220, 20, 60, 0.3);
            transform: translateY(-1px);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        /* Icono de Agarrar (Drag / 3 puntitos) */
        .drag-handle {
            color: var(--text-muted);
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s;
        }

        .drag-handle:hover {
            color: #fff;
        }

        .drag-handle svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .item-icon-preview {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red-primary);
            flex-shrink: 0;
        }

        .item-icon-preview svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .menu-item-info strong {
            display: block;
            font-size: 0.96rem;
            color: #fff;
            margin-bottom: 2px;
        }

        .menu-item-info span {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .badge-categoria {
            display: inline-block;
            background: rgba(220, 20, 60, 0.12);
            border: 1px solid rgba(220, 20, 60, 0.3);
            color: #ff6b6b;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .menu-item-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .reorder-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .reorder-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            width: 26px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            transition: all 0.2s;
        }

        .reorder-btn:hover {
            background: var(--red-primary);
            border-color: var(--red-primary);
            color: #fff;
            box-shadow: 0 0 8px var(--red-glow);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            border-color: var(--border-accent);
            background: rgba(220, 20, 60, 0.1);
        }

        .delete-btn:hover {
            border-color: #ff4d4d;
            background: rgba(255, 0, 0, 0.15);
            color: #ff6b6b;
        }

        /* Ventana Emergente (Modal Estilo Empresarial) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #0f0f14;
            border: 1px solid var(--border-accent);
            border-radius: 16px;
            width: 90%;
            max-width: 580px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 20px var(--red-glow);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-overlay.open .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 22, 0.6);
        }

        .modal-header h3 {
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .modal-close-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: 75vh;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-control {
            width: 100%;
            background: rgba(10, 10, 14, 0.7);
            border: 1px solid var(--border-subtle);
            border-radius: 9px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--red-primary);
            box-shadow: 0 0 12px var(--red-glow);
        }

        textarea.form-control {
            resize: vertical;
            font-family: monospace;
            font-size: 0.82rem;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: rgba(18, 18, 22, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-submit {
            background: linear-gradient(180deg, rgba(220, 20, 60, 0.9) 0%, rgba(140, 0, 30, 1) 100%);
            border: 1px solid rgba(255, 50, 50, 0.4);
            color: white;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px var(--red-glow);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.5);
        }
    </style>
</head>
<body>

    <!-- Header Fijo -->
    <header>
        <div class="header-left">
            <a href="paneladmin.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Panel Principal
            </a>
            <div class="brand-logo-area">
                <div class="brand-badge-dot"></div>
                <h1 class="brand-title">Alertix</h1>
            </div>
        </div>
        <div class="header-right">
            <button class="add-page-btn" onclick="abrirModalCrear()">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Agregar Página
            </button>
        </div>
    </header>

    <main>
        <div class="page-header-info">
            <h2 class="section-title">Gestión de Menú y Navegación</h2>
            <p class="section-desc">Organiza las páginas, secciones y rutas del sistema corporativo de manera fluida.</p>
        </div>

        <div class="items-list" id="menu-items-container">
            <p style="color: var(--text-muted); text-align: center; padding: 20px;">Cargando elementos del menú...</p>
        </div>
    </main>

    <!-- Ventana Emergente (Modal Único para Crear y Editar) -->
    <div class="modal-overlay" id="menu-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title-text">Nueva Página de Navegación</h3>
                <button class="modal-close-btn" onclick="cerrarModal()">
                    <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <form id="menu-form">
                <div class="modal-body">
                    <input type="hidden" id="edit-doc-id" value="">
                    
                    <div class="form-group">
                        <label for="titulo">Título de la Página</label>
                        <input type="text" id="titulo" class="form-control" placeholder="Ej. Panel de Clientes" required>
                    </div>

                    <div class="form-group">
                        <label for="redireccion">Redireccionamiento (.html o URL)</label>
                        <input type="text" id="redireccion" class="form-control" placeholder="Ej. clientes.html" required>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría / Sección</label>
                        <input type="text" id="categoria" class="form-control" placeholder="Ej. Socios o Administración" list="categorias-sugeridas" required>
                        <datalist id="categorias-sugeridas">
                            <option value="Socios">
                            <option value="Administración">
                            <option value="Monitoreo">
                            <option value="General">
                        </datalist>
                    </div>

                    <div class="form-group">
                        <label for="iconoSvg">Código SVG del Icono (Lucide / Heroicons 24x24)</label>
                        <textarea id="iconoSvg" class="form-control" rows="3" placeholder='<svg viewBox="0 0 24 24"><path d="..."></path></svg>'></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-submit" id="save-btn-text">Guardar Página</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script con Carga Instantánea en Caché y Reordenamiento Fluido -->
    <script type="module">
        import { db } from "./app.js";
        import { collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const userEmail = sessionStorage.getItem("alertix_user_email");
        if (!userEmail) window.location.href = "googleadmin.html";

        let menuDataCache = [];
        const container = document.getElementById("menu-items-container");
        const modalOverlay = document.getElementById("menu-modal");
        const menuForm = document.getElementById("menu-form");

        // --- RENDERIZADO RÁPIDO DESDE CACHÉ ---
        function renderizarLista(items) {
            if (!items || items.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">No hay páginas configuradas en el menú.</p>`;
                return;
            }

            let html = "";
            items.forEach((data, index) => {
                const iconSvg = data.iconoSvg || `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;
                html += `
                    <div class="menu-item-row" data-id="${data.id}">
                        <div class="menu-item-left">
                            <!-- Tres puntitos (Simulando agarre rápido) -->
                            <div class="drag-handle" title="Mover rápidamente">
                                <svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.5"></circle><circle cx="15" cy="6" r="1.5"></circle><circle cx="9" cy="12" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="9" cy="18" r="1.5"></circle><circle cx="15" cy="18" r="1.5"></circle></svg>
                            </div>
                            <div class="item-icon-preview">${iconSvg}</div>
                            <div class="menu-item-info">
                                <strong>${data.titulo}</strong>
                                <span>Destino: ${data.redireccion}</span>
                                <span class="badge-categoria">${data.categoria || 'General'}</span>
                            </div>
                        </div>
                        <div class="menu-item-actions">
                            <div class="reorder-container">
                                <button class="reorder-btn" onclick="moverItem('${data.id}', 'up')" title="Subir">▲</button>
                                <button class="reorder-btn" onclick="moverItem('${data.id}', 'down')" title="Bajar">▼</button>
                            </div>
                            <button class="action-btn" onclick="abrirModalEditar('${data.id}')">Editar</button>
                            <button class="action-btn delete-btn" onclick="eliminarItem('${data.id}')">Eliminar</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 1. Pintar inmediatamente desde caché si existe
        const cachedMenu = sessionStorage.getItem("alertix_menu_cache");
        if (cachedMenu) {
            try {
                menuDataCache = JSON.parse(cachedMenu);
                renderizarLista(menuDataCache);
            } catch(e) {}
        }

        // 2. Sincronizar con Firestore de fondo
        async function cargarMenuAdmin() {
            try {
                const q = query(collection(db, "menupanel"), orderBy("orden", "asc"));
                const querySnapshot = await getDocs(q);

                menuDataCache = [];
                querySnapshot.forEach((documento) => {
                    menuDataCache.push({ id: documento.id, ...documento.data() });
                });

                sessionStorage.setItem("alertix_menu_cache", JSON.stringify(menuDataCache));
                renderizarLista(menuDataCache);
            } catch (error) {
                console.error("Error cargando menú:", error);
            }
        }
        cargarMenuAdmin();

        // --- CONTROL DE MODALES (VENTANAS EMERGENTES) ---
        window.abrirModalCrear = function() {
            menuForm.reset();
            document.getElementById("edit-doc-id").value = "";
            document.getElementById("modal-title-text").innerText = "Nueva Página de Navegación";
            document.getElementById("save-btn-text").innerText = "Guardar Página";
            modalOverlay.classList.add("open");
        }

        window.abrirModalEditar = function(id) {
            const item = menuDataCache.find(i => i.id === id);
            if (!item) return;

            document.getElementById("edit-doc-id").value = item.id;
            document.getElementById("titulo").value = item.titulo;
            document.getElementById("redireccion").value = item.redireccion;
            document.getElementById("categoria").value = item.categoria || "General";
            document.getElementById("iconoSvg").value = item.iconoSvg;

            document.getElementById("modal-title-text").innerText = "Editar Página de Navegación";
            document.getElementById("save-btn-text").innerText = "Actualizar Cambios";
            modalOverlay.classList.add("open");
        }

        window.cerrarModal = function() {
            modalOverlay.classList.remove("open");
        }

        // Cerrar modal haciendo clic afuera
        modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) cerrarModal();
        });

        // --- GUARDAR / ACTUALIZAR ---
        menuForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("edit-doc-id").value;
            const titulo = document.getElementById("titulo").value.trim();
            const redireccion = document.getElementById("redireccion").value.trim();
            const categoria = document.getElementById("categoria").value.trim() || "General";
            const iconoSvg = document.getElementById("iconoSvg").value.trim() || `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;

            try {
                if (editId) {
                    await updateDoc(doc(db, "menupanel", editId), { titulo, redireccion, categoria, iconoSvg });
                } else {
                    const nuevoOrden = menuDataCache.length + 1;
                    await addDoc(collection(db, "menupanel"), { titulo, redireccion, categoria, iconoSvg, orden: nuevoOrden, createdAt: serverTimestamp() });
                }
                cerrarModal();
                cargarMenuAdmin();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("No se pudo completar la operación.");
            }
        });

        // --- REORDENAMIENTO FLUIDO ---
        window.moverItem = async function(id, direccion) {
            const index = menuDataCache.findIndex(item => item.id === id);
            if (index === -1) return;

            if (direccion === 'up' && index > 0) {
                const actual = menuDataCache[index];
                const anterior = menuDataCache[index - 1];

                // Intercambio local inmediato en el array para fluidez total
                menuDataCache[index] = anterior;
                menuDataCache[index - 1] = actual;
                renderizarLista(menuDataCache);

                await updateDoc(doc(db, "menupanel", actual.id), { orden: index });
                await updateDoc(doc(db, "menupanel", anterior.id), { orden: index + 1 });
                sessionStorage.setItem("alertix_menu_cache", JSON.stringify(menuDataCache));
            } else if (direccion === 'down' && index < menuDataCache.length - 1) {
                const actual = menuDataCache[index];
                const siguiente = menuDataCache[index + 1];

                // Intercambio local inmediato
                menuDataCache[index] = siguiente;
                menuDataCache[index + 1] = actual;
                renderizarLista(menuDataCache);

                await updateDoc(doc(db, "menupanel", actual.id), { orden: index + 2 });
                await updateDoc(doc(db, "menupanel", siguiente.id), { orden: index + 1 });
                sessionStorage.setItem("alertix_menu_cache", JSON.stringify(menuDataCache));
            }
        };

        // --- ELIMINAR ---
        window.eliminarItem = async function(id) {
            if (confirm("¿Estás seguro de eliminar este elemento?")) {
                try {
                    await deleteDoc(doc(db, "menupanel", id));
                    cargarMenuAdmin();
                } catch (error) {
                    console.error("Error al eliminar:", error);
                }
            }
        };
    </script>
