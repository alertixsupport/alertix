<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COUT.APP | Panel Ejecutivo de Jefes</title>
  <style>
    :root {
      --bg-deep: #030112;
      --bg-card: rgba(13, 9, 43, 0.75);
      --border-glass: rgba(255, 255, 255, 0.12);
      --border-focus: #ff5500;
      --accent-fire: #ff5500;
      --accent-fire-glow: rgba(255, 85, 0, 0.4);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #160d4a 0%, var(--bg-deep) 100%);
      min-height: 100vh;
      color: var(--text-main);
      padding: 30px 20px;
      position: relative;
    }

    /* Luces de fondo */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: rgba(27, 17, 139, 0.2);
      filter: blur(140px);
      border-radius: 50%;
      top: 0;
      left: 10%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Navbar Ejecutivo */
    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 20px 30px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      margin-bottom: 35px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fire-icon {
      font-size: 26px;
      animation: flameAnim 1.8s ease-in-out infinite alternate;
      display: inline-block;
      filter: drop-shadow(0 0 10px rgba(255, 85, 0, 0.8));
    }

    @keyframes flameAnim {
      0% { transform: translateY(0) scale(1) rotate(-3deg); }
      50% { transform: translateY(-3px) scale(1.1) rotate(2deg); }
      100% { transform: translateY(-1px) scale(1.05) rotate(-1deg); }
    }

    .logo-container-center {
      text-align: center;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
    }

    .logo-text span {
      color: var(--accent-fire);
      -webkit-text-fill-color: var(--accent-fire);
    }

    /* Menú Desplegable (Hamburguesa) */
    .menu-wrapper {
      position: relative;
      justify-self: end;
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-main);
    }

    .menu-btn:hover {
      background: rgba(255, 85, 0, 0.15);
      border-color: var(--accent-fire);
    }

    .menu-btn svg {
      width: 24px;
      height: 24px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 55px;
      background: #0d092b;
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      width: 210px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      z-index: 50;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    .dropdown-menu.active {
      display: block;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-item {
      padding: 14px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background: rgba(255, 85, 0, 0.2);
      color: var(--accent-fire);
    }

    /* Modales Globales */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(3, 1, 18, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 35px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      position: relative;
    }

    .form-card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      color: white;
      font-size: 13px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-fire);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-primary {
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff5500 0%, #d33f00 100%);
      color: white;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 85, 0, 0.4);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 85, 0, 0.6);
    }

    .btn-cancel {
      padding: 12px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    /* Grid de Cards Herramientas */
    .section-title {
      font-size: 18px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 25px;
      font-weight: 700;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .tool-card {
      background: var(--bg-card);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }

    .tool-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 85, 0, 0.5);
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.6),
        0 0 20px rgba(255, 85, 0, 0.2);
    }

    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .tool-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(255, 85, 0, 0.1);
      border: 1px solid rgba(255, 85, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-icon-box svg {
      width: 26px;
      height: 26px;
      fill: var(--accent-fire);
    }

    .arrow-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .tool-card:hover .arrow-btn {
      background: var(--accent-fire);
      color: white;
      transform: translateX(4px);
      border-color: var(--accent-fire);
      box-shadow: 0 0 12px var(--accent-fire-glow);
    }

    .tool-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .tool-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Botón Eliminar en Modo Gestión */
    .btn-delete {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px;
      color: #fca5a5;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-delete:hover {
      background: var(--danger-color);
      color: white;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navbar Ejecutivo -->
    <header>
      <div class="brand">
        <span class="fire-icon">🔥</span>
      </div>

      <div class="logo-container-center">
        <h1 class="logo-text">cout<span>.app</span> (panel)</h1>
      </div>

      <div class="menu-wrapper">
        <button class="menu-btn" id="menuToggleBtn" title="Menú Ejecutivo">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
          </svg>
        </button>

        <!-- Menú desplegable pequeño -->
        <div class="dropdown-menu" id="dropdownMenu">
          <div class="dropdown-item" id="openModalBtn">➕ Agregar Herramienta</div>
          <div class="dropdown-item" id="openManageBtn">⚙️ Gestionar Herramienta</div>
        </div>
      </div>
    </header>

    <h2 class="section-title" id="sectionTitle">Herramientas & Módulos Administrativos</h2>

    <!-- Grid de Cards Dynamic -->
    <div class="cards-grid" id="toolsGrid">
      <!-- Carga en tiempo real desde Firestore -->
    </div>
  </div>

  <!-- Modal para Agregar Herramienta -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="form-card">
      <h2>Agregar Nueva Herramienta</h2>
      <form id="addToolForm">
        <div class="form-group">
          <label for="title">Título de la Herramienta</label>
          <input type="text" id="title" required placeholder="Ej: Control de Préstamos">
        </div>
        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" required placeholder="Ej: Gestión de solicitudes, préstamos activos y cuotas."></textarea>
        </div>
        <div class="form-group">
          <label for="redirectUrl">Redirección (URL o Ruta Local)</label>
          <input type="text" id="redirectUrl" required placeholder="Ej: prestamos.html o https://cout.app/modulo">
        </div>
        <div class="form-group">
          <label for="iconSvg">Icono SVG (Código XML o SVG directo)</label>
          <textarea id="iconSvg" placeholder='<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>'></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar Herramienta</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { db } from '../app.js';
    import { collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const openModalBtn = document.getElementById('openModalBtn');
    const openManageBtn = document.getElementById('openManageBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const addToolForm = document.getElementById('addToolForm');
    const toolsGrid = document.getElementById('toolsGrid');
    const sectionTitle = document.getElementById('sectionTitle');

    const defaultSvg = `<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>`;
    
    let isManageMode = false;

    // Toggle Menú Desplegable
    menuToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('active');
    });

    // Cerrar menú al hacer clic fuera
    window.addEventListener('click', () => {
      dropdownMenu.classList.remove('active');
    });

    // Abrir Modal Agregar Herramienta
    openModalBtn.addEventListener('click', () => {
      dropdownMenu.classList.remove('active');
      isManageMode = false;
      sectionTitle.textContent = "Herramientas & Módulos Administrativos";
      modalOverlay.classList.add('active');
    });

    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    // Activar Modo Gestión (Eliminar Herramientas)
    openManageBtn.addEventListener('click', () => {
      dropdownMenu.classList.remove('active');
      isManageMode = !isManageMode;
      if (isManageMode) {
        sectionTitle.textContent = "⚙️ Modo Gestión: Seleccione una Herramienta para Eliminar";
        sectionTitle.style.color = "#fca5a5";
      } else {
        sectionTitle.textContent = "Herramientas & Módulos Administrativos";
        sectionTitle.style.color = "var(--text-muted)";
      }
      renderTools();
    });

    // Apuntando exactamente dentro de carpetacout -> configuracion_general -> herramientas
    const toolsRef = collection(db, "carpetacout", "configuracion_general", "herramientas");
    let cachedTools = [];

    // Guardar Herramienta en Firebase
    addToolForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const redirectUrl = document.getElementById('redirectUrl').value.trim();
      let iconSvg = document.getElementById('iconSvg').value.trim();

      if (!iconSvg) iconSvg = defaultSvg;

      try {
        await addDoc(toolsRef, {
          titulo: title,
          descripcion: description,
          redireccion: redirectUrl,
          icono: iconSvg,
          fechaCreacion: new Date().toISOString()
        });

        addToolForm.reset();
        modalOverlay.classList.remove('active');
      } catch (error) {
        console.error("Error guardando herramienta:", error);
        alert("Error al guardar en Firebase: " + error.message);
      }
    });

    // Función para renderizar según el modo actual (Normal o Gestión)
    function renderTools() {
      toolsGrid.innerHTML = '';

      if (cachedTools.length === 0) {
        toolsGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
            No hay herramientas agregadas aún. Haz clic en el menú superior para crear la primera.
          </div>`;
        return;
      }

      cachedTools.forEach(({ id, data }) => {
        if (isManageMode) {
          // En modo gestión, usamos un div contenedor con botón de eliminar
          const cardDiv = document.createElement('div');
          cardDiv.className = 'tool-card';
          cardDiv.style.borderColor = "rgba(239, 68, 68, 0.4)";
          cardDiv.innerHTML = `
            <div>
              <div class="tool-header">
                <div class="tool-icon-box">
                  ${data.icono || defaultSvg}
                </div>
              </div>
              <div class="tool-title">${data.titulo}</div>
              <div class="tool-desc">${data.descripcion}</div>
            </div>
            <button class="btn-delete" data-id="${id}">🗑️ Eliminar Herramienta</button>
          `;

          cardDiv.querySelector('.btn-delete').addEventListener('click', async () => {
            if (confirm(`¿Estás seguro de eliminar la herramienta "${data.titulo}"?`)) {
              try {
                await deleteDoc(doc(db, "carpetacout", "configuracion_general", "herramientas", id));
              } catch (err) {
                console.error("Error al eliminar:", err);
                alert("No se pudo eliminar: " + err.message);
              }
            }
          });

          toolsGrid.appendChild(cardDiv);
        } else {
          // Modo normal: enlace funcional con flechita
          const card = document.createElement('a');
          card.className = 'tool-card';
          card.href = data.redireccion || '#';

          card.innerHTML = `
            <div>
              <div class="tool-header">
                <div class="tool-icon-box">
                  ${data.icono || defaultSvg}
                </div>
                <div class="arrow-btn">&rarr;</div>
              </div>
              <div class="tool-title">${data.titulo}</div>
              <div class="tool-desc">${data.descripcion}</div>
            </div>
          `;

          toolsGrid.appendChild(card);
        }
      });
    }

    // Leer Herramientas en tiempo real desde Firestore
    onSnapshot(toolsRef, (snapshot) => {
      cachedTools = [];
      snapshot.forEach((docSnap) => {
        cachedTools.push({ id: docSnap.id, data: docSnap.data() });
      });
      renderTools();
    }, (error) => {
      console.error("Error al escuchar en tiempo real:", error);
    });
  </script>
</body>
</html>
