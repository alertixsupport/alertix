<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertix - Acceso Administrativo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 50%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px; /* Espaciado externo para evitar que pegue en bordes de móviles */
        }

        .login-card {
            background: linear-gradient(145deg, #1f1f1f, #0d0d0d);
            border: 1px solid #330000;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area h1 {
            font-size: clamp(2rem, 5vw, 2.5rem); /* Se adapta de manera fluida según el tamaño de pantalla */
            background: linear-gradient(90deg, #ff1a1a, #800000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-area p {
            color: #b3b3b3;
            font-size: clamp(0.85rem, 3vw, 0.95rem);
            margin-bottom: 25px;
        }

        .google-login-btn {
            background: #ffffff;
            color: #333333;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent; /* Mejora la experiencia táctil en móviles */
        }

        .google-login-btn:hover {
            background: #e6e6e6;
        }

        .google-login-btn:active {
            transform: scale(0.98); /* Efecto de presión al tocar en celular */
        }

        .google-login-btn svg {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #ff4d4d;
            min-height: 20px;
        }

        /* Ajustes específicos para pantallas muy pequeñas (smartphones estrechos) */
        @media (max-width: 480px) {
            .login-card {
                padding: 25px 15px;
                border: none; /* Menos recargado en móviles pequeños si se desea */
                background: linear-gradient(145deg, #161616, #0a0a0a);
                box-shadow: 0 5px 20px rgba(255, 0, 0, 0.15);
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <h1>Alertix</h1>
            <p>Sistema de Alertas y Seguridad Inteligente</p>
        </div>

        <!-- Botón de inicio de sesión con Google adaptado -->
        <button id="login-btn" class="google-login-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span>Iniciar sesión con Google</span>
        </button>
        <div id="status" class="status-msg"></div>
    </div>

    <!-- Script conectado con app.js y Firestore -->
    <script type="module">
        import { auth, provider, db } from "./app.js";
        import { signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const loginBtn = document.getElementById("login-btn");
        const statusDiv = document.getElementById("status");

        loginBtn.addEventListener("click", async () => {
            try {
                statusDiv.innerText = "Conectando con Google...";
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                statusDiv.innerText = "Registrando acceso...";

                // Guardar el registro de la sesión en Firestore dentro de la colección 'seciones' al instante
                await addDoc(collection(db, "seciones"), {
                    email: user.email,
                    nombre: user.displayName || "Sin nombre",
                    fechaAcceso: serverTimestamp(),
                    uid: user.uid
                });

                // Guardar temporalmente en el navegador para el panel
                sessionStorage.setItem("alertix_user_email", user.email);
                sessionStorage.setItem("alertix_user_name", user.displayName || "");

                // Redirigir al panel de administración
                window.location.href = "paneladmin.html";

            } catch (error) {
                console.error("Error al iniciar sesión:", error);
                statusDiv.innerText = "No se pudo iniciar sesión. Inténtalo de nuevo.";
            }
        });
    </script>
</body>
</html>
