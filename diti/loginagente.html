
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Acceso de Agentes</title>
    <style>
        :root {
            --bg-base: #050706;
            --panel-bg: #090d0b;
            --border-subtle: #152219;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0b110e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-base);
            height: 100%;
            height: 100dvh;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* CONTENEDOR PRINCIPAL DEL LOGIN */
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: 16px;
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .login-logo-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #14241a 0%, #08110b 100%);
            border: 1px solid rgba(0, 230, 118, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(0,230,118,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
        }

        .login-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .login-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.78rem;
            font-family: monospace;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-input {
            height: 46px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: #fff;
            padding: 0 16px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            width: 100%;
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.15);
        }

        .btn-submit {
            height: 48px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(0,230,118,0.3);
        }

        .btn-submit:hover {
            background: #00c864;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.45);
            transform: translateY(-1px);
        }

        .login-footer-link {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .login-footer-link a {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo-box">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div>
                <div class="login-title">Portal de Agentes</div>
                <div class="login-subtitle">Inicia sesión con tus credenciales asignadas</div>
            </div>
        </div>

        <form id="agent-login-form" class="login-form">
            <div class="form-group">
                <label class="form-label">Usuario</label>
                <input type="text" id="login-usuario" class="form-input" required placeholder="tu_usuario" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="login-password" class="form-input" required placeholder="••••••••" autocomplete="off">
            </div>

            <button type="submit" class="btn-submit">
                <span>Ingresar al Panel</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>

        <div class="login-footer-link">
            ¿Eres administrador? <a href="login.html">Iniciar sesión aquí</a>
        </div>
    </div>

    <!-- Script de Autenticación de Agentes -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const loginForm = document.getElementById("agent-login-form");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const usuarioInput = document.getElementById("login-usuario").value.trim().toLowerCase();
            const passwordInput = document.getElementById("login-password").value.trim();

            if (!usuarioInput || !passwordInput) {
                alert("Por favor completa todos los campos.");
                return;
            }

            try {
                // Consultamos en la colección diti_usuarioagentes
                const q = query(
                    collection(db, "diti_usuarioagentes"), 
                    where("usuario", "==", usuarioInput)
                );
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert("El usuario de agente no existe.");
                    return;
                }

                let agenteData = null;
                let agenteId = null;

                querySnapshot.forEach((docSnap) => {
                    agenteData = docSnap.data();
                    agenteId = docSnap.id;
                });

                // Verificamos si el agente está suspendido
                if (agenteData.estado === "suspendido") {
                    alert("Tu cuenta de agente se encuentra suspendida. Contacta al administrador.");
                    return;
                }

                // Verificamos la contraseña
                if (agenteData.password !== passwordInput) {
                    alert("Contraseña incorrecta.");
                    return;
                }

                // Guardamos la sesión del agente en sessionStorage
                const sesionAgente = {
                    id: agenteId,
                    nombre: agenteData.nombre,
                    usuario: agenteData.usuario,
                    pais: agenteData.pais,
                    provincia: agenteData.provincia,
                    whatsapp: agenteData.whatsapp,
                    creadoPor: agenteData.creadoPor
                };

                sessionStorage.setItem("diti_agente_sesion", JSON.stringify(sesionAgente));

                // Redirección exitosa al panel de agentes
                window.location.replace("panelagentes.html");

            } catch (err) {
                console.error(err);
                alert("Ocurrió un error al intentar iniciar sesión. Inténtalo de nuevo.");
            }
        });
    </script>
</body>
</html>
