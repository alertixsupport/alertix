<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertix - Acceso Administrativo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 50%, #000000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .login-card {
            background: linear-gradient(145deg, #1f1f1f, #0d0d0d);
            border: 1px solid #330000;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ff1a1a, #800000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-area p {
            color: #b3b3b3;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .google-login-btn {
            background: #ffffff;
            color: #333333;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .google-login-btn:hover {
            background: #e6e6e6;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <h1>Alertix</h1>
            <p>Sistema de Alertas y Seguridad Inteligente</p>
        </div>

        <!-- Botón personalizado de inicio de sesión con Google -->
        <button id="login-btn" class="google-login-btn">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Iniciar sesión con Google
        </button>
    </div>

    <!-- Script principal conectándose con app.js -->
    <script type="module">
        import { auth, provider } from "./app.js";
        import { signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const loginBtn = document.getElementById("login-btn");

        loginBtn.addEventListener("click", async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Guardar los datos del usuario en sessionStorage para el panel
                sessionStorage.setItem("alertix_user_email", user.email);
                sessionStorage.setItem("alertix_user_name", user.displayName);

                // Redirigir al panel de administración
                window.location.href = "paneladmin.html";
            } catch (error) {
                console.error("Error al iniciar sesión con Google:", error);
                alert("Hubo un error al iniciar sesión. Inténtalo de nuevo.");
            }
        });
    </script>
</body>
</html>
