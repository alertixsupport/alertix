<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COUT.APP | Panel Ejecutivo de Jefes</title>
  <style>
    :root {
      --bg-deep: #030112;
      --bg-card: rgba(13, 9, 43, 0.75);
      --border-glass: rgba(255, 255, 255, 0.12);
      --border-focus: #ff5500;
      --accent-fire: #ff5500;
      --accent-fire-glow: rgba(255, 85, 0, 0.4);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #160d4a 0%, var(--bg-deep) 100%);
      min-height: 100vh;
      color: var(--text-main);
      padding: 30px 20px;
      position: relative;
    }

    /* Luces de fondo */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: rgba(27, 17, 139, 0.2);
      filter: blur(140px);
      border-radius: 50%;
      top: 0;
      left: 10%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Navbar Ejecutivo */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 30px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      margin-bottom: 35px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fire-icon {
      font-size: 28px;
      animation: flameAnim 1.8s ease-in-out infinite alternate;
      display: inline-block;
      filter: drop-shadow(0 0 10px rgba(255, 85, 0, 0.8));
    }

    @keyframes flameAnim {
      0% { transform: translateY(0) scale(1) rotate(-3deg); }
      50% { transform: translateY(-3px) scale(1.1) rotate(2deg); }
      100% { transform: translateY(-1px) scale(1.05) rotate(-1deg); }
    }

    .logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
    }

    .logo-text span {
      color: var(--accent-fire);
      -webkit-text-fill-color: var(--accent-fire);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff5500 0%, #d33f00 100%);
      color: white;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 85, 0, 0.4);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 85, 0, 0.6);
    }

    /* Modal Formulario Agregar Herramienta */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(3, 1, 18, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 35px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      position: relative;
    }

    .form-card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      color: white;
      font-size: 13px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-fire);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-cancel {
      padding: 12px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    /* Grid de Cards Herramientas */
    .section-title {
      font-size: 18px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 25px;
      font-weight: 700;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .tool-card {
      background: var(--bg-card);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }

    .tool-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 85, 0, 0.5);
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.6),
        0 0 20px rgba(255, 85, 0, 0.2);
    }

    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .tool-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(255, 85, 0, 0.1);
      border: 1px solid rgba(255, 85, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-icon-box svg {
      width: 26px;
      height: 26px;
      fill: var(--accent-fire);
    }

    /* Flechita para ingresar */
    .arrow-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .tool-card:hover .arrow-btn {
      background: var(--accent-fire);
      color: white;
      transform: translateX(4px);
      border-color: var(--accent-fire);
      box-shadow: 0 0 12px var(--accent-fire-glow);
    }

    .tool-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .tool-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navbar / Header -->
    <header>
      <div class="brand">
        <span class="fire-icon">🔥</span>
        <h1 class="logo-text">cout<span>.app</span></h1>
      </div>
      <button class="btn-primary" id="openModalBtn">
        <span>+</span> Agregar Herramienta
      </button>
    </header>

    <h2 class="section-title">Herramientas & Módulos Administrativos</h2>

    <!-- Grid de Cards Dynamic -->
    <div class="cards-grid" id="toolsGrid">
      <!-- Carga en tiempo real desde Firestore -->
    </div>
  </div>

  <!-- Modal para Agregar Herramienta -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="form-card">
      <h2>Agregar Nueva Herramienta</h2>
      <form id="addToolForm">
        <div class="form-group">
          <label for="title">Título de la Herramienta</label>
          <input type="text" id="title" required placeholder="Ej: Control de Préstamos">
        </div>
        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" required placeholder="Ej: Gestión de solicitudes, préstamos activos y cuotas."></textarea>
        </div>
        <div class="form-group">
          <label for="redirectUrl">Redirección (URL o Ruta Local)</label>
          <input type="text" id="redirectUrl" required placeholder="Ej: prestamos.html o https://cout.app/modulo">
        </div>
        <div class="form-group">
          <label for="iconSvg">Icono SVG (Código XML o SVG directo)</label>
          <textarea id="iconSvg" placeholder='<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>'></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar Herramienta</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { db } from '../app.js';
    import { collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const addToolForm = document.getElementById('addToolForm');
    const toolsGrid = document.getElementById('toolsGrid');

    // Icono SVG por defecto si no ingresan uno
    const defaultSvg = `<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>`;

    // Modal Control
    openModalBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));

    // Apuntando exactamente dentro de carpetacout -> configuracion_general -> herramientas
    const toolsRef = collection(db, "carpetacout", "configuracion_general", "herramientas");

    // Guardar Herramienta en Firebase
    addToolForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const redirectUrl = document.getElementById('redirectUrl').value.trim();
      let iconSvg = document.getElementById('iconSvg').value.trim();

      if (!iconSvg) iconSvg = defaultSvg;

      try {
        await addDoc(toolsRef, {
          titulo: title,
          descripcion: description,
          redireccion: redirectUrl,
          icono: iconSvg,
          fechaCreacion: new Date().toISOString()
        });

        addToolForm.reset();
        modalOverlay.classList.remove('active');
      } catch (error) {
        console.error("Error guardando herramienta:", error);
        alert("Error al guardar en Firebase: " + error.message);
      }
    });

    // Leer Herramientas en tiempo real desde Firestore (Sincronizado PC y Celular)
    onSnapshot(toolsRef, (snapshot) => {
      toolsGrid.innerHTML = '';

      if (snapshot.empty) {
        toolsGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
            No hay herramientas agregadas aún. Haz clic en <strong>"+ Agregar Herramienta"</strong> para crear la primera.
          </div>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const tool = docSnap.data();
        const card = document.createElement('a');
        card.className = 'tool-card';
        card.href = tool.redireccion || '#';

        card.innerHTML = `
          <div>
            <div class="tool-header">
              <div class="tool-icon-box">
                ${tool.icono || defaultSvg}
              </div>
              <div class="arrow-btn">&rarr;</div>
            </div>
            <div class="tool-title">${tool.titulo}</div>
            <div class="tool-desc">${tool.descripcion}</div>
          </div>
        `;

        toolsGrid.appendChild(card);
      });
    }, (error) => {
      console.error("Error al escuchar en tiempo real:", error);
    });
  </script>
</body>
</html>
