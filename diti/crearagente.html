<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Creación y Gestión de Agentes</title>
    <style>
        :root {
            --bg-base: #050706;
            --panel-bg: #090d0b;
            --border-subtle: #152219;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0b110e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-base);
            height: 100%;
            height: 100dvh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* HEADER SUPERIOR FIJO ESTRICTO */
        .agent-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-back:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        .agent-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .agent-subtitle {
            font-size: 0.73rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .agent-subtitle strong {
            color: var(--accent-green);
        }

        /* CONTENEDOR PRINCIPAL */
        .agent-main-container {
            flex-grow: 1;
            padding: 85px 20px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: radial-gradient(circle at center, #070a08 0%, #030404 100%);
            -webkit-overflow-scrolling: touch;
        }

        .agent-card {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header-title {
            font-size: 1.02rem;
            font-weight: 600;
            color: #fff;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.78rem;
            font-family: monospace;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-input {
            height: 42px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            padding: 0 16px;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-submit {
            height: 44px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: #00c864;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.35);
        }

        /* SECCIÓN DE LISTA DE AGENTES CREADOS ABAJO */
        .agents-list-section {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .agent-item {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .agent-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .agent-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .agent-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .agent-user-badge {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: var(--accent-green);
            font-size: 0.72rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- Header Superior Fijo -->
    <header class="agent-header">
        <div class="header-left">
            <a href="diti_adminpanel.html" class="btn-back" title="Volver al Panel">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <div>
                <div class="agent-title">Registro de Agentes</div>
                <div class="agent-subtitle">Admin: <strong id="admin-user-tag">...</strong></div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal con Formulario y Lista -->
    <div class="agent-main-container">
        
        <!-- Formulario de Creación -->
        <form class="agent-card" id="agent-form">
            <div class="card-header-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                Nuevo Agente Operativo
            </div>

            <div class="form-group">
                <label class="form-label">Nombre y Apellido</label>
                <input type="text" id="nombre" class="form-input" required placeholder="Ej. Carlos Mendoza" autocomplete="off">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Edad</label>
                    <input type="number" id="edad" class="form-input" required placeholder="Ej. 28" min="18" max="99">
                </div>
                <div class="form-group">
                    <label class="form-label">WhatsApp</label>
                    <input type="tel" id="whatsapp" class="form-input" required placeholder="Ej. +549..." autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Usuario de Acceso</label>
                <input type="text" id="usuario" class="form-input" required placeholder="Nombre de usuario único" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-input" required placeholder="••••••••" autocomplete="off">
            </div>

            <button type="submit" class="btn-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Registrar Agente
            </button>
        </form>

        <!-- Sección inferior con la lista filtrada de agentes creados por este admin -->
        <div class="agents-list-section">
            <div class="card-header-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Agentes Creados por Usted
            </div>
            <div id="agents-list-container" style="display: flex; flex-direction: column; gap: 8px;">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px;">Cargando agentes...</div>
            </div>
        </div>

    </div>

    <!-- Script de Registro y Filtrado con Firebase -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, addDoc, serverTimestamp, query, where, getDocs, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Validación estricta de sesión de administrador activa
        const sesionRaw = sessionStorage.getItem("diti_admin_sesion");
        if (!sesionRaw) window.location.replace("login.html");

        const adminSesion = JSON.parse(sesionRaw);
        document.getElementById("admin-user-tag").innerText = `@${adminSesion.usuario}`;

        const agentForm = document.getElementById("agent-form");
        const agentsListContainer = document.getElementById("agents-list-container");

        // Registrar nuevo agente guardando el creador en Firestore
        agentForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const edad = document.getElementById("edad").value.trim();
            const whatsapp = document.getElementById("whatsapp").value.trim();
            const usuario = document.getElementById("usuario").value.trim().toLowerCase();
            const password = document.getElementById("password").value.trim();

            if (!nombre || !edad || !whatsapp || !usuario || !password) {
                alert("Por favor completa todos los campos.");
                return;
            }

            try {
                // Verificar si el usuario ya existe en diti_usuarioagentes
                const qCheck = query(collection(db, "diti_usuarioagentes"), where("usuario", "==", usuario));
                const querySnapshot = await getDocs(qCheck);

                if (!querySnapshot.empty) {
                    alert("El nombre de usuario ya está registrado. Por favor elija otro.");
                    return;
                }

                // Guardar nuevo agente incluyendo el usuario admin creador
                await addDoc(collection(db, "diti_usuarioagentes"), {
                    nombre,
                    edad: Number(edad),
                    whatsapp,
                    usuario,
                    password,
                    creadoPor: adminSesion.usuario, // Guarda el usuario admin logueado
                    creadoEn: serverTimestamp()
                });

                alert("¡Agente registrado con éxito!");
                agentForm.reset();
            } catch (err) {
                console.error("Error al registrar agente:", err);
                alert("Hubo un error al registrar el agente. Verifique su conexión.");
            }
        });

        // Sincronización en tiempo real filtrando únicamente los agentes creados por este admin
        const qList = query(
            collection(db, "diti_usuarioagentes"), 
            where("creadoPor", "==", adminSesion.usuario)
        );

        onSnapshot(qList, (snapshot) => {
            agentsListContainer.innerHTML = "";
            
            if (snapshot.empty) {
                agentsListContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px;">No ha creado agentes todavía.</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const ag = docSnap.data();
                agentsListContainer.innerHTML += `
                    <div class="agent-item">
                        <div class="agent-info">
                            <span class="agent-name">${ag.nombre}</span>
                            <span class="agent-details">Edad: ${ag.edad} | WA: ${ag.whatsapp}</span>
                        </div>
                        <div class="agent-user-badge">@${ag.usuario}</div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
