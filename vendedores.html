<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alertix - Gestión de Vendedores</title>
    <style>
        :root {
            --bg-base: #070709;
            --bg-surface: rgba(18, 18, 22, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-accent: rgba(220, 20, 60, 0.4);
            --red-primary: #dc143c;
            --red-glow: rgba(220, 20, 60, 0.35);
            --text-main: #f1f1f5;
            --text-muted: #8a8a9e;
            --green-active: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(180, 0, 0, 0.12) 0%, transparent 60%),
                linear-gradient(180deg, #09090d 0%, #040406 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 75px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            z-index: 1000;
            background: rgba(10, 10, 14, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
        }

        @media(min-width: 768px) {
            header { padding: 0 32px; }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            border-color: var(--border-accent);
            background: rgba(220, 20, 60, 0.1);
            box-shadow: 0 0 12px var(--red-glow);
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-dot {
            width: 7px;
            height: 7px;
            background: var(--red-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--red-primary);
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 40%, #a0a0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .counter-badge-header {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            padding: 7px 12px;
            border-radius: 8px;
            display: none;
        }

        @media(min-width: 850px) {
            .counter-badge-header { display: block; }
        }

        .counter-badge-header strong {
            color: #fff;
        }

        .register-btn {
            background: linear-gradient(180deg, rgba(220, 20, 60, 0.9) 0%, rgba(140, 0, 30, 1) 100%);
            border: 1px solid rgba(255, 50, 50, 0.4);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px var(--red-glow);
        }

        @media(min-width: 768px) {
            .register-btn { padding: 9px 18px; font-size: 0.84rem; gap: 8px; }
        }

        .register-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.5);
        }

        main {
            flex: 1;
            padding: 20px 14px;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }

        @media(min-width: 768px) {
            main { padding: 36px 32px; }
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 11px 16px 11px 40px;
            color: #fff;
            font-size: 16px;
            transition: all 0.25s;
        }

        @media(min-width: 768px) {
            .search-box input { font-size: 0.9rem; }
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--red-primary);
            box-shadow: 0 0 12px var(--red-glow);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
        }

        .provincia-dropdown-wrapper {
            position: relative;
        }

        .btn-provincia-icon {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            height: 44px;
            padding: 0 14px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .btn-provincia-icon:hover, .btn-provincia-icon.active {
            border-color: var(--red-primary);
            background: rgba(220, 20, 60, 0.12);
            box-shadow: 0 0 12px var(--red-glow);
        }

        .btn-provincia-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--red-primary);
            flex-shrink: 0;
        }

        .provincia-menu-custom {
            position: absolute;
            top: 50px;
            right: 0;
            width: 260px;
            max-height: 320px;
            background: #0d0d12;
            border: 1px solid var(--border-accent);
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95), 0 0 15px var(--red-glow);
            z-index: 1500;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 6px;
        }

        .provincia-menu-custom.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .provincia-option-item {
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.84rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.15s ease;
        }

        .provincia-option-item:hover, .provincia-option-item.selected {
            background: rgba(220, 20, 60, 0.15);
            color: #fff;
        }

        .provincia-option-item span.count-badge {
            background: rgba(255,255,255,0.06);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--red-primary);
        }

        /* --- CARDS EMPRESARIALES ULTRA COMPACTAS DE ALTO NIVEL --- */
        .vendedores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        @media(min-width: 768px) {
            .vendedores-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 18px;
            }
        }

        .vendedor-card {
            background: linear-gradient(180deg, rgba(22, 22, 28, 0.9) 0%, rgba(12, 12, 16, 0.95) 100%);
            border: 1px solid var(--border-subtle);
            border-top: 2px solid rgba(220, 20, 60, 0.6); /* Detalle de acento superior estilo enterprise */
            border-radius: 12px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .vendedor-card:hover {
            transform: translateY(-2px);
            border-color: rgba(220, 20, 60, 0.45);
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.15);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vendedor-info-area {
            min-width: 0;
        }

        .vendedor-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vendedor-provincia {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .visor-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .visor-btn:hover {
            background: var(--red-primary);
            border-color: var(--red-primary);
            color: #fff;
            box-shadow: 0 0 10px var(--red-glow);
        }

        .visor-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .card-metrics-row {
            background: rgba(10, 10, 13, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .metric-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.1;
        }

        /* ANIMACIÓN TITILEO LENTO VERDE */
        .active-status-badge {
            font-size: 0.72rem;
            color: var(--green-active);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 1;
                filter: drop-shadow(0 0 2px rgba(52, 211, 153, 0.3));
            }
            50% {
                opacity: 0.35;
                filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.8));
            }
        }

        /* MODALES Y ESTILOS WIZARD */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 14px;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #0f0f14;
            border: 1px solid var(--border-accent);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95), 0 0 25px var(--red-glow);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-overlay.open .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 22, 0.6);
        }

        .modal-header h3 {
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .modal-close svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: 70vh;
        }

        .wizard-step {
            display: none;
            animation: fadeInStep 0.3s ease forwards;
        }

        .wizard-step.active {
            display: block;
        }

        @keyframes fadeInStep {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wizard-progress {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }

        .progress-dot {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            transition: background 0.3s;
        }

        .progress-dot.active {
            background: var(--red-primary);
            box-shadow: 0 0 8px var(--red-primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-control {
            width: 100%;
            background: rgba(10, 10, 14, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 9px;
            padding: 12px 14px;
            color: #fff;
            font-size: 16px;
            transition: all 0.25s;
        }

        @media(min-width: 768px) {
            .form-control { font-size: 0.9rem; }
        }

        .form-control:focus {
            outline: none;
            border-color: var(--red-primary);
            box-shadow: 0 0 12px var(--red-glow);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8a9e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 22, 0.4);
        }

        .btn-wizard {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            transition: all 0.2s;
        }

        .btn-wizard:hover {
            border-color: var(--border-accent);
            background: rgba(220, 20, 60, 0.1);
        }

        .btn-wizard.primary {
            background: linear-gradient(180deg, rgba(220, 20, 60, 0.9) 0%, rgba(140, 0, 30, 1) 100%);
            border-color: rgba(255, 50, 50, 0.4);
            color: #fff;
            box-shadow: 0 4px 15px var(--red-glow);
        }

        #loading-screen {
            display: none;
            text-align: center;
            padding: 24px 0;
        }

        #loading-screen.active {
            display: block;
        }

        .spinner-ring {
            width: 46px;
            height: 46px;
            border: 3px solid rgba(220, 20, 60, 0.2);
            border-top-color: var(--red-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
            box-shadow: 0 0 15px var(--red-glow);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.85rem;
        }

        .detail-row span:first-child {
            color: var(--text-muted);
        }

        .detail-row span:last-child {
            color: #fff;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="paneladmin.html" class="back-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Panel
            </a>
            <div class="brand-area">
                <div class="brand-dot"></div>
                <h1 class="brand-title">Alertix</h1>
            </div>
        </div>
        <div class="header-right">
            <div class="counter-badge-header" id="header-counter">
                Vendedores Registrados: <strong>0</strong>
            </div>
            <button class="register-btn" onclick="window.abrirWizard()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Registrar Vendedor
            </button>
        </div>
    </header>

    <main>
        <div class="controls-row">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Buscar vendedor, usuario o provincia..." oninput="window.filtrarVendedores()">
            </div>
            
            <div class="provincia-dropdown-wrapper">
                <button class="btn-provincia-icon" id="btnDropdownProvincia" onclick="window.toggleProvinciaMenu()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12.75 3.03v.568c0 .334.148.65.405.864l1.068.89c.442.369.535 1.01.216 1.49l-.51.766a2.25 2.25 0 0 1-1.161.886l-.143.048a1.107 1.107 0 0 0-.57 1.664c.369.555.169 1.307-.427 1.605L9 13.125l.423 1.059a.956.956 0 0 1-1.652.928l-.679-.906a1.125 1.125 0 0 0-1.906.172L4.5 15.75l-.612.153M12.75 3.031a9 9 0 0 0-8.862 12.872M12.75 3.031a9 9 0 0 1 6.69 14.036m0 0-.177-.529A2.25 2.25 0 0 0 17.128 15H16.5l-.324-.324a1.453 1.453 0 0 0-2.328.377l-.036.073a1.586 1.586 0 0 1-.982.816l-.99.282c-.55.157-.894.702-.8 1.267l.073.438c.08.474.49.821.97.821.846 0 1.598.542 1.865 1.345l.215.643m5.276-3.67a9.012 9.012 0 0 1-5.276 3.67m0 0a9 9 0 0 1-10.275-4.835M15.75 9c0 .896-.393 1.7-1.016 2.25" />
                    </svg>
                    <span id="selectedProvText">Todas</span>
                </button>

                <div class="provincia-menu-custom" id="provinciaMenuCustom">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>
        </div>

        <div class="vendedores-grid" id="vendedoresGrid">
            <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">Sincronizando lista de vendedores...</p>
        </div>
    </main>

    <!-- Modal Wizard -->
    <div class="modal-overlay" id="wizardModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="wizardTitle">Registrar Nuevo Vendedor</h3>
                <button class="modal-close" onclick="window.cerrarWizard()">
                    <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="wizard-progress">
                    <div class="progress-dot active" id="dot-1"></div>
                    <div class="progress-dot" id="dot-2"></div>
                    <div class="progress-dot" id="dot-3"></div>
                </div>

                <form id="vendedorForm" onsubmit="event.preventDefault();">
                    <input type="hidden" id="editVendorId" value="">

                    <div class="wizard-step active" id="step-1">
                        <div class="form-group">
                            <label>Nombre y Apellido</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="form-group">
                            <label>Edad</label>
                            <input type="number" id="edad" class="form-control" placeholder="Ej. 28" required>
                        </div>
                        <div class="form-group">
                            <label>Provincia (Argentina)</label>
                            <select id="provincia" class="form-control" required>
                                <option value="" disabled selected>Seleccione una provincia...</option>
                                <option value="Buenos Aires">Buenos Aires</option>
                                <option value="Capital Federal (CABA)">Capital Federal (CABA)</option>
                                <option value="Catamarca">Catamarca</option>
                                <option value="Chaco">Chaco</option>
                                <option value="Chubut">Chubut</option>
                                <option value="Córdoba">Córdoba</option>
                                <option value="Corrientes">Corrientes</option>
                                <option value="Entre Ríos">Entre Ríos</option>
                                <option value="Formosa">Formosa</option>
                                <option value="Jujuy">Jujuy</option>
                                <option value="La Pampa">La Pampa</option>
                                <option value="La Rioja">La Rioja</option>
                                <option value="Mendoza">Mendoza</option>
                                <option value="Misiones">Misiones</option>
                                <option value="Neuquén">Neuquén</option>
                                <option value="Río Negro">Río Negro</option>
                                <option value="Salta">Salta</option>
                                <option value="San Juan">San Juan</option>
                                <option value="San Luis">San Luis</option>
                                <option value="Santa Cruz">Santa Cruz</option>
                                <option value="Santa Fe">Santa Fe</option>
                                <option value="Santiago del Estero">Santiago del Estero</option>
                                <option value="Tierra del Fuego">Tierra del Fuego</option>
                                <option value="Tucumán">Tucumán</option>
                            </select>
                        </div>
                    </div>

                    <div class="wizard-step" id="step-2">
                        <div class="form-group">
                            <label>WhatsApp</label>
                            <input type="text" id="whatsapp" class="form-control" placeholder="Ej. +54 9 11..." required>
                        </div>
                        <div class="form-group">
                            <label>Instagram (Opcional)</label>
                            <input type="text" id="instagram" class="form-control" placeholder="Ej. @juanperez.sales">
                        </div>
                        <div class="form-group">
                            <label>Gmail (Opcional)</label>
                            <input type="email" id="gmail" class="form-control" placeholder="Ej. juan@alertix.com">
                        </div>
                    </div>

                    <div class="wizard-step" id="step-3">
                        <div class="form-group">
                            <label>Usuario Asignado (Login)</label>
                            <input type="text" id="usuarioLogin" class="form-control" placeholder="Ej. jperez" required>
                        </div>
                        <div class="form-group">
                            <label>Clave Asignada (Login)</label>
                            <input type="text" id="claveLogin" class="form-control" placeholder="Ej. Segura123!" required>
                        </div>
                    </div>

                    <div class="wizard-step" id="loading-screen">
                        <div class="spinner-ring"></div>
                        <h4 style="color: #fff; margin-bottom: 6px;">Registrando Vendedor Oficialmente...</h4>
                        <p style="color: var(--text-muted); font-size: 0.82rem;">Sincronizando credenciales en `usuariosvendedores`</p>
                    </div>
                </form>
            </div>
            <div class="modal-footer" id="wizardFooter">
                <button type="button" class="btn-wizard" id="prevBtn" onclick="window.cambiarPaso(-1)" style="display: none;">Anterior</button>
                <div style="flex:1"></div>
                <button type="button" class="btn-wizard primary" id="nextBtn" onclick="window.siguientePaso()">Siguiente</button>
            </div>
        </div>
    </div>

    <!-- Modal Visor Detallado -->
    <div class="modal-overlay" id="visorModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="visorHeaderTitle">Detalle del Vendedor</h3>
                <button class="modal-close" onclick="window.cerrarVisor()">
                    <svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="visorBodyContent">
            </div>
            <div class="modal-footer" id="visorFooter">
                <button type="button" class="btn-wizard" onclick="window.cerrarVisor()">Cerrar</button>
                <button type="button" class="btn-wizard primary" id="btnActivarEdicion">Editar Datos</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "./app.js";
        import { collection, addDoc, doc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const userEmail = sessionStorage.getItem("alertix_user_email");
        if (!userEmail) window.location.href = "googleadmin.html";

        let currentStep = 1;
        let vendedoresCache = [];
        let ventasCache = {};
        let provinciaSeleccionadaFiltro = "TODAS";

        function inicializarDatosEnTiempoReal() {
            onSnapshot(collection(db, "ventasvendedores"), (snapVentas) => {
                ventasCache = {};
                snapVentas.forEach(d => {
                    const dat = d.data();
                    if (dat.vendedorId || dat.usuario) {
                        const key = dat.vendedorId || dat.usuario;
                        ventasCache[key] = dat.totalVentas || dat.cantidad || 0;
                    }
                });
                renderizarVendedores(vendedoresCache);
            });

            const q = query(collection(db, "usuariosvendedores"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                vendedoresCache = [];
                snapshot.forEach(docSnap => {
                    vendedoresCache.push({ id: docSnap.id, ...docSnap.data() });
                });
                sessionStorage.setItem("alertix_vendedores_cache", JSON.stringify(vendedoresCache));
                document.getElementById("header-counter").innerHTML = `Vendedores Registrados: <strong>${vendedoresCache.length}</strong>`;
                actualizarMenuDropdownProvincias(vendedoresCache);
                renderizarVendedores(vendedoresCache);
            });
        }

        const cached = sessionStorage.getItem("alertix_vendedores_cache");
        if (cached) {
            try {
                vendedoresCache = JSON.parse(cached);
                actualizarMenuDropdownProvincias(vendedoresCache);
                renderizarVendedores(vendedoresCache);
            } catch(e) {}
        }
        inicializarDatosEnTiempoReal();

        function calcularAntiguedad(fechaCreacion) {
            if (!fechaCreacion?.toDate) return "Recién registrado";
            const diffMs = new Date() - fechaCreacion.toDate();
            const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            if (diffDias === 0) return "Hoy mismo";
            if (diffDias === 1) return "Hace 1 día";
            if (diffDias < 30) return `Hace ${diffDias} días`;
            const diffMeses = Math.floor(diffDias / 30);
            return `Hace ${diffMeses} ${diffMeses === 1 ? 'mes' : 'meses'}`;
        }

        function renderizarVendedores(lista) {
            const grid = document.getElementById("vendedoresGrid");
            const busqueda = document.getElementById("searchInput").value.toLowerCase();
            const filtrados = lista.filter(v => {
                const matchProv = (provinciaSeleccionadaFiltro === "TODAS" || v.provincia === provinciaSeleccionadaFiltro);
                const matchSearch = (!busqueda || (v.nombre?.toLowerCase().includes(busqueda)) || (v.usuarioLogin?.toLowerCase().includes(busqueda)) || (v.provincia?.toLowerCase().includes(busqueda)));
                return matchProv && matchSearch;
            });

            if (filtrados.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">No se encontraron vendedores registrados.</p>`;
                return;
            }

            let html = "";
            filtrados.forEach(v => {
                const totalVentas = ventasCache[v.id] || ventasCache[v.usuarioLogin] || 0;
                html += `
                    <div class="vendedor-card">
                        <div class="card-top">
                            <div class="vendedor-info-area">
                                <div class="vendedor-name">${v.nombre}</div>
                                <div class="vendedor-provincia">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                    ${v.provincia}
                                </div>
                            </div>
                            <button class="visor-btn" onclick="window.abrirVisor('${v.id}')" title="Ver detalles y antigüedad">
                                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <div class="card-metrics-row">
                            <div>
                                <span class="metric-label">Ventas</span>
                                <div class="metric-number">${totalVentas}</div>
                            </div>
                            <span class="active-status-badge">● Activo</span>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function actualizarMenuDropdownProvincias(lista) {
            const menuEl = document.getElementById("provinciaMenuCustom");
            const conteoProv = {};
            lista.forEach(v => {
                const p = v.provincia || "Otras";
                conteoProv[p] = (conteoProv[p] || 0) + 1;
            });

            let itemsHtml = `
                <div class="provincia-option-item ${provinciaSeleccionadaFiltro === 'TODAS' ? 'selected' : ''}" onclick="window.seleccionarProvincia('TODAS', 'Todas')">
                    <span>Todas las provincias</span>
                    <span class="count-badge">${lista.length}</span>
                </div>
            `;

            for (const [prov, count] of Object.entries(conteoProv)) {
                itemsHtml += `
                    <div class="provincia-option-item ${provinciaSeleccionadaFiltro === prov ? 'selected' : ''}" onclick="window.seleccionarProvincia('${prov}', '${prov}')">
                        <span>${prov}</span>
                        <span class="count-badge">${count}</span>
                    </div>
                `;
            }
            menuEl.innerHTML = itemsHtml;
        }

        window.toggleProvinciaMenu = function() {
            const menu = document.getElementById("provinciaMenuCustom");
            const btn = document.getElementById("btnDropdownProvincia");
            menu.classList.toggle("open");
            btn.classList.toggle("active");
        };

        window.seleccionarProvincia = function(valor, label) {
            provinciaSeleccionadaFiltro = valor;
            document.getElementById("selectedProvText").innerText = label;
            document.getElementById("provinciaMenuCustom").classList.remove("open");
            document.getElementById("btnDropdownProvincia").classList.remove("active");
            actualizarMenuDropdownProvincias(vendedoresCache);
            renderizarVendedores(vendedoresCache);
        };

        document.addEventListener("click", (e) => {
            const wrapper = document.querySelector(".provincia-dropdown-wrapper");
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById("provinciaMenuCustom").classList.remove("open");
                document.getElementById("btnDropdownProvincia").classList.remove("active");
            }
        });

        window.filtrarVendedores = function() {
            renderizarVendedores(vendedoresCache);
        };

        window.abrirWizard = function(isEdit = false, vendorData = null) {
            currentStep = 1;
            document.getElementById("vendedorForm").reset();
            document.getElementById("loading-screen").classList.remove("active");
            document.getElementById("step-1").classList.add("active");
            document.getElementById("step-2").classList.remove("active");
            document.getElementById("step-3").classList.remove("active");
            document.getElementById("prevBtn").style.display = "none";
            document.getElementById("nextBtn").innerText = "Siguiente";
            document.getElementById("wizardFooter").style.display = "flex";
            
            if (isEdit && vendorData) {
                document.getElementById("wizardTitle").innerText = "Editar Datos del Vendedor";
                document.getElementById("editVendorId").value = vendorData.id;
                document.getElementById("nombre").value = vendorData.nombre || "";
                document.getElementById("edad").value = vendorData.edad || "";
                document.getElementById("provincia").value = vendorData.provincia || "";
                document.getElementById("whatsapp").value = vendorData.whatsapp || "";
                document.getElementById("instagram").value = vendorData.instagram || "";
                document.getElementById("gmail").value = vendorData.gmail || "";
                document.getElementById("usuarioLogin").value = vendorData.usuarioLogin || "";
                document.getElementById("claveLogin").value = vendorData.claveLogin || "";
            } else {
                document.getElementById("wizardTitle").innerText = "Registrar Nuevo Vendedor";
                document.getElementById("editVendorId").value = "";
            }

            actualizarProgdots();
            document.getElementById("wizardModal").classList.add("open");
        };

        window.cerrarWizard = function() {
            document.getElementById("wizardModal").classList.remove("open");
        };

        window.cambiarPaso = function(dir) {
            const step1 = document.getElementById("step-1");
            const step2 = document.getElementById("step-2");
            const step3 = document.getElementById("step-3");

            if (currentStep === 1 && dir === 1) {
                if (!document.getElementById("nombre").value || !document.getElementById("edad").value || !document.getElementById("provincia").value) {
                    alert("Por favor complete los campos obligatorios del Paso 1.");
                    return;
                }
                step1.classList.remove("active");
                step2.classList.add("active");
                currentStep = 2;
                document.getElementById("prevBtn").style.display = "inline-block";
            } else if (currentStep === 2 && dir === 1) {
                if (!document.getElementById("whatsapp").value) {
                    alert("El número de WhatsApp es obligatorio.");
                    return;
                }
                step2.classList.remove("active");
                step3.classList.add("active");
                currentStep = 3;
                document.getElementById("nextBtn").innerText = "Registrar Vendedor Oficialmente";
            } else if (currentStep === 2 && dir === -1) {
                step2.classList.remove("active");
                step1.classList.add("active");
                currentStep = 1;
                document.getElementById("prevBtn").style.display = "none";
            } else if (currentStep === 3 && dir === -1) {
                step3.classList.remove("active");
                step2.classList.add("active");
                currentStep = 2;
                document.getElementById("nextBtn").innerText = "Siguiente";
            } else if (currentStep === 3 && dir === 1) {
                ejecutarCargaRegistro();
            }
            actualizarProgdots();
        };

        window.siguientePaso = function() {
            window.cambiarPaso(1);
        };

        function actualizarProgdots() {
            document.getElementById("dot-1").className = `progress-dot ${currentStep >= 1 ? 'active' : ''}`;
            document.getElementById("dot-2").className = `progress-dot ${currentStep >= 2 ? 'active' : ''}`;
            document.getElementById("dot-3").className = `progress-dot ${currentStep >= 3 ? 'active' : ''}`;
        }

        async function ejecutarCargaRegistro() {
            const editId = document.getElementById("editVendorId").value;
            const nombre = document.getElementById("nombre").value.trim();
            const edad = document.getElementById("edad").value.trim();
            const provincia = document.getElementById("provincia").value;
            const whatsapp = document.getElementById("whatsapp").value.trim();
            const instagram = document.getElementById("instagram").value.trim();
            const gmail = document.getElementById("gmail").value.trim();
            const usuarioLogin = document.getElementById("usuarioLogin").value.trim();
            const claveLogin = document.getElementById("claveLogin").value.trim();

            if (!usuarioLogin || !claveLogin) {
                alert("Debe ingresar usuario y clave para el login.");
                return;
            }

            document.getElementById("step-3").classList.remove("active");
            document.getElementById("loading-screen").classList.add("active");
            document.getElementById("wizardFooter").style.display = "none";

            setTimeout(async () => {
                try {
                    const payload = {
                        nombre, edad, provincia, whatsapp, instagram, gmail, usuarioLogin, claveLogin
                    };

                    if (editId) {
                        await updateDoc(doc(db, "usuariosvendedores", editId), payload);
                    } else {
                        payload.createdAt = serverTimestamp();
                        await addDoc(collection(db, "usuariosvendedores"), payload);
                    }
                    window.cerrarWizard();
                } catch (err) {
                    console.error("Error guardando vendedor:", err);
                    alert("Error al registrar el vendedor.");
                    document.getElementById("wizardFooter").style.display = "flex";
                    document.getElementById("loading-screen").classList.remove("active");
                    document.getElementById("step-3").classList.add("active");
                }
            }, 3000);
        }

        window.abrirVisor = function(id) {
            const v = vendedoresCache.find(x => x.id === id);
            if (!v) return;

            const fechaReg = v.createdAt?.toDate ? v.createdAt.toDate().toLocaleString() : "Fecha no disponible";
            const antiguedad = calcularAntiguedad(v.createdAt);
            const totalVentas = ventasCache[v.id] || ventasCache[v.usuarioLogin] || 0;

            document.getElementById("visorHeaderTitle").innerText = `Perfil: ${v.nombre}`;
            document.getElementById("visorBodyContent").innerHTML = `
                <div class="detail-row"><span>Nombre y Apellido</span><span>${v.nombre}</span></div>
                <div class="detail-row"><span>Edad</span><span>${v.edad} años</span></div>
                <div class="detail-row"><span>Provincia</span><span>${v.provincia}</span></div>
                <div class="detail-row"><span>WhatsApp</span><span>${v.whatsapp}</span></div>
                <div class="detail-row"><span>Instagram</span><span>${v.instagram || 'No especificado'}</span></div>
                <div class="detail-row"><span>Gmail</span><span>${v.gmail || 'No especificado'}</span></div>
                <div class="detail-row"><span>Usuario de Acceso</span><span>${v.usuarioLogin}</span></div>
                <div class="detail-row"><span>Ventas Totales</span><span>${totalVentas}</span></div>
                <div class="detail-row"><span>Fecha de Registro</span><span>${fechaReg}</span></div>
                <div class="detail-row"><span>Tiempo en la Empresa</span><span style="color:#ff6b6b">${antiguedad}</span></div>
            `;

            document.getElementById("btnActivarEdicion").onclick = () => {
                window.cerrarVisor();
                window.abrirWizard(true, v);
            };

            document.getElementById("visorModal").classList.add("open");
        };

        window.cerrarVisor = function() {
            document.getElementById("visorModal").classList.remove("open");
        };
    </script>
</body>
</html>
