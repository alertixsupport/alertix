<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertix - Gestión de Vendedores</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-base: #050505;
            --bg-surface: #121212;
            --border-subtle: #222222;
            --border-accent: #333333;
            --red-alertix: #ff1a1a;
            --text-main: #ffffff;
            --text-muted: #a6a6a6;
            --green-active: #34d399;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 75px;
            overflow-x: hidden;
            animation: fadeInPage 0.4s ease forwards;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ANIMACIÓN DE SALIDA SUAVE AL CAMBIAR DE PÁGINA */
        body.page-leaving {
            animation: fadeOutPage 0.3s ease forwards;
        }

        @keyframes fadeOutPage {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-15px); }
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            z-index: 1000;
            background: #0a0a0a;
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* BOTÓN PANEL PROFESIONAL */
        .btn-back-panel {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back-panel:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-muted);
            color: #fff;
            transform: translateX(-3px);
        }

        .btn-back-panel svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            transition: transform 0.2s;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-dot {
            width: 7px;
            height: 7px;
            background: var(--red-alertix);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--red-alertix);
        }

        .brand h2 {
            color: #ffffff;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: 6px;
        }

        .btn-primary-red {
            background: var(--red-alertix);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 26, 26, 0.3);
        }

        .btn-primary-red:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* CONTENIDO PRINCIPAL */
        main {
            flex: 1;
            padding: 30px 25px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .filters-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            position: relative;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
        }

        .search-input {
            width: 100%;
            padding: 11px 14px 11px 42px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: white;
            font-size: 0.92rem;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--border-accent);
        }

        /* BOTÓN Y MENÚ DE PROVINCIAS */
        .province-filter-container {
            position: relative;
        }

        .btn-province-toggle {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 45px;
        }

        .btn-province-toggle:hover {
            border-color: var(--border-accent);
            background: #18181f;
        }

        .btn-province-toggle svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
        }

        .province-dropdown-menu {
            position: absolute;
            right: 0;
            top: 52px;
            width: 260px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 500;
            display: none;
            flex-direction: column;
            padding: 8px;
            max-height: 320px;
            overflow-y: auto;
        }

        .province-dropdown-menu.open {
            display: flex;
        }

        .province-option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.86rem;
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .province-option-item:hover, .province-option-item.active {
            background: rgba(255, 26, 26, 0.1);
            color: #fff;
            border-color: rgba(255, 26, 26, 0.3);
        }

        .province-option-badge {
            font-size: 0.72rem;
            background: #1a1a22;
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* GRID DE TARJETAS DE VENDEDORES */
        .vendedores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .vendedor-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 20px;
            position: relative;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .vendedor-card:hover {
            border-color: var(--border-accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        .vendedor-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .vendedor-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .vendedor-location {
            font-size: 0.82rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .vendedor-location svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .btn-inspect-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-inspect-card:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: var(--text-muted);
        }

        .btn-inspect-card svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .vendedor-card-bottom {
            background: #0d0d12;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sales-label-box span:first-child {
            display: block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .sales-label-box span:last-child {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            font-family: monospace;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--green-active);
            font-weight: 600;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--green-active);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green-active);
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 15px;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-overlay.open .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0d12;
        }

        .modal-header h3 {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .modal-close svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.73rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-input, select.action-input {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a1a;
            border: 1px solid var(--border-subtle);
            color: white;
            border-radius: 6px;
            font-size: 0.92rem;
        }

        .action-input:focus {
            outline: none;
            border-color: var(--border-accent);
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0d12;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: rgba(255, 26, 26, 0.1);
            color: #ff4d4d;
            border: 1px solid rgba(255, 26, 26, 0.3);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background: var(--red-alertix);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <!-- BOTÓN PANEL CON FLECHA Y ANIMACIÓN DE SALIDA -->
            <a href="panelvendedor.html" class="btn-back-panel" onclick="window.volverAlPanel(event)">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span>Panel</span>
            </a>
            <div class="brand-area">
                <div class="brand-dot"></div>
                <div class="brand">
                    <h2>ALERTIX</h2>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div class="badge-count" id="contadorVendedores">Vendedores Registrados: 0</div>
            <button class="btn-primary-red" onclick="window.abrirModalRegistro()">+ Registrar Vendedor</button>
        </div>
    </header>

    <main>
        <div class="filters-bar">
            <div class="search-input-wrapper">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar vendedor, usuario o provincia..." oninput="window.filtrarVendedores()">
            </div>

            <!-- FILTRO DE PROVINCIAS -->
            <div class="province-filter-container">
                <button class="btn-province-toggle" onclick="window.toggleProvinceDropdown()" id="btnProvinceLabel">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12.75 3.03v.568c0 .334.148.65.405.864l1.068.89c.442.369.535 1.01.216 1.49l-.51.766a2.25 2.25 0 0 1-1.161.886l-.143.048a1.107 1.107 0 0 0-.57 1.664c.369.555.169 1.307-.427 1.605L9 13.125l.423 1.059a.956.956 0 0 1-1.652.928l-.679-.906a1.125 1.125 0 0 0-1.906.172L4.5 15.75l-.612.153M12.75 3.031a9 9 0 0 0-8.862 12.872M12.75 3.031a9 9 0 0 1 6.69 14.036m0 0-.177-.529A2.25 2.25 0 0 0 17.128 15H16.5l-.324-.324a1.453 1.453 0 0 0-2.328.377l-.036.073a1.586 1.586 0 0 1-.982.816l-.99.282c-.55.157-.894.702-.8 1.267l.073.438c.08.474.49.821.97.821.846 0 1.598.542 1.865 1.345l.215.643m5.276-3.67a9.012 9.012 0 0 1-5.276 3.67m0 0a9 9 0 0 1-10.275-4.835M15.75 9c0 .896-.393 1.7-1.016 2.25" />
                    </svg>
                    <span id="provinceButtonText">Todas</span>
                </button>
                <div class="province-dropdown-menu" id="provinceDropdownMenu">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>
        </div>

        <!-- GRID DE VENDEDORES -->
        <div class="vendedores-grid" id="vendedoresGridContainer">
            <p style="color: var(--text-muted); font-size: 0.88rem; grid-column: 1 / -1; text-align: center; padding: 40px;">Cargando red de vendedores...</p>
        </div>
    </main>

    <!-- MODAL PERFIL -->
    <div class="modal-overlay" id="perfilModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="perfilModalTitle">Perfil de Vendedor</h3>
                <button class="modal-close" onclick="window.cerrarModalPerfil()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="perfilModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn-danger" id="btnEliminarVendedor" onclick="window.eliminarVendedorSeleccionado()">Eliminar Vendedor</button>
                <button type="button" class="btn-secondary" onclick="window.cerrarModalPerfil()">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRO -->
    <div class="modal-overlay" id="registroModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Registrar Nuevo Vendedor</h3>
                <button class="modal-close" onclick="window.cerrarModalRegistro()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="vendedorForm" onsubmit="window.registrarVendedor(event)">
                    <div class="form-group">
                        <label>Nombre y Apellido</label>
                        <input type="text" id="nombreVendedor" class="action-input" placeholder="Ej. Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" id="edadVendedor" class="action-input" placeholder="Ej. 28" required>
                    </div>
                    <div class="form-group">
                        <label>Provincia (Argentina)</label>
                        <select id="provinciaVendedor" class="action-input" required>
                            <option value="" disabled selected>Seleccione una provincia...</option>
                            <option value="Buenos Aires">Buenos Aires</option>
                            <option value="Capital Federal / CABA">Capital Federal / CABA</option>
                            <option value="Catamarca">Catamarca</option>
                            <option value="Chaco">Chaco</option>
                            <option value="Chubut">Chubut</option>
                            <option value="Córdoba">Córdoba</option>
                            <option value="Corrientes">Corrientes</option>
                            <option value="Entre Ríos">Entre Ríos</option>
                            <option value="Formosa">Formosa</option>
                            <option value="Jujuy">Jujuy</option>
                            <option value="La Pampa">La Pampa</option>
                            <option value="La Rioja">La Rioja</option>
                            <option value="Mendoza">Mendoza</option>
                            <option value="Misiones">Misiones</option>
                            <option value="Neuquén">Neuquén</option>
                            <option value="Río Negro">Río Negro</option>
                            <option value="Salta">Salta</option>
                            <option value="San Juan">San Juan</option>
                            <option value="San Luis">San Luis</option>
                            <option value="Santa Cruz">Santa Cruz</option>
                            <option value="Santa Fe">Santa Fe</option>
                            <option value="Santiago del Estero">Santiago del Estero</option>
                            <option value="Tierra del Fuego">Tierra del Fuego</option>
                            <option value="Tucumán">Tucumán</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="text" id="whatsappVendedor" class="action-input" placeholder="Ej. 2342134" required>
                    </div>
                    <div class="form-group">
                        <label>Usuario de Acceso</label>
                        <input type="text" id="usuarioLoginVendedor" class="action-input" placeholder="Ej. aguston" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña / Clave de Login</label>
                        <input type="password" id="claveLoginVendedor" class="action-input" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary-red" style="width: 100%; margin-top: 10px;" id="btnGuardar">Guardar Vendedor</button>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="window.cerrarModalRegistro()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE Y LÓGICA -->
    <script type="module">
        import { db } from "./app.js";
        import { collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let vendedoresCache = {};
        let ventasPorVendedor = {};
        let vendedorIdParaEliminar = null;
        let provinciaSeleccionadaFiltro = "Todas";
        let listaVendedoresGlobal = [];

        // Animación de salida al volver al panel
        window.volverAlPanel = function(event) {
            event.preventDefault();
            document.body.classList.add("page-leaving");
            setTimeout(() => {
                window.location.href = "panelvendedor.html";
            }, 300);
        };

        window.abrirModalRegistro = function() {
            document.getElementById("vendedorForm").reset();
            document.getElementById("registroModal").classList.add("open");
        };

        window.cerrarModalRegistro = function() {
            document.getElementById("registroModal").classList.remove("open");
        };

        window.cerrarModalPerfil = function() {
            document.getElementById("perfilModal").classList.remove("open");
        };

        window.toggleProvinceDropdown = function() {
            document.getElementById("provinceDropdownMenu").classList.toggle("open");
        };

        window.addEventListener("click", (e) => {
            if (!e.target.closest(".province-filter-container")) {
                const menu = document.getElementById("provinceDropdownMenu");
                if (menu) menu.classList.remove("open");
            }
        });

        window.registrarVendedor = async function(event) {
            event.preventDefault();
            const nombre = document.getElementById("nombreVendedor").value.trim();
            const edad = document.getElementById("edadVendedor").value.trim();
            const provincia = document.getElementById("provinciaVendedor").value;
            const whatsapp = document.getElementById("whatsappVendedor").value.trim();
            const usuarioLogin = document.getElementById("usuarioLoginVendedor").value.trim();
            const claveLogin = document.getElementById("claveLoginVendedor").value.trim();

            const btn = document.getElementById("btnGuardar");
            btn.disabled = true;
            btn.innerText = "Registrando...";

            try {
                await addDoc(collection(db, "usuariosvendedores"), {
                    nombre,
                    edad,
                    provincia,
                    whatsapp,
                    usuarioLogin,
                    claveLogin,
                    gmail: "",
                    instagram: "",
                    createdAt: serverTimestamp()
                });

                alert("¡Vendedor registrado con éxito!");
                window.cerrarModalRegistro();
            } catch (err) {
                console.error("Error al registrar vendedor:", err);
                alert("Ocurrió un error al registrar el vendedor.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Guardar Vendedor";
            }
        };

        function escucharVentas() {
            onSnapshot(collection(db, "ventasvendedores"), (snapshot) => {
                ventasPorVendedor = {};
                snapshot.forEach(d => {
                    const data = d.data();
                    const vId = data.vendedorId;
                    if (vId) {
                        ventasPorVendedor[vId] = (ventasPorVendedor[vId] || 0) + 1;
                    }
                });
                renderizarPantalla();
            });
        }

        function escucharVendedores() {
            onSnapshot(collection(db, "usuariosvendedores"), (snapshot) => {
                vendedoresCache = {};
                listaVendedoresGlobal = [];
                snapshot.forEach(d => {
                    const data = d.data();
                    vendedoresCache[d.id] = { id: d.id, ...data };
                    listaVendedoresGlobal.push({ id: d.id, ...data });
                });

                document.getElementById("contadorVendedores").innerText = `Vendedores Registrados: ${listaVendedoresGlobal.length}`;
                actualizarMenuProvincias();
                renderizarPantalla();
            });
        }

        function actualizarMenuProvincias() {
            const conteoProvincias = {};
            let total = listaVendedoresGlobal.length;

            listaVendedoresGlobal.forEach(v => {
                const prov = v.provincia || "Sin provincia";
                conteoProvincias[prov] = (conteoProvincias[prov] || 0) + 1;
            });

            let html = `
                <div class="province-option-item ${provinciaSeleccionadaFiltro === 'Todas' ? 'active' : ''}" onclick="window.seleccionarProvinciaFiltro('Todas')">
                    <span>Todas las provincias</span>
                    <span class="province-option-badge">${total}</span>
                </div>
            `;

            for (const [prov, count] of Object.entries(conteoProvincias)) {
                html += `
                    <div class="province-option-item ${provinciaSeleccionadaFiltro === prov ? 'active' : ''}" onclick="window.seleccionarProvinciaFiltro('${prov}')">
                        <span>${prov}</span>
                        <span class="province-option-badge">${count}</span>
                    </div>
                `;
            }

            document.getElementById("provinceDropdownMenu").innerHTML = html;
        }

        window.seleccionarProvinciaFiltro = function(prov) {
            provinciaSeleccionadaFiltro = prov;
            document.getElementById("provinceButtonText").innerText = prov === "Todas" ? "Todas" : prov;
            document.getElementById("provinceDropdownMenu").classList.remove("open");
            actualizarMenuProvincias();
            renderizarPantalla();
        };

        function renderizarPantalla() {
            const container = document.getElementById("vendedoresGridContainer");
            const filtroTexto = document.getElementById("searchInput").value.toLowerCase();

            const filtrados = listaVendedoresGlobal.filter(v => {
                const nombre = (v.nombre || "").toLowerCase();
                const usuario = (v.usuarioLogin || "").toLowerCase();
                const provincia = (v.provincia || "").toLowerCase();
                
                const cumpleTexto = nombre.includes(filtroTexto) || usuario.includes(filtroTexto) || provincia.includes(filtroTexto);
                const cumpleProvincia = provinciaSeleccionadaFiltro === "Todas" || v.provincia === provinciaSeleccionadaFiltro;

                return cumpleTexto && cumpleProvincia;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); font-size: 0.88rem; grid-column: 1 / -1; text-align: center; padding: 40px;">No se encontraron vendedores para este filtro.</p>`;
                return;
            }

            let html = "";
            filtrados.forEach(v => {
                const totalVentas = ventasPorVendedor[v.id] || 0;
                html += `
                    <div class="vendedor-card">
                        <div class="vendedor-card-top">
                            <div class="vendedor-info">
                                <h3>${v.nombre || 'Sin Nombre'}</h3>
                                <div class="vendedor-location">
                                    <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                    <span>${v.provincia || 'Sin provincia'}</span>
                                </div>
                            </div>
                            <button class="btn-inspect-card" onclick="window.abrirPerfilVendedor('${v.id}')" title="Ver perfil y detalles">
                                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <div class="vendedor-card-bottom">
                            <div class="sales-label-box">
                                <span>Ventas</span>
                                <span>${totalVentas}</span>
                            </div>
                            <div class="status-indicator">
                                <div class="status-dot"></div>
                                Activo
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.filtrarVendedores = function() {
            renderizarPantalla();
        };

        window.abrirPerfilVendedor = function(id) {
            const v = vendedoresCache[id];
            if (!v) return;

            vendedorIdParaEliminar = id;
            const totalVentas = ventasPorVendedor[id] || 0;
            const fechaStr = v.createdAt?.toDate ? v.createdAt.toDate().toLocaleString() : "Reciente";

            document.getElementById("perfilModalTitle").innerText = `Perfil: ${v.nombre || ''}`;
            const body = document.getElementById("perfilModalBody");
            body.innerHTML = `
                <div class="form-group">
                    <label>Nombre y Apellido</label>
                    <input type="text" class="action-input" value="${v.nombre || ''}" readonly>
                </div>
                <div class="form-group">
                    <label>Edad</label>
                    <input type="text" class="action-input" value="${v.edad || '0'} años" readonly>
                </div>
                <div class="form-group">
                    <label>Provincia</label>
                    <input type="text" class="action-input" value="${v.provincia || 'No especificada'}" readonly>
                </div>
                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="text" class="action-input" value="${v.whatsapp || 'No especificado'}" readonly>
                </div>
                <div class="form-group">
                    <label>Instagram</label>
                    <input type="text" class="action-input" value="${v.instagram || 'No especificado'}" readonly>
                </div>
                <div class="form-group">
                    <label>Gmail</label>
                    <input type="text" class="action-input" value="${v.gmail || 'No especificado'}" readonly>
                </div>
                <div class="form-group">
                    <label>Usuario de Acceso</label>
                    <input type="text" class="action-input" value="${v.usuarioLogin || ''}" readonly style="color: var(--green-active); font-weight: 700;">
                </div>
                <div class="form-group">
                    <label>Ventas Totales</label>
                    <input type="text" class="action-input" value="${totalVentas}" readonly>
                </div>
                <div class="form-group">
                    <label>Fecha de Registro</label>
                    <input type="text" class="action-input" value="${fechaStr}" readonly>
                </div>
            `;
            document.getElementById("perfilModal").classList.add("open");
        };

        window.eliminarVendedorSeleccionado = async function() {
            if (!vendedorIdParaEliminar) return;

            if (confirm("¿Estás seguro de eliminar este vendedor? Perderá acceso inmediato al sistema y sus credenciales de login.")) {
                try {
                    await deleteDoc(doc(db, "usuariosvendedores", vendedorIdParaEliminar));
                    alert("Vendedor eliminado correctamente.");
                    window.cerrarModalPerfil();
                } catch (err) {
                    console.error("Error al eliminar vendedor:", err);
                    alert("Ocurrió un error al intentar eliminar el vendedor.");
                }
            }
        };

        escucharVentas();
        escucharVendedores();
    </script>
</body>
</html>
