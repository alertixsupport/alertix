
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Acceso Administrativo</title>
    <style>
        :root {
            --bg-base: #060707;
            --panel-bg: #0b0d0c;
            --border-subtle: #18221b;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0e1210;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 230, 118, 0.03);
        }

        /* LOGO CENTRALIZADO */
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .diti-logo-title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffffff;
            display: inline-flex;
            align-items: baseline;
            gap: 2px;
        }

        .diti-logo-title .green-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px var(--accent-green);
            margin-left: 2px;
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        .diti-logo-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* TARJETA DE DETECCIÓN DE NOMBRE EN TIEMPO REAL */
        .detected-admin-card {
            background: rgba(0, 230, 118, 0.05);
            border: 1px solid rgba(0, 230, 118, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            animation: fadeInCard 0.3s ease;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detected-info span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detected-info strong {
            font-size: 0.9rem;
            color: var(--accent-green);
        }

        /* FORMULARIO Y CASILLAS */
        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            pointer-events: none;
            transition: color 0.2s;
        }

        .field-group input {
            width: 100%;
            height: 46px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            padding: 0 16px 0 44px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .field-group input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
        }

        .field-group input:focus ~ .input-icon {
            color: var(--accent-green);
        }

        /* BOTÓN CON ANIMACIÓN DE CARGA EMPRESARIAL */
        .btn-submit {
            width: 100%;
            height: 46px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            background: #00c864;
            box-shadow: 0 0 18px rgba(0, 230, 118, 0.4);
            transform: translateY(-1px);
        }

        /* SPINNER DE CARGA CORPORATIVO */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .error-message {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff6666;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logotipo Corporativo -->
        <div class="brand-header">
            <div class="diti-logo-title">
                diti<span class="green-dot"></span>app
            </div>
            <div class="diti-logo-subtitle">Acceso Gerencial Autorizado</div>
        </div>

        <!-- Mensaje de Error -->
        <div class="error-message" id="error-alert">
            Credenciales incorrectas o usuario no autorizado.
        </div>

        <!-- Tarjeta de Detección Automática de Nombre -->
        <div class="detected-admin-card" id="detected-card">
            <div class="detected-info">
                <span>Administrador Reconocido</span>
                <strong id="detected-name">-</strong>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <!-- Formulario de Login -->
        <form id="login-form">
            <div class="field-group">
                <label>Usuario Asignado</label>
                <div class="input-wrapper">
                    <input type="text" id="login-usuario" required placeholder="Ej. cmendoza_diti" autocomplete="username">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                </div>
            </div>

            <div class="field-group">
                <label>Contraseña de Seguridad</label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-login">
                <span id="btn-text">Iniciar Sesión</span>
                <div class="spinner" id="btn-spinner"></div>
                <svg id="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>

        <div class="login-footer">
            Sistema de Seguridad Interno — Diti Enterprise
        </div>
    </div>

    <!-- Script de Autenticación y Detección en Tiempo Real -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const inputUsuario = document.getElementById("login-usuario");
        const detectedCard = document.getElementById("detected-card");
        const detectedName = document.getElementById("detected-name");
        const loginForm = document.getElementById("login-form");
        const errorAlert = document.getElementById("error-alert");
        const btnLogin = document.getElementById("btn-login");
        const btnText = document.getElementById("btn-text");
        const btnSpinner = document.getElementById("btn-spinner");
        const btnArrow = document.getElementById("btn-arrow");

        // Reproductor de sonido sintetizado profesional (Web Audio API)
        function reproducirSonidoExito() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // Sube a A5

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {
                // Navegadores con restricciones de audio previo
            }
        }

        let timeoutBusqueda = null;
        let ultimoUsuarioDetectado = "";

        // Detectar al escribir el usuario en tiempo real
        inputUsuario.addEventListener("input", (e) => {
            const usuarioVal = e.target.value.trim();
            clearTimeout(timeoutBusqueda);

            if (usuarioVal.length < 3) {
                detectedCard.style.display = "none";
                ultimoUsuarioDetectado = "";
                return;
            }

            timeoutBusqueda = setTimeout(async () => {
                if (usuarioVal === ultimoUsuarioDetectado) return;

                try {
                    const q = query(collection(db, "diti_usuariosadmin"), where("usuario", "==", usuarioVal));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        let nombreAdmin = "";
                        querySnapshot.forEach((docSnap) => {
                            nombreAdmin = docSnap.data().nombre;
                        });

                        detectedName.innerText = nombreAdmin;
                        detectedCard.style.display = "flex";
                        ultimoUsuarioDetectado = usuarioVal;
                        
                        // Reproducir sonidito profesional de detección exitosa
                        reproducirSonidoExito();
                    } else {
                        detectedCard.style.display = "none";
                        ultimoUsuarioDetectado = "";
                    }
                } catch (err) {
                    console.error("Error buscando usuario:", err);
                }
            }, 400); // Espera 400ms tras dejar de escribir
        });

        // Enviar formulario e iniciar sesión con animación de carga
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorAlert.style.display = "none";
            
            const usuarioIngresado = inputUsuario.value.trim();
            const passwordIngresado = document.getElementById("login-password").value.trim();

            // Activar animación de carga empresarial
            btnText.innerText = "Verificando Credenciales...";
            btnSpinner.style.display = "block";
            btnArrow.style.display = "none";
            btnLogin.disabled = true;

            try {
                const q = query(collection(db, "diti_usuariosadmin"), where("usuario", "==", usuarioIngresado));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    mostrarError("El usuario ingresado no existe en el sistema.");
                    return;
                }

                let adminEncontrado = null;
                querySnapshot.forEach((docSnap) => {
                    adminEncontrado = { id: docSnap.id, ...docSnap.data() };
                });

                if (adminEncontrado.password !== passwordIngresado) {
                    mostrarError("Contraseña incorrecta. Verifique sus datos.");
                    return;
                }

                // Guardar sesión
                sessionStorage.setItem("diti_admin_sesion", JSON.stringify({
                    id: adminEncontrado.id,
                    nombre: adminEncontrado.nombre,
                    usuario: adminEncontrado.usuario,
                    provincia: adminEncontrado.provincia,
                    tipoAcceso: adminEncontrado.tipoAcceso,
                    permisosMenu: adminEncontrado.permisosMenu || []
                }));

                // Redirección exitosa
                window.location.href = "diti_adminpanel.html";

            } catch (error) {
                console.error("Error en el login:", error);
                mostrarError("Error de conexión con la base de datos.");
            } finally {
                btnText.innerText = "Iniciar Sesión";
                btnSpinner.style.display = "none";
                btnArrow.style.display = "block";
                btnLogin.disabled = false;
            }
        });

        function mostrarError(mensaje) {
            errorAlert.innerText = mensaje;
            errorAlert.style.display = "block";
            btnText.innerText = "Iniciar Sesión";
            btnSpinner.style.display = "none";
            btnArrow.style.display = "block";
            btnLogin.disabled = false;
        }
    </script>
</body>
</html>
