<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertix - Gestión de Menú</title>
    <style>
        :root {
            --bg-base: #070709;
            --bg-surface: rgba(18, 18, 22, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-accent: rgba(220, 20, 60, 0.4);
            --red-primary: #dc143c;
            --red-glow: rgba(220, 20, 60, 0.35);
            --text-main: #f1f1f5;
            --text-muted: #8a8a9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(180, 0, 0, 0.12) 0%, transparent 60%),
                linear-gradient(180deg, #09090d 0%, #040406 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 70px; /* Espacio para el Header Fijo */
        }

        /* Cabecera Completamente Fija (Inmóvil) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            z-index: 1000;
            background: rgba(10, 10, 14, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            border-color: var(--border-accent);
            background: rgba(220, 20, 60, 0.12);
            box-shadow: 0 0 12px var(--red-glow);
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
        }

        /* Contenido Principal */
        main {
            flex: 1;
            padding: 36px 28px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 0.86rem;
            margin-bottom: 28px;
        }

        /* Tarjeta de Formulario */
        .form-card {
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            margin-bottom: 36px;
        }

        .form-card h3 {
            font-size: 1rem;
            color: var(--red-primary);
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: rgba(10, 10, 14, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--red-primary);
            box-shadow: 0 0 10px var(--red-glow);
        }

        .btn-group-form {
            display: flex;
            gap: 12px;
        }

        .submit-btn {
            background: linear-gradient(180deg, rgba(220, 20, 60, 0.9) 0%, rgba(140, 0, 30, 1) 100%);
            border: 1px solid rgba(255, 50, 50, 0.4);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            box-shadow: 0 0 15px var(--red-glow);
            transform: translateY(-1px);
        }

        .cancel-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            display: none;
        }

        /* Lista de Páginas Registradas */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item-row {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .menu-item-row:hover {
            border-color: rgba(220, 20, 60, 0.3);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-icon-preview {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red-primary);
            flex-shrink: 0;
        }

        .item-icon-preview svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .menu-item-info strong {
            display: block;
            font-size: 0.95rem;
            color: #fff;
        }

        .menu-item-info span {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .menu-item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            border-color: var(--border-accent);
            background: rgba(220, 20, 60, 0.1);
        }

        .delete-btn:hover {
            border-color: #ff4d4d;
            background: rgba(255, 0, 0, 0.15);
            color: #ff6b6b;
        }

        .reorder-btns {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .reorder-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            width: 26px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .reorder-btn:hover {
            background: var(--red-primary);
            border-color: var(--red-primary);
        }
    </style>
</head>
<body>

    <!-- Header Fijo -->
    <header>
        <div class="header-left">
            <a href="paneladmin.html" class="back-btn">
                ← Volver al Panel
            </a>
            <h1 class="brand-title">Gestión del Menú Lateral</h1>
        </div>
    </header>

    <main>
        <h2 class="section-title">Administrar Accesos Directos</h2>
        <p class="section-desc">Crea, edita y ordena las páginas que se deplegarán dinámicamente en la consola de Alertix.</p>

        <!-- Formulario (Para Agregar o Editar) -->
        <div class="form-card">
            <h3 id="form-title">Agregar Nueva Página al Menú</h3>
            <form id="menu-form">
                <input type="hidden" id="edit-doc-id" value="">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="titulo">Título de la Página</label>
                        <input type="text" id="titulo" class="form-control" placeholder="Ej. Gestión de Usuarios" required>
                    </div>
                    <div class="form-group">
                        <label for="redireccion">Redirección (.html o URL)</label>
                        <input type="text" id="redireccion" class="form-control" placeholder="Ej. usuarios.html" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="iconoSvg">Código SVG del Icono (Opcional)</label>
                    <textarea id="iconoSvg" class="form-control" rows="2" placeholder='<svg viewBox="0 0 24 24">...</svg>'></textarea>
                </div>

                <div class="btn-group-form">
                    <button type="submit" class="submit-btn" id="save-btn">Guardar en Firestore</button>
                    <button type="button" class="cancel-btn" id="cancel-edit-btn" onclick="resetForm()">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <h3 class="section-title" style="font-size: 1.1rem; margin-bottom: 16px;">Estructura Actual del Menú</h3>
        <div class="items-list" id="menu-items-container">
            <p style="color: var(--text-muted); text-align: center;">Cargando colección de menú...</p>
        </div>
    </main>

    <!-- Script de Integración con Firebase -->
    <script type="module">
        import { db } from "./app.js";
        import { collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const userEmail = sessionStorage.getItem("alertix_user_email");
        if (!userEmail) {
            window.location.href = "googleadmin.html";
        }

        let menuDataCache = []; // Almacena el array de datos locales para el reordenamiento

        // --- Guardar / Editar Documento ---
        const menuForm = document.getElementById("menu-form");
        menuForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("edit-doc-id").value;
            const titulo = document.getElementById("titulo").value.trim();
            const redireccion = document.getElementById("redireccion").value.trim();
            const iconoSvg = document.getElementById("iconoSvg").value.trim() || `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;

            try {
                if (editId) {
                    // Modo Edición
                    await updateDoc(doc(db, "menupanel", editId), {
                        titulo,
                        redireccion,
                        iconoSvg
                    });
                } else {
                    // Modo Creación (Asigna un orden al final)
                    const nuevoOrden = menuDataCache.length + 1;
                    await addDoc(collection(db, "menupanel"), {
                        titulo,
                        redireccion,
                        iconoSvg,
                        orden: nuevoOrden,
                        createdAt: serverTimestamp()
                    });
                }

                resetForm();
                cargarMenuAdmin();
            } catch (error) {
                console.error("Error al guardar en menupanel:", error);
                alert("Ocurrió un error al guardar los datos.");
            }
        });

        // --- Cargar y Verificar la Colección 'menupanel' ---
        async function cargarMenuAdmin() {
            const container = document.getElementById("menu-items-container");
            try {
                const q = query(collection(db, "menupanel"), orderBy("orden", "asc"));
                let querySnapshot = await getDocs(q);

                // SI LA COLECCIÓN ESTÁ VACÍA: Inicializa la colección automáticamente con páginas por defecto
                if (querySnapshot.empty) {
                    await addDoc(collection(db, "menupanel"), {
                        titulo: "Gestión de Menú",
                        redireccion: "menupanel.html",
                        iconoSvg: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>`,
                        orden: 1,
                        createdAt: serverTimestamp()
                    });

                    await addDoc(collection(db, "menupanel"), {
                        titulo: "Gestión de Tarjetas QR",
                        redireccion: "tarjetas.html",
                        iconoSvg: `<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>`,
                        orden: 2,
                        createdAt: serverTimestamp()
                    });

                    // Recarga la consulta ahora con los datos recién creados
                    querySnapshot = await getDocs(q);
                }

                menuDataCache = [];
                let html = "";

                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    const item = { id: documento.id, ...data };
                    menuDataCache.push(item);

                    html += `
                        <div class="menu-item-row">
                            <div class="menu-item-left">
                                <div class="item-icon-preview">${data.iconoSvg}</div>
                                <div class="menu-item-info">
                                    <strong>${data.titulo}</strong>
                                    <span>Destino: ${data.redireccion}</span>
                                </div>
                            </div>
                            <div class="menu-item-actions">
                                <div class="reorder-btns">
                                    <button class="reorder-btn" onclick="moverItem('${documento.id}', 'up')" title="Subir">▲</button>
                                    <button class="reorder-btn" onclick="moverItem('${documento.id}', 'down')" title="Bajar">▼</button>
                                </div>
                                <button class="action-btn" onclick="prepararEdicion('${documento.id}')">Editar</button>
                                <button class="action-btn delete-btn" onclick="eliminarItem('${documento.id}')">Eliminar</button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (error) {
                console.error("Error al cargar menupanel:", error);
                container.innerHTML = `<p style="color: #ff6b6b; text-align: center;">Error al cargar la base de datos.</p>`;
            }
        }

        // --- Mover Items Arriba o Abajo (Reordenamiento) ---
        window.moverItem = async function(id, direccion) {
            const index = menuDataCache.findIndex(item => item.id === id);
            if (index === -1) return;

            if (direccion === 'up' && index > 0) {
                const actual = menuDataCache[index];
                const anterior = menuDataCache[index - 1];

                await updateDoc(doc(db, "menupanel", actual.id), { orden: index });
                await updateDoc(doc(db, "menupanel", anterior.id), { orden: index + 1 });
                cargarMenuAdmin();
            } else if (direccion === 'down' && index < menuDataCache.length - 1) {
                const actual = menuDataCache[index];
                const siguiente = menuDataCache[index + 1];

                await updateDoc(doc(db, "menupanel", actual.id), { orden: index + 2 });
                await updateDoc(doc(db, "menupanel", siguiente.id), { orden: index + 1 });
                cargarMenuAdmin();
            }
        };

        // --- Cargar Datos para Editar ---
        window.prepararEdicion = function(id) {
            const item = menuDataCache.find(i => i.id === id);
            if (!item) return;

            document.getElementById("edit-doc-id").value = item.id;
            document.getElementById("titulo").value = item.titulo;
            document.getElementById("redireccion").value = item.redireccion;
            document.getElementById("iconoSvg").value = item.iconoSvg;

            document.getElementById("form-title").innerText = "Editar Página del Menú";
            document.getElementById("save-btn").innerText = "Actualizar Cambios";
            document.getElementById("cancel-edit-btn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // --- Resetear Formulario ---
        window.resetForm = function() {
            menuForm.reset();
            document.getElementById("edit-doc-id").value = "";
            document.getElementById("form-title").innerText = "Agregar Nueva Página al Menú";
            document.getElementById("save-btn").innerText = "Guardar en Firestore";
            document.getElementById("cancel-edit-btn").style.display = "none";
        };

        // --- Eliminar Registro ---
        window.eliminarItem = async function(id) {
            if (confirm("¿Deseas eliminar este acceso del menú?")) {
                try {
                    await deleteDoc(doc(db, "menupanel", id));
                    cargarMenuAdmin();
                } catch (error) {
                    console.error("Error al eliminar documento:", error);
                }
            }
        };

        cargarMenuAdmin();
    </script>
</body>
</html>
