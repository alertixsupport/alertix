<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Gestión Gerencial de Agentes</title>
    <style>
        :root {
            --bg-base: #050706;
            --panel-bg: #090d0b;
            --border-subtle: #152219;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0b110e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-base);
            height: 100%;
            height: 100dvh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* HEADER SUPERIOR FIJO */
        .agent-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-back:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        .agent-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .agent-subtitle {
            font-size: 0.73rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .agent-subtitle strong {
            color: var(--accent-green);
        }

        /* CONTENEDOR PRINCIPAL */
        .agent-main-container {
            flex-grow: 1;
            padding: 85px 20px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: radial-gradient(circle at center, #070a08 0%, #030404 100%);
            -webkit-overflow-scrolling: touch;
        }

        .agent-card-form {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header-title {
            font-size: 1.02rem;
            font-weight: 600;
            color: #fff;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.78rem;
            font-family: monospace;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-input {
            height: 42px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            padding: 0 16px;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-submit {
            height: 44px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: #00c864;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.35);
        }

        /* SECCIÓN DE LISTA Y STATS DE AGENTES */
        .agents-list-section {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* CARDS PROFESIONALES DE AGENTES */
        .agent-card-item {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .agent-card-item.suspended {
            border-color: rgba(255, 77, 77, 0.4);
            background: rgba(255, 77, 77, 0.03);
        }

        .agent-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .agent-name-role {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .agent-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: #fff;
        }

        .agent-location {
            font-size: 0.74rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .agent-badge-status {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: monospace;
            text-transform: uppercase;
            font-weight: 700;
        }

        .agent-badge-status.active {
            background: rgba(0, 230, 118, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .agent-badge-status.suspended {
            background: rgba(255, 77, 77, 0.12);
            color: #ff6666;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        /* BARRA DE ACCIONES (OJO, EDITAR, SUSPENDER, ELIMINAR) */
        .agent-actions-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px solid rgba(21,34,25,0.5);
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            border-color: var(--accent-green);
            color: #fff;
            background: rgba(0, 230, 118, 0.05);
        }

        .btn-action.danger:hover {
            border-color: #ff4d4d;
            color: #ff6666;
            background: rgba(255, 77, 77, 0.1);
        }

        /* MODALES PROFESIONALES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 4, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            width: 100%;
            max-width: 400px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-detail-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.85rem;
        }

        .modal-detail-label {
            font-size: 0.72rem;
            font-family: monospace;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .modal-detail-val {
            color: #fff;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Header Superior Fijo -->
    <header class="agent-header">
        <div class="header-left">
            <a href="diti_adminpanel.html" class="btn-back" title="Volver al Panel">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <div>
                <div class="agent-title">Central de Agentes</div>
                <div class="agent-subtitle">Admin: <strong id="admin-user-tag">...</strong></div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <div class="agent-main-container">
        
        <!-- Formulario de Creación -->
        <form class="agent-card-form" id="agent-form">
            <div class="card-header-title">
                <span>Nuevo Agente Operativo</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            </div>

            <div class="form-group">
                <label class="form-label">Nombre y Apellido</label>
                <input type="text" id="nombre" class="form-input" required placeholder="Ej. Carlos Mendoza" autocomplete="off">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">País</label>
                    <input type="text" id="pais" class="form-input" required placeholder="Ej. Argentina" autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label">Provincia / Estado</label>
                    <input type="text" id="provincia" class="form-input" required placeholder="Ej. Buenos Aires" autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">WhatsApp</label>
                <input type="tel" id="whatsapp" class="form-input" required placeholder="Ej. +549..." autocomplete="off">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Usuario de Acceso</label>
                    <input type="text" id="usuario" class="form-input" required placeholder="usuario_agente" autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••" autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Registrar Agente
            </button>
        </form>

        <!-- Sección de Lista y Contador de Agentes -->
        <div class="agents-list-section">
            <div class="card-header-title">
                <span>Agentes Creados</span>
                <span id="agent-counter-badge" style="background: rgba(0,230,118,0.15); color: var(--accent-green); border: 1px solid rgba(0,230,118,0.3); font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; font-family: monospace;">0 total</span>
            </div>
            <div id="agents-list-container" style="display: flex; flex-direction: column; gap: 10px;">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px;">Cargando agentes...</div>
            </div>
        </div>

    </div>

    <!-- Modal de Detalles (Ojo) -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal-container">
            <div class="card-header-title">
                <span>Detalles del Agente</span>
                <button class="btn-action" onclick="cerrarModal('detail-modal')">✕</button>
            </div>
            <div id="modal-detail-content" style="display: flex; flex-direction: column; gap: 4px;"></div>
            <button class="btn-submit" onclick="cerrarModal('detail-modal')" style="margin-top: 8px;">Cerrar</button>
        </div>
    </div>

    <!-- Modal de Edición -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-container">
            <div class="card-header-title">
                <span>Editar Agente</span>
                <button class="btn-action" onclick="cerrarModal('edit-modal')">✕</button>
            </div>
            <form id="edit-form" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label class="form-label">Nombre y Apellido</label>
                    <input type="text" id="edit-nombre" class="form-input" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">País</label>
                        <input type="text" id="edit-pais" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Provincia</label>
                        <input type="text" id="edit-provincia" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">WhatsApp</label>
                    <input type="tel" id="edit-whatsapp" class="form-input" required>
                </div>
                <button type="submit" class="btn-submit">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <!-- Script de Gestión Completa con Firebase -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, addDoc, serverTimestamp, query, where, getDocs, onSnapshot, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const sesionRaw = sessionStorage.getItem("diti_admin_sesion");
        if (!sesionRaw) window.location.replace("login.html");

        const adminSesion = JSON.parse(sesionRaw);
        document.getElementById("admin-user-tag").innerText = `@${adminSesion.usuario}`;

        const agentForm = document.getElementById("agent-form");
        const agentsListContainer = document.getElementById("agents-list-container");
        const agentCounterBadge = document.getElementById("agent-counter-badge");

        // Función para calcular tiempo en la empresa (Antigüedad)
        function calcularAntigüedad(fechaCreacion) {
            if (!fechaCreacion) return "Recién ingresado";
            const diffTime = Math.abs(new Date() - fechaCreacion.toDate());
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return "Ingresado hoy";
            if (diffDays === 1) return "Hace 1 día";
            if (diffDays < 30) return `Hace ${diffDays} días`;
            const diffMonths = Math.floor(diffDays / 30);
            if (diffMonths < 12) return `Hace ${diffMonths} mes(es)`;
            const diffYears = Math.floor(diffDays / 365);
            return `Hace ${diffYears} año(s)`;
        }

        // Registrar nuevo agente
        agentForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const pais = document.getElementById("pais").value.trim();
            const provincia = document.getElementById("provincia").value.trim();
            const whatsapp = document.getElementById("whatsapp").value.trim();
            const usuario = document.getElementById("usuario").value.trim().toLowerCase();
            const password = document.getElementById("password").value.trim();

            if (!nombre || !pais || !provincia || !whatsapp || !usuario || !password) {
                alert("Por favor completa todos los campos.");
                return;
            }

            try {
                const qCheck = query(collection(db, "diti_usuarioagentes"), where("usuario", "==", usuario));
                const querySnapshot = await getDocs(qCheck);

                if (!querySnapshot.empty) {
                    alert("El nombre de usuario ya está registrado.");
                    return;
                }

                await addDoc(collection(db, "diti_usuarioagentes"), {
                    nombre,
                    pais,
                    provincia,
                    whatsapp,
                    usuario,
                    password,
                    estado: "activo", // activo o suspendido
                    creadoPor: adminSesion.usuario,
                    creadoEn: serverTimestamp()
                });

                alert("¡Agente registrado con éxito!");
                agentForm.reset();
            } catch (err) {
                console.error("Error al registrar agente:", err);
                alert("Hubo un error al registrar el agente.");
            }
        });

        // Sincronización en tiempo real con contador y filtrado por admin
        const qList = query(
            collection(db, "diti_usuarioagentes"), 
            where("creadoPor", "==", adminSesion.usuario)
        );

        // Almacén temporal de agentes para edición
        let agentesCache = {};

        onSnapshot(qList, (snapshot) => {
            agentsListContainer.innerHTML = "";
            agentCounterBadge.innerText = `${snapshot.size} total`;
            agentesCache = {};

            if (snapshot.empty) {
                agentsListContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px;">No ha creado agentes todavía.</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const ag = docSnap.data();
                const id = docSnap.id;
                agentesCache[id] = ag;

                const isSuspended = ag.estado === "suspendido";
                const antiguedad = calcularAntigüedad(ag.creadoEn);
                const fechaFormateada = ag.creadoEn ? ag.creadoEn.toDate().toLocaleDateString() : "Fecha reciente";

                agentsListContainer.innerHTML += `
                    <div class="agent-card-item ${isSuspended ? 'suspended' : ''}">
                        <div class="agent-card-top">
                            <div class="agent-name-role">
                                <span class="agent-name">${ag.nombre} (@${ag.usuario})</span>
                                <span class="agent-location">📍 ${ag.provincia}, ${ag.pais} | WA: ${ag.whatsapp}</span>
                            </div>
                            <div class="agent-badge-status ${isSuspended ? 'suspended' : 'active'}">
                                ${isSuspended ? 'Suspendido' : 'Activo'}
                            </div>
                        </div>
                        <div style="font-size: 0.72rem; color: var(--text-muted); font-family: monospace;">
                            📅 Alta: ${fechaFormateada} (${antiguedad})
                        </div>
                        <div class="agent-actions-bar">
                            <button class="btn-action" onclick="verDetalles('${id}')" title="Ver Detalles">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                            <button class="btn-action" onclick="abrirEditar('${id}')" title="Editar">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            <button class="btn-action" onclick="toggleSuspender('${id}', '${ag.estado || "activo"}')" title="${isSuspended ? 'Activar' : 'Suspender'}">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                            </button>
                            <button class="btn-action danger" onclick="eliminarAgente('${id}')" title="Eliminar">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
        });

        // Funciones Globales de Acciones Gerenciales
        window.cerrarModal = (modalId) => document.getElementById(modalId).classList.remove("active");

        window.verDetalles = (id) => {
            const ag = agentesCache[id];
            if (!ag) return;
            const fechaFormateada = ag.creadoEn ? ag.creadoEn.toDate().toLocaleString() : "N/D";
            
            document.getElementById("modal-detail-content").innerHTML = `
                <div class="modal-detail-row"><span class="modal-detail-label">Nombre Completo</span><span class="modal-detail-val">${ag.nombre}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">Usuario</span><span class="modal-detail-val">@${ag.usuario}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">Ubicación</span><span class="modal-detail-val">${ag.provincia}, ${ag.pais}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">WhatsApp</span><span class="modal-detail-val">${ag.whatsapp}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">Estado</span><span class="modal-detail-val">${ag.estado || "activo"}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">Fecha de Alta</span><span class="modal-detail-val">${fechaFormateada} (${calcularAntigüedad(ag.creadoEn)})</span></div>
            `;
            document.getElementById("detail-modal").classList.add("active");
        };

        window.abrirEditar = (id) => {
            const ag = agentesCache[id];
            if (!ag) return;
            document.getElementById("edit-id").value = id;
            document.getElementById("edit-nombre").value = ag.nombre;
            document.getElementById("edit-pais").value = ag.pais;
            document.getElementById("edit-provincia").value = ag.provincia;
            document.getElementById("edit-whatsapp").value = ag.whatsapp;
            document.getElementById("edit-modal").classList.add("active");
        };

        document.getElementById("edit-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("edit-id").value;
            try {
                await updateDoc(doc(db, "diti_usuarioagentes", id), {
                    nombre: document.getElementById("edit-nombre").value.trim(),
                    pais: document.getElementById("edit-pais").value.trim(),
                    provincia: document.getElementById("edit-provincia").value.trim(),
                    whatsapp: document.getElementById("edit-whatsapp").value.trim()
                });
                cerrarModal("edit-modal");
                alert("¡Agente actualizado correctamente!");
            } catch (err) {
                alert("Error al actualizar el agente.");
            }
        });

        window.toggleSuspender = async (id, estadoActual) => {
            const nuevoEstado = estadoActual === "suspendido" ? "activo" : "suspendido";
            try {
                await updateDoc(doc(db, "diti_usuarioagentes", id), { estado: nuevoEstado });
            } catch (err) {
                alert("Error al cambiar estado del agente.");
            }
        };

        window.eliminarAgente = async (id) => {
            if (confirm("¿Está seguro de eliminar este agente permanentemente?")) {
                try {
                    await deleteDoc(doc(db, "diti_usuarioagentes", id));
                    alert("Agente eliminado con éxito.");
                } catch (err) {
                    alert("Error al eliminar el agente.");
                }
            }
        };
    </script>
</body>
</html>
