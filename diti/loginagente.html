<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Acceso de Agentes</title>
    <style>
        :root {
            --bg-base: #050706;
            --panel-bg: #090d0b;
            --border-subtle: #152219;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --accent-red: #ff4d4d;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0b110e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 20%, #0b1911 0%, #050706 70%);
            height: 100%;
            height: 100dvh;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* CONTENEDOR PRINCIPAL DEL LOGIN CON ANIMACIÓN */
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin: 16px;
            animation: cardEntrance 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card.detected-valid {
            border-color: rgba(0, 230, 118, 0.35);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 25px rgba(0, 230, 118, 0.08);
        }

        .login-card.shake-error {
            animation: shakeHorizontal 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: rgba(255, 77, 77, 0.5);
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(28px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes shakeHorizontal {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        /* LOGOTIPO TIPOGRÁFICO "diti.app" */
        .brand-text {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
            display: flex;
            align-items: baseline;
            cursor: default;
            user-select: none;
        }

        .brand-text span {
            color: var(--accent-green);
        }

        .login-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .form-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-label {
            font-size: 0.78rem;
            font-family: monospace;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* INDICADOR DEL DETECTOR INTELIGENTE */
        .detector-badge {
            font-size: 0.72rem;
            font-family: monospace;
            padding: 2px 8px;
            border-radius: 6px;
            opacity: 0;
            transform: translateY(4px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .detector-badge.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .detector-badge.checking {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
        }

        .detector-badge.found {
            color: var(--accent-green);
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.25);
        }

        .detector-badge.suspended {
            color: var(--accent-red);
            background: rgba(255, 77, 77, 0.12);
            border: 1px solid rgba(255, 77, 77, 0.25);
        }

        .detector-badge.not-found {
            color: #ffa726;
            background: rgba(255, 167, 38, 0.1);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            height: 46px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: #fff;
            padding: 0 40px 0 16px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
            width: 100%;
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 14px rgba(0, 230, 118, 0.18);
            background: #0d1511;
        }

        .form-input.valid-user {
            border-color: rgba(0, 230, 118, 0.5);
        }

        .input-status-icon {
            position: absolute;
            right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        /* TARJETA MINI DE VISTA PREVIA DEL AGENTE DETECTADO */
        .agent-preview-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.08) 0%, rgba(11, 17, 14, 0.9) 100%);
            border: 1px solid rgba(0, 230, 118, 0.25);
            border-radius: 10px;
            padding: 10px 12px;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-top: -6px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .agent-preview-pill.active {
            max-height: 70px;
            opacity: 1;
            margin-top: 0;
        }

        .preview-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-green);
            color: #000;
            font-weight: 800;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-meta {
            font-size: 0.72rem;
            color: var(--accent-green);
            font-family: monospace;
        }

        /* BOTÓN CON ANIMACIÓN PROFESIONAL DE CLIC / ACCIÓN */
        .btn-submit {
            height: 48px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(0,230,118,0.28);
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover:not(:disabled) {
            background: #00c864;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.45);
            transform: translateY(-2px);
        }

        /* Animación breve y profesional al presionar (Active) */
        .btn-submit:active:not(:disabled) {
            transform: scale(0.96) translateY(0);
            box-shadow: 0 2px 10px rgba(0,230,118,0.2);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0, 230, 118, 0.25);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-card" id="login-card">
        <div class="login-header">
            <!-- Título tipográfico diti.app -->
            <div class="brand-text">diti<span>.app</span></div>
            <div class="login-subtitle">Portal de Acceso para Agentes Operativos</div>
        </div>

        <form id="agent-login-form" class="login-form">
            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label">Usuario</label>
                    <span class="detector-badge" id="detector-badge"></span>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="login-usuario" class="form-input" required placeholder="Ingresa tu usuario" autocomplete="off">
                    <div class="input-status-icon" id="input-status-icon"></div>
                </div>
            </div>

            <!-- Vista previa rápida al detectar agente válido -->
            <div class="agent-preview-pill" id="agent-preview-pill">
                <div class="preview-avatar" id="preview-avatar">AG</div>
                <div class="preview-info">
                    <span class="preview-name" id="preview-name">Nombre del Agente</span>
                    <span class="preview-meta" id="preview-meta">Ubicación • Activo</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" class="form-input" required placeholder="••••••••" autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">
                <span>Ingresar al Panel</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
    </div>

    <!-- Script de Autenticación y Detector Inteligente Rápido -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const loginCard = document.getElementById("login-card");
        const loginForm = document.getElementById("agent-login-form");
        const usuarioInput = document.getElementById("login-usuario");
        const passwordInput = document.getElementById("login-password");
        const detectorBadge = document.getElementById("detector-badge");
        const statusIcon = document.getElementById("input-status-icon");
        const previewPill = document.getElementById("agent-preview-pill");
        const previewAvatar = document.getElementById("preview-avatar");
        const previewName = document.getElementById("preview-name");
        const previewMeta = document.getElementById("preview-meta");
        const btnSubmit = document.getElementById("btn-submit");

        const cacheDeteccion = new Map();
        let agenteDetectadoActual = null;
        let debounceTimer = null;

        function dispararErrorVisual() {
            loginCard.classList.remove("shake-error");
            void loginCard.offsetWidth;
            loginCard.classList.add("shake-error");
        }

        function actualizarUIEstado(estado, data = null) {
            detectorBadge.className = "detector-badge visible";
            usuarioInput.classList.remove("valid-user");
            loginCard.classList.remove("detected-valid");
            previewPill.classList.remove("active");
            statusIcon.innerHTML = "";
            agenteDetectadoActual = null;

            if (estado === "empty") {
                detectorBadge.className = "detector-badge";
                return;
            }

            if (estado === "checking") {
                detectorBadge.classList.add("checking");
                detectorBadge.innerText = "Verificando...";
                statusIcon.innerHTML = `<div class="spinner"></div>`;
                return;
            }

            if (estado === "found" && data) {
                agenteDetectadoActual = data;
                detectorBadge.classList.add("found");
                detectorBadge.innerText = "✓ Agente verificado";
                usuarioInput.classList.add("valid-user");
                loginCard.classList.add("detected-valid");
                statusIcon.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e676" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

                const iniciales = data.nombre ? data.nombre.substring(0, 2).toUpperCase() : "AG";
                previewAvatar.innerText = iniciales;
                previewName.innerText = data.nombre;
                previewMeta.innerText = `${data.provincia}, ${data.pais} • Cuenta Activa`;
                previewPill.classList.add("active");
                return;
            }

            if (estado === "suspended") {
                detectorBadge.classList.add("suspended");
                detectorBadge.innerText = "✕ Cuenta suspendida";
                statusIcon.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
                return;
            }

            if (estado === "not-found") {
                detectorBadge.classList.add("not-found");
                detectorBadge.innerText = "Usuario no encontrado";
                statusIcon.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffa726" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
            }
        }

        async function detectarAgenteRapido(usuarioRaw) {
            const usuarioLimpio = usuarioRaw.trim().toLowerCase();

            if (!usuarioLimpio) {
                actualizarUIEstado("empty");
                return;
            }

            if (cacheDeteccion.has(usuarioLimpio)) {
                const cached = cacheDeteccion.get(usuarioLimpio);
                if (!cached) {
                    actualizarUIEstado("not-found");
                } else if (cached.estado === "suspendido") {
                    actualizarUIEstado("suspended");
                } else {
                    actualizarUIEstado("found", cached);
                }
                return;
            }

            actualizarUIEstado("checking");

            try {
                const q = query(
                    collection(db, "diti_usuarioagentes"),
                    where("usuario", "==", usuarioLimpio)
                );
                const snap = await getDocs(q);

                if (usuarioInput.value.trim().toLowerCase() !== usuarioLimpio) return;

                if (snap.empty) {
                    cacheDeteccion.set(usuarioLimpio, null);
                    actualizarUIEstado("not-found");
                    return;
                }

                let agenteEncontrado = null;
                snap.forEach((docSnap) => {
                    agenteEncontrado = { id: docSnap.id, ...docSnap.data() };
                });

                cacheDeteccion.set(usuarioLimpio, agenteEncontrado);

                if (agenteEncontrado.estado === "suspendido") {
                    actualizarUIEstado("suspended");
                } else {
                    actualizarUIEstado("found", agenteEncontrado);
                }
            } catch (err) {
                console.error("Error en detector rápido:", err);
                actualizarUIEstado("empty");
            }
        }

        usuarioInput.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            const val = usuarioInput.value.trim().toLowerCase();
            if (!val) {
                actualizarUIEstado("empty");
                return;
            }
            if (cacheDeteccion.has(val)) {
                detectarAgenteRapido(val);
                return;
            }
            debounceTimer = setTimeout(() => {
                detectarAgenteRapido(val);
            }, 280);
        });

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const usuarioVal = usuarioInput.value.trim().toLowerCase();
            const passwordVal = passwordInput.value.trim();

            if (!usuarioVal || !passwordVal) {
                dispararErrorVisual();
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<span>Validando acceso...</span>`;

            try {
                let agenteData = agenteDetectadoActual;

                if (!agenteData || agenteData.usuario !== usuarioVal) {
                    const q = query(
                        collection(db, "diti_usuarioagentes"),
                        where("usuario", "==", usuarioVal)
                    );
                    const querySnapshot = await getDocs(q);

                    if (querySnapshot.empty) {
                        dispararErrorVisual();
                        actualizarUIEstado("not-found");
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = `<span>Ingresar al Panel</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
                        return;
                    }

                    querySnapshot.forEach((docSnap) => {
                        agenteData = { id: docSnap.id, ...docSnap.data() };
                    });
                }

                if (agenteData.estado === "suspendido") {
                    dispararErrorVisual();
                    actualizarUIEstado("suspended");
                    alert("Tu cuenta de agente se encuentra suspendida. Contacta al administrador.");
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<span>Ingresar al Panel</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
                    return;
                }

                if (agenteData.password !== passwordVal) {
                    dispararErrorVisual();
                    passwordInput.value = "";
                    passwordInput.focus();
                    alert("Contraseña incorrecta.");
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<span>Ingresar al Panel</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
                    return;
                }

                const sesionAgente = {
                    id: agenteData.id,
                    nombre: agenteData.nombre,
                    usuario: agenteData.usuario,
                    pais: agenteData.pais,
                    provincia: agenteData.provincia,
                    whatsapp: agenteData.whatsapp,
                    creadoPor: agenteData.creadoPor
                };

                sessionStorage.setItem("diti_agente_sesion", JSON.stringify(sesionAgente));
                window.location.replace("panelagentes.html");

            } catch (err) {
                console.error(err);
                dispararErrorVisual();
                alert("Ocurrió un error al intentar iniciar sesión. Inténtalo de nuevo.");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<span>Ingresar al Panel</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
            }
        });
    </script>
</body>
</html>
