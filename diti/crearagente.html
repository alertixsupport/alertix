<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Gestión Gerencial de Agentes</title>
    <style>
        :root {
            --bg-base: #050706;
            --panel-bg: #090d0b;
            --border-subtle: #152219;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0b110e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-base);
            height: 100%;
            height: 100dvh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* HEADER SUPERIOR FIJO */
        .agent-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-back:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        .agent-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .agent-subtitle {
            font-size: 0.73rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .agent-subtitle strong {
            color: var(--accent-green);
        }

        /* CONTENEDOR PRINCIPAL RESPONSIVO */
        .agent-main-container {
            flex-grow: 1;
            padding: 85px 16px 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: radial-gradient(circle at center, #070a08 0%, #030404 100%);
            -webkit-overflow-scrolling: touch;
            width: 100%;
            max-width: 100%;
        }

        @media (min-width: 992px) {
            .agent-main-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: start;
                max-width: 1300px;
                margin: 0 auto;
                padding: 95px 24px 24px 24px;
                gap: 24px;
            }
        }

        /* TARJETAS PRINCIPALES */
        .agent-card-form, .agents-list-section {
            width: 100%;
            max-width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 992px) {
            .agent-card-form, .agents-list-section {
                max-width: none;
                height: calc(100dvh - 120px);
                overflow-y: auto;
            }
        }

        .card-header-title {
            font-size: 1.02rem;
            font-weight: 600;
            color: #fff;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.78rem;
            font-family: monospace;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-input, .form-select {
            height: 44px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            padding: 0 16px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            width: 100%;
        }

        @media (min-width: 992px) {
            .form-input, .form-select {
                font-size: 0.9rem;
            }
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
        }

        .form-select option {
            background: var(--panel-bg);
            color: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 576px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .btn-submit {
            height: 46px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-submit:hover {
            background: #00c864;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.35);
        }

        .agent-counter-badge {
            background: rgba(0,230,118,0.12);
            color: var(--accent-green);
            border: 1px solid rgba(0,230,118,0.3);
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 6px;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* BUSCADOR DE AGENTES */
        .search-container {
            position: relative;
            width: 100%;
            margin-bottom: 2px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            height: 40px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            padding: 0 16px 0 38px;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
        }

        /* ÁREA DE SCROLL DE CARDS */
        .agents-scroll-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* CARDS 3D EMPRESARIALES DE ÉLITE */
        .agent-card-item {
            background: linear-gradient(135deg, #0d1510 0%, #060907 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.25s ease;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .agent-card-item:hover {
            border-color: rgba(0, 230, 118, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(0, 230, 118, 0.12), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .agent-card-item.suspended {
            border-color: rgba(255, 77, 77, 0.4);
            background: linear-gradient(135deg, #140808 0%, #060404 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
        }

        .agent-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .agent-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* AVATAR 3D CON RELIEVE METÁLICO */
        .agent-avatar-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, #14241a 0%, #08110b 100%);
            border: 1px solid rgba(0, 230, 118, 0.25);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(0,230,118,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-green);
            flex-shrink: 0;
        }

        .agent-card-item.suspended .agent-avatar-box {
            color: #ff6666;
            border-color: rgba(255, 77, 77, 0.25);
            background: linear-gradient(135deg, #241414 0%, #110808 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,77,77,0.2);
        }

        .agent-text-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .agent-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .agent-username-tag {
            font-size: 0.75rem;
            color: var(--accent-green);
            font-family: monospace;
        }

        .agent-card-item.suspended .agent-username-tag {
            color: #ff6666;
        }

        .agent-badge-status {
            font-size: 0.68rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            text-transform: uppercase;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .agent-badge-status.active {
            background: rgba(0, 230, 118, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .agent-badge-status.suspended {
            background: rgba(255, 77, 77, 0.12);
            color: #ff6666;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        /* PANEL DE DATOS ESTILO 3D */
        .agent-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(0, 0, 0, 0.45);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(21, 34, 25, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            font-size: 0.76rem;
            font-family: monospace;
            color: var(--text-muted);
        }

        .agent-details-grid div {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .agent-details-grid strong {
            color: #fff;
        }

        .agent-footer-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: monospace;
            padding-top: 2px;
        }

        /* BARRA DE ACCIONES CON RELIEVE 3D */
        .agent-actions-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            padding-top: 10px;
            border-top: 1px solid rgba(21, 34, 25, 0.7);
        }

        .btn-action {
            background: linear-gradient(135deg, #0f1a14 0%, #070d0a 100%);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .btn-action:hover {
            border-color: var(--accent-green);
            color: #fff;
            background: linear-gradient(135deg, #14241a 0%, #0a140f 100%);
            box-shadow: 0 6px 15px rgba(0,230,118,0.2), inset 0 1px 0 rgba(0,230,118,0.2);
            transform: translateY(-1px);
        }

        .btn-action.danger:hover {
            border-color: #ff4d4d;
            color: #ff6666;
            background: linear-gradient(135deg, #241414 0%, #140a0a 100%);
            box-shadow: 0 6px 15px rgba(255,77,77,0.2), inset 0 1px 0 rgba(255,77,77,0.2);
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 4, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-detail-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.85rem;
        }

        .modal-detail-label {
            font-size: 0.72rem;
            font-family: monospace;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .modal-detail-val {
            color: #fff;
            font-weight: 500;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <!-- Header Superior Fijo -->
    <header class="agent-header">
        <div class="header-left">
            <a href="diti_adminpanel.html" class="btn-back" title="Volver al Panel">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <div>
                <div class="agent-title">Central de Agentes</div>
                <div class="agent-subtitle">Admin: <strong id="admin-user-tag">...</strong></div>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <div class="agent-main-container">
        
        <!-- Columna Izquierda: Formulario de Registro -->
        <form class="agent-card-form" id="agent-form">
            <div class="card-header-title">
                <span>Nuevo Agente Operativo</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            </div>

            <div class="form-group">
                <label class="form-label">Nombre y Apellido</label>
                <input type="text" id="nombre" class="form-input" required placeholder="Ej. Carlos Mendoza" autocomplete="off">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">País</label>
                    <select id="pais" class="form-select" required onchange="actualizarProvincias()">
                        <option value="" disabled selected>Seleccione País</option>
                        <option value="Argentina">Argentina</option>
                        <option value="México">México</option>
                        <option value="Colombia">Colombia</option>
                        <option value="Chile">Chile</option>
                        <option value="España">España</option>
                        <option value="Perú">Perú</option>
                        <option value="Uruguay">Uruguay</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Provincia / Estado</label>
                    <select id="provincia" class="form-select" required>
                        <option value="" disabled selected>Seleccione Provincia</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">WhatsApp</label>
                <input type="tel" id="whatsapp" class="form-input" required placeholder="Ej. +549..." autocomplete="off">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Usuario de Acceso</label>
                    <input type="text" id="usuario" class="form-input" required placeholder="usuario_agente" autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••" autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Registrar Agente
            </button>
        </form>

        <!-- Columna Derecha: Lista, Buscador y Contador con Icono 3D de Usuario -->
        <div class="agents-list-section">
            <div class="card-header-title">
                <span>Agentes Creados</span>
                <div class="agent-counter-badge" id="agent-counter-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span id="counter-num">0</span>
                </div>
            </div>

            <!-- Buscador en tiempo real -->
            <div class="search-container">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-agent-input" class="search-input" placeholder="Buscar por nombre, usuario, país..." oninput="filtrarAgentes()" autocomplete="off">
            </div>

            <div class="agents-scroll-area" id="agents-list-container">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px;">Cargando agentes...</div>
            </div>
        </div>

    </div>

    <!-- Modal de Detalles -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal-container">
            <div class="card-header-title">
                <span>Detalles del Agente</span>
                <button class="btn-action" onclick="cerrarModal('detail-modal')">✕</button>
            </div>
            <div id="modal-detail-content" style="display: flex; flex-direction: column; gap: 4px;"></div>
            <button class="btn-submit" onclick="cerrarModal('detail-modal')" style="margin-top: 8px;">Cerrar</button>
        </div>
    </div>

    <!-- Modal de Edición -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-container">
            <div class="card-header-title">
                <span>Editar Agente</span>
                <button class="btn-action" onclick="cerrarModal('edit-modal')">✕</button>
            </div>
            <form id="edit-form" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label class="form-label">Nombre y Apellido</label>
                    <input type="text" id="edit-nombre" class="form-input" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">País</label>
                        <select id="edit-pais" class="form-select" required onchange="actualizarProvinciasEdicion()">
                            <option value="Argentina">Argentina</option>
                            <option value="México">México</option>
                            <option value="Colombia">Colombia</option>
                            <option value="Chile">Chile</option>
                            <option value="España">España</option>
                            <option value="Perú">Perú</option>
                            <option value="Uruguay">Uruguay</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Provincia</label>
                        <select id="edit-provincia" class="form-select" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">WhatsApp</label>
                    <input type="tel" id="edit-whatsapp" class="form-input" required>
                </div>
                <button type="submit" class="btn-submit">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <!-- Script de Gestión -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, addDoc, serverTimestamp, query, where, getDocs, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const sesionRaw = sessionStorage.getItem("diti_admin_sesion");
        if (!sesionRaw) window.location.replace("login.html");

        const adminSesion = JSON.parse(sesionRaw);
        document.getElementById("admin-user-tag").innerText = `@${adminSesion.usuario}`;

        const agentForm = document.getElementById("agent-form");
        const agentsListContainer = document.getElementById("agents-list-container");
        const counterNum = document.getElementById("counter-num");
        const searchInput = document.getElementById("search-agent-input");

        const provinciasPorPais = {
            "Argentina": ["Buenos Aires", "Capital Federal", "Córdoba", "Santa Fe", "Mendoza", "Tucumán", "Entre Ríos", "Salta", "Misiones", "Corrientes", "Chaco", "Santiago del Estero", "San Juan", "Jujuy", "Río Negro", "Neuquén", "Formosa", "Chubut", "San Luis", "Catamarca", "La Rioja", "La Pampa", "Santa Cruz", "Tierra del Fuego"],
            "México": ["Ciudad de México", "Estado de México", "Jalisco", "Nuevo León", "Puebla", "Guanajuato", "Veracruz", "Baja California", "Chihuahua", "Yucatán", "Quintana Roo"],
            "Colombia": ["Bogotá D.C.", "Antioquia", "Valle del Cauca", "Cundinamarca", "Atlántico", "Bolívar", "Santander", "Boyacá"],
            "Chile": ["Región Metropolitana", "Valparaíso", "Biobío", "Antofagasta", "Maule", "La Araucanía"],
            "España": ["Madrid", "Barcelona", "Valencia", "Sevilla", "Zaragoza", "Málaga", "Murcia", "Islas Baleares", "Bizkaia"],
            "Perú": ["Lima", "Arequipa", "La Libertad", "Piura", "Cusco", "Junín", "Lambayeque"],
            "Uruguay": ["Montevideo", "Canelones", "Maldonado", "Salto", "Colonia", "Paysandú"]
        };

        window.actualizarProvincias = () => {
            const paisSelect = document.getElementById("pais").value;
            const provSelect = document.getElementById("provincia");
            provSelect.innerHTML = '<option value="" disabled selected>Seleccione Provincia</option>';
            if (provinciasPorPais[paisSelect]) {
                provinciasPorPais[paisSelect].forEach(prov => {
                    provSelect.innerHTML += `<option value="${prov}">${prov}</option>`;
                });
            }
        };

        window.actualizarProvinciasEdicion = (provActual) => {
            const paisSelect = document.getElementById("edit-pais").value;
            const provSelect = document.getElementById("edit-provincia");
            provSelect.innerHTML = '';
            if (provinciasPorPais[paisSelect]) {
                provinciasPorPais[paisSelect].forEach(prov => {
                    const selected = (prov === provActual) ? 'selected' : '';
                    provSelect.innerHTML += `<option value="${prov}" ${selected}>${prov}</option>`;
                });
            }
        };

        function calcularAntigüedad(fechaCreacion) {
            if (!fechaCreacion) return "Recién ingresado";
            const diffTime = Math.abs(new Date() - fechaCreacion.toDate());
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return "Ingresado hoy";
            if (diffDays === 1) return "Hace 1 día";
            if (diffDays < 30) return `Hace ${diffDays} días`;
            const diffMonths = Math.floor(diffDays / 30);
            if (diffMonths < 12) return `Hace ${diffMonths} mes(es)`;
            const diffYears = Math.floor(diffDays / 365);
            return `Hace ${diffYears} año(s)`;
        }

        agentForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const nombre = document.getElementById("nombre").value.trim();
            const pais = document.getElementById("pais").value.trim();
            const provincia = document.getElementById("provincia").value.trim();
            const whatsapp = document.getElementById("whatsapp").value.trim();
            const usuario = document.getElementById("usuario").value.trim().toLowerCase();
            const password = document.getElementById("password").value.trim();

            if (!nombre || !pais || !provincia || !whatsapp || !usuario || !password) {
                alert("Por favor completa todos los campos.");
                return;
            }

            try {
                const qCheck = query(collection(db, "diti_usuarioagentes"), where("usuario", "==", usuario));
                const querySnapshot = await getDocs(qCheck);

                if (!querySnapshot.empty) {
                    alert("El nombre de usuario ya está registrado.");
                    return;
                }

                await addDoc(collection(db, "diti_usuarioagentes"), {
                    nombre, pais, provincia, whatsapp, usuario, password,
                    estado: "activo",
                    creadoPor: adminSesion.usuario,
                    creadoEn: serverTimestamp()
                });

                alert("¡Agente registrado con éxito!");
                agentForm.reset();
                document.getElementById("provincia").innerHTML = '<option value="" disabled selected>Seleccione Provincia</option>';
            } catch (err) {
                alert("Hubo un error al registrar el agente.");
            }
        });

        const qList = query(collection(db, "diti_usuarioagentes"), where("creadoPor", "==", adminSesion.usuario));
        let agentesCache = {};
        let listaAgentesSnapshot = [];

        onSnapshot(qList, (snapshot) => {
            listaAgentesSnapshot = [];
            agentesCache = {};
            counterNum.innerText = snapshot.size;

            snapshot.forEach((docSnap) => {
                const ag = docSnap.data();
                const id = docSnap.id;
                agentesCache[id] = ag;
                listaAgentesSnapshot.push({ id, ...ag });
            });

            renderizarAgentes(listaAgentesSnapshot);
        });

        window.filtrarAgentes = () => {
            const filtro = searchInput.value.toLowerCase().trim();
            const filtrados = listaAgentesSnapshot.filter(ag => 
                ag.nombre.toLowerCase().includes(filtro) ||
                ag.usuario.toLowerCase().includes(filtro) ||
                ag.pais.toLowerCase().includes(filtro) ||
                ag.provincia.toLowerCase().includes(filtro) ||
                ag.whatsapp.toLowerCase().includes(filtro)
            );
            renderizarAgentes(filtrados);
        };

        function renderizarAgentes(agentes) {
            agentsListContainer.innerHTML = "";

            if (agentes.length === 0) {
                agentsListContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px;">No se encontraron agentes.</div>`;
                return;
            }

            agentes.forEach(ag => {
                const id = ag.id;
                const isSuspended = ag.estado === "suspendido";
                const antiguedad = calcularAntigüedad(ag.creadoEn);
                const fechaFormateada = ag.creadoEn ? ag.creadoEn.toDate().toLocaleDateString() : "Recién";
                const iniciales = ag.nombre ? ag.nombre.substring(0, 2).toUpperCase() : "AG";

                agentsListContainer.innerHTML += `
                    <div class="agent-card-item ${isSuspended ? 'suspended' : ''}">
                        <div class="agent-card-header">
                            <div class="agent-user-info">
                                <div class="agent-avatar-box">${iniciales}</div>
                                <div class="agent-text-meta">
                                    <span class="agent-name">${ag.nombre}</span>
                                    <span class="agent-username-tag">@${ag.usuario}</span>
                                </div>
                            </div>
                            <div class="agent-badge-status ${isSuspended ? 'suspended' : 'active'}">
                                ${isSuspended ? 'Suspendido' : 'Activo'}
                            </div>
                        </div>

                        <div class="agent-details-grid">
                            <div>
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                <strong>${ag.provincia}, ${ag.pais}</strong>
                            </div>
                            <div>
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                <strong>${ag.whatsapp}</strong>
                            </div>
                        </div>

                        <div class="agent-footer-info">
                            <span>Alta: ${fechaFormateada}</span>
                            <span style="color: var(--accent-green);">${antiguedad}</span>
                        </div>

                        <div class="agent-actions-bar">
                            <button class="btn-action" onclick="verDetalles('${id}')" title="Ver Detalles">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                            <button class="btn-action" onclick="abrirEditar('${id}')" title="Editar">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            <button class="btn-action" onclick="toggleSuspender('${id}', '${ag.estado || "activo"}')" title="${isSuspended ? 'Activar' : 'Suspender'}">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                            </button>
                            <button class="btn-action danger" onclick="eliminarAgente('${id}')" title="Eliminar">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        window.cerrarModal = (modalId) => document.getElementById(modalId).classList.remove("active");

        window.verDetalles = (id) => {
            const ag = agentesCache[id];
            if (!ag) return;
            const fechaFormateada = ag.creadoEn ? ag.creadoEn.toDate().toLocaleString() : "N/D";
            document.getElementById("modal-detail-content").innerHTML = `
                <div class="modal-detail-row"><span class="modal-detail-label">Nombre Completo</span><span class="modal-detail-val">${ag.nombre}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">Usuario</span><span class="modal-detail-val">@${ag.usuario}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">Ubicación</span><span class="modal-detail-val">${ag.provincia}, ${ag.pais}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">WhatsApp</span><span class="modal-detail-val">${ag.whatsapp}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">Estado</span><span class="modal-detail-val">${ag.estado || "activo"}</span></div>
                <div class="modal-detail-row"><span class="modal-detail-label">Fecha de Alta</span><span class="modal-detail-val">${fechaFormateada} (${calcularAntigüedad(ag.creadoEn)})</span></div>
            `;
            document.getElementById("detail-modal").classList.add("active");
        };

        window.abrirEditar = (id) => {
            const ag = agentesCache[id];
            if (!ag) return;
            document.getElementById("edit-id").value = id;
            document.getElementById("edit-nombre").value = ag.nombre;
            document.getElementById("edit-pais").value = ag.pais;
            actualizarProvinciasEdicion(ag.provincia);
            document.getElementById("edit-whatsapp").value = ag.whatsapp;
            document.getElementById("edit-modal").classList.add("active");
        };

        document.getElementById("edit-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("edit-id").value;
            try {
                await updateDoc(doc(db, "diti_usuarioagentes", id), {
                    nombre: document.getElementById("edit-nombre").value.trim(),
                    pais: document.getElementById("edit-pais").value.trim(),
                    provincia: document.getElementById("edit-provincia").value.trim(),
                    whatsapp: document.getElementById("edit-whatsapp").value.trim()
                });
                cerrarModal("edit-modal");
                alert("¡Agente actualizado correctamente!");
            } catch (err) {
                alert("Error al actualizar el agente.");
            }
        });

        window.toggleSuspender = async (id, estadoActual) => {
            const nuevoEstado = estadoActual === "suspendido" ? "activo" : "suspendido";
            try {
                await updateDoc(doc(db, "diti_usuarioagentes", id), { estado: nuevoEstado });
            } catch (err) {
                alert("Error al cambiar estado del agente.");
            }
        };

        window.eliminarAgente = async (id) => {
            if (confirm("¿Está seguro de eliminar este agente permanentemente?")) {
                try {
                    await deleteDoc(doc(db, "diti_usuarioagentes", id));
                    alert("Agente eliminado con éxito.");
                } catch (err) {
                    alert("Error al eliminar el agente.");
                }
            }
        };
    </script>
</body>
</html>
