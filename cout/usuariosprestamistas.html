<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Control Corporativo de Prestamistas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #060812;
      --bg-surface: rgba(15, 20, 35, 0.75);
      --bg-surface-hover: rgba(22, 28, 48, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-focus: #3b82f6;
      --accent-brand: #ff5500;
      --accent-glow: rgba(255, 85, 0, 0.25);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      
      --status-active: #10b981;
      --status-active-bg: rgba(16, 185, 129, 0.12);
      --status-suspended: #ef4444;
      --status-suspended-bg: rgba(239, 68, 68, 0.12);
      
      --btn-money: #10b981;
      --btn-contract: #38bdf8;
      --btn-suspend: #f59e0b;
      --btn-edit: #a855f7;
      --btn-delete: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(at 0% 0%, rgba(30, 27, 75, 0.35) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(124, 45, 18, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(15, 23, 42, 0.5) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px;
      width: 100%;
    }

    /* Top Navigation Enterprise */
    header {
      background: var(--bg-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
    }

    @media (min-width: 640px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 85, 0, 0.2) 0%, rgba(124, 45, 18, 0.4) 100%);
      border: 1px solid rgba(255, 85, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .brand-logo-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--accent-brand);
      fill: none;
      stroke-width: 2;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .logo-text span {
      color: var(--accent-brand);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .header-actions {
        width: auto;
      }
    }

    .btn-create-user {
      flex: 1;
      background: linear-gradient(135deg, #ff5500 0%, #c23b00 100%);
      border: none;
      border-radius: 12px;
      height: 42px;
      padding: 0 18px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 85, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-create-user:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(255, 85, 0, 0.45);
    }

    .btn-back {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Panel KPIs + Buscador */
    .dashboard-toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .dashboard-toolbar {
        grid-template-columns: 1fr auto;
        align-items: center;
      }
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--text-tertiary);
      fill: none;
      stroke-width: 2;
    }

    .search-input-wrapper input {
      width: 100%;
      height: 46px;
      padding: 0 16px 0 44px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input-wrapper input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .kpi-pills-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .kpi-pill {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .kpi-pill strong {
      color: var(--text-primary);
      font-weight: 700;
      font-size: 14px;
    }

    /* Lista de Tarjetas de Prestamistas Mejoradas */
    .prestamistas-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .prestamista-card {
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .prestamista-card:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.6);
    }

    .prestamista-card.is-suspended {
      border-color: rgba(239, 68, 68, 0.28);
      background: rgba(239, 68, 68, 0.04);
    }

    @media (min-width: 768px) {
      .prestamista-card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
      }
    }

    .card-user-meta {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .avatar-mesh-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #38bdf8;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .card-user-meta .user-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .user-info .user-header-line {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-info .user-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    /* Badges mejorados en vista previa */
    .user-badges-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .meta-badge svg {
      width: 12px;
      height: 12px;
      stroke: var(--text-tertiary);
      fill: none;
      stroke-width: 2;
    }

    .meta-badge code {
      font-family: 'JetBrains Mono', monospace;
      color: #cbd5e1;
      font-weight: 600;
    }

    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      width: fit-content;
      margin-top: 4px;
    }

    .timer-badge.active {
      background: var(--status-active-bg);
      color: var(--status-active);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .timer-badge.suspended {
      background: var(--status-suspended-bg);
      color: var(--status-suspended);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .timer-badge.active .pulse-dot {
      background: var(--status-active);
      box-shadow: 0 0 8px var(--status-active);
    }

    .timer-badge.suspended .pulse-dot {
      background: var(--status-suspended);
    }

    /* Actions Bar e Íconos Corregidos */
    .card-actions-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      border-top: 1px solid var(--border-subtle);
      padding-top: 14px;
    }

    @media (min-width: 768px) {
      .card-actions-bar {
        border-top: none;
        padding-top: 0;
      }
    }

    .action-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.04);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .action-icon-btn svg {
      width: 18px !important;
      height: 18px !important;
      stroke-width: 2px !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      fill: none !important;
      display: block !important;
    }

    .action-icon-btn.btn-pay svg { stroke: var(--btn-money) !important; }
    .action-icon-btn.btn-pay:hover { background: rgba(16, 185, 129, 0.18); border-color: rgba(16, 185, 129, 0.4); }

    .action-icon-btn.btn-history svg { stroke: var(--btn-contract) !important; }
    .action-icon-btn.btn-history:hover { background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.4); }

    .action-icon-btn.btn-pause svg { stroke: var(--btn-suspend) !important; }
    .action-icon-btn.btn-pause:hover { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.4); }

    .action-icon-btn.btn-edit-usr svg { stroke: var(--btn-edit) !important; }
    .action-icon-btn.btn-edit-usr:hover { background: rgba(168, 85, 247, 0.18); border-color: rgba(168, 85, 247, 0.4); }

    .action-icon-btn.btn-remove-usr svg { stroke: var(--btn-delete) !important; }
    .action-icon-btn.btn-remove-usr:hover { background: rgba(244, 63, 94, 0.18); border-color: rgba(244, 63, 94, 0.4); }

    /* Modales */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(14px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-window {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-backdrop.is-open .modal-window {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-header h3 svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent-brand);
      fill: none;
      stroke-width: 2;
    }

    .form-field {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .input-icon-group {
      position: relative;
    }

    .input-icon-group svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--text-tertiary);
      fill: none;
      stroke-width: 2;
    }

    .input-icon-group input, .input-icon-group select {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 42px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-icon-group input:focus, .input-icon-group select:focus {
      border-color: var(--border-focus);
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-secondary {
      height: 40px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .btn-submit {
      height: 40px;
      padding: 0 18px;
      background: var(--accent-brand);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 85, 0, 0.25);
    }

    .btn-submit:hover {
      background: #e64d00;
      transform: translateY(-1px);
    }

    /* Auditoría Historial */
    .payment-records-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .payment-record-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .payment-record-card .amount {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--status-active);
      font-size: 14px;
    }

    .payment-record-card .time-stamp {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .btn-del-record {
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .btn-del-record:hover {
      color: var(--status-suspended);
    }

    .btn-del-record svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navbar Enterprise -->
    <header>
      <div class="brand-section">
        <div class="brand-logo-icon">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <h1 class="logo-text">cout<span>.app</span></h1>
      </div>

      <div class="header-actions">
        <button class="btn-create-user" id="openRegisterModal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nuevo Prestamista
        </button>
        <a href="paneljefe.html" class="btn-back" title="Volver al Panel Principal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
      </div>
    </header>

    <!-- Toolbar: Buscador + KPIs de Estado -->
    <div class="dashboard-toolbar">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Buscar por nombre, DNI, WhatsApp o usuario...">
      </div>

      <div class="kpi-pills-group">
        <div class="kpi-pill">
          <span>Registrados:</span>
          <strong id="totalUsersCount">0</strong>
        </div>
        <div class="kpi-pill">
          <span style="color: var(--status-active);">Activos:</span>
          <strong id="activeUsersCount">0</strong>
        </div>
      </div>
    </div>

    <!-- Lista de Prestamistas -->
    <div class="prestamistas-grid" id="prestamistasGrid">
      <!-- Carga ultra-rápida desde caché local -->
    </div>
  </div>

  <!-- Modal: Registrar Prestamista -->
  <div class="modal-backdrop" id="registerModalOverlay">
    <div class="modal-window">
      <div class="modal-header">
        <h3>
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle></svg>
          Alta de Prestamista
        </h3>
      </div>
      <form id="createPrestamistaForm">
        <div class="form-field">
          <label for="nombre">Nombre Completo</label>
          <div class="input-icon-group">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="nombre" required placeholder="Ej: Carlos Pérez">
          </div>
        </div>
        <div class="form-field">
          <label for="dni">DNI / Documento</label>
          <div class="input-icon-group">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="7" y1="8" x2="17" y2="8"></line><line x1="7" y1="12" x2="13" y2="12"></line></svg>
            <input type="text" id="dni" required placeholder="Ej: 35123456">
          </div>
        </div>
        <div class="form-field">
          <label for="whatsapp">WhatsApp Directo</label>
          <div class="input-icon-group">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            <input type="text" id="whatsapp" required placeholder="Ej: +5491123456789">
          </div>
        </div>
        <div class="form-field">
          <label for="edad">Edad</label>
          <div class="input-icon-group">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <input type="number" id="edad" min="18" max="100" required placeholder="Ej: 34">
          </div>
        </div>
        <div class="form-field">
          <label for="usuario">Usuario de Sistema</label>
          <div class="input-icon-group">

  <script type="module">
    if (sessionStorage.getItem('cout_auth') !== 'true') {
      window.location.replace('loginjefes.html');
    }

    import { db } from '../app.js';
    import { collection, addDoc, updateDoc, deleteDoc, doc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const openRegisterModal = document.getElementById('openRegisterModal');
    const registerModalOverlay = document.getElementById('registerModalOverlay');
    const closeRegisterModal = document.getElementById('closeRegisterModal');
    const createPrestamistaForm = document.getElementById('createPrestamistaForm');
    
    const moneyModalOverlay = document.getElementById('moneyModalOverlay');
    const closeMoneyModal = document.getElementById('closeMoneyModal');
    const moneyForm = document.getElementById('moneyForm');
    const moneyPrestamistaId = document.getElementById('moneyPrestamistaId');

    const contractModalOverlay = document.getElementById('contractModalOverlay');
    const closeContractModal = document.getElementById('closeContractModal');
    const pagosListContainer = document.getElementById('pagosListContainer');

    const suspendModalOverlay = document.getElementById('suspendModalOverlay');
    const closeSuspendModal = document.getElementById('closeSuspendModal');
    const suspendForm = document.getElementById('suspendForm');
    const suspendPrestamistaId = document.getElementById('suspendPrestamistaId');
    const suspendMode = document.getElementById('suspendMode');
    const quitarCamposGroup = document.getElementById('quitarCamposGroup');

    const editModalOverlay = document.getElementById('editModalOverlay');
    const closeEditModal = document.getElementById('closeEditModal');
    const editForm = document.getElementById('editForm');
    const editPrestamistaId = document.getElementById('editPrestamistaId');

    const prestamistasGrid = document.getElementById('prestamistasGrid');
    const searchInput = document.getElementById('searchInput');
    const totalUsersCount = document.getElementById('totalUsersCount');
    const activeUsersCount = document.getElementById('activeUsersCount');

    const prestamistasRef = collection(db, "carpetacout", "configuracion_general", "usuariosprestamistas");
    let cachedPrestamistas = [];

    // Carga inicial desde LocalStorage
    const localData = localStorage.getItem('cout_cached_prestamistas');
    if (localData) {
      try {
        cachedPrestamistas = JSON.parse(localData);
        renderPrestamistas();
      } catch (e) {
        console.error("Error al decodificar caché", e);
      }
    }

    // Handlers de Modales
    openRegisterModal.addEventListener('click', () => registerModalOverlay.classList.add('is-open'));
    closeRegisterModal.addEventListener('click', () => registerModalOverlay.classList.remove('is-open'));
    closeMoneyModal.addEventListener('click', () => moneyModalOverlay.classList.remove('is-open'));
    closeContractModal.addEventListener('click', () => contractModalOverlay.classList.remove('is-open'));
    closeSuspendModal.addEventListener('click', () => suspendModalOverlay.classList.remove('is-open'));
    closeEditModal.addEventListener('click', () => editModalOverlay.classList.remove('is-open'));

    suspendMode.addEventListener('change', (e) => {
      quitarCamposGroup.style.display = (e.target.value === 'quitar') ? 'block' : 'none';
    });

    searchInput.addEventListener('input', () => renderPrestamistas());

    function formatearFechaLegible(isoString) {
      if (!isoString) return "Fecha N/D";
      const f = new Date(isoString);
      return `${f.toLocaleDateString('es-AR', { day: '2-digit', month: 'short' })} &bull; ${f.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}`;
    }

    async function cargarHistorialPagos(prestamistaId) {
      pagosListContainer.innerHTML = '<div style="text-align: center; color: var(--text-tertiary); padding: 20px;">Cargando registros...</div>';
      contractModalOverlay.classList.add('is-open');

      try {
        const querySnapshot = await getDocs(collection(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "pagos"));
        pagosListContainer.innerHTML = '';

        if (querySnapshot.empty) {
          pagosListContainer.innerHTML = '<div style="text-align: center; color: var(--text-tertiary); padding: 20px;">Sin abonos registrados aún.</div>';
          return;
        }

        querySnapshot.forEach((docPago) => {
          const p = docPago.data();
          const pId = docPago.id;
          const card = document.createElement('div');
          card.className = 'payment-record-card';
          card.innerHTML = `
            <div>
              <div class="amount">$ ${Number(p.monto).toLocaleString('es-AR', { minimumFractionDigits: 2 })}</div>
              <div class="time-stamp">${formatearFechaLegible(p.fechaPago)} &bull; (${p.extensionOtorgada})</div>
            </div>
            <button class="btn-del-record" title="Eliminar auditoría">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          `;

          card.querySelector('.btn-del-record').addEventListener('click', async () => {
            if (confirm("¿Eliminar este registro de abono de la auditoría?")) {
              await deleteDoc(doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "pagos", pId));
              cargarHistorialPagos(prestamistaId);
            }
          });

          pagosListContainer.appendChild(card);
        });
      } catch (err) {
        pagosListContainer.innerHTML = '<div style="text-align: center; color: var(--status-suspended); padding: 20px;">Error de carga.</div>';
      }
    }

    createPrestamistaForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const cantidad = parseInt(document.getElementById('tiempoCantidad').value) || 30;
      const unidad = document.getElementById('tiempoUnidad').value;
      const fVence = new Date();
      
      if (unidad === 'horas') fVence.setHours(fVence.getHours() + cantidad);
      else fVence.setDate(fVence.getDate() + cantidad);

      try {
        await addDoc(prestamistasRef, {
          nombre: document.getElementById('nombre').value.trim(),
          dni: document.getElementById('dni').value.trim(),
          whatsapp: document.getElementById('whatsapp').value.trim(),
          edad: document.getElementById('edad').value.trim(),
          usuario: document.getElementById('usuario').value.trim(),
          clave: document.getElementById('clave').value.trim(),
          venceEn: fVence.toISOString(),
          fechaCreacion: new Date().toISOString()
        });
        createPrestamistaForm.reset();
        registerModalOverlay.classList.remove('is-open');
      } catch (err) {
        alert("Error al guardar: " + err.message);
      }
    });

    moneyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = moneyPrestamistaId.value;
      const monto = parseFloat(document.getElementById('montoPago').value) || 0;
      const cantidad = parseInt(document.getElementById('extCantidad').value) || 30;
      const unidad = document.getElementById('extUnidad').value;

      const usr = cachedPrestamistas.find(p => p.id === id);
      if (!usr) return;

      const ahora = new Date();
      let base = (usr.data.venceEn && new Date(usr.data.venceEn) > ahora) ? new Date(usr.data.venceEn) : ahora;

      if (unidad === 'horas') base.setHours(base.getHours() + cantidad);
      else base.setDate(base.getDate() + cantidad);

      try {
        await addDoc(collection(db, "carpetacout", "configuracion_general", "usuariosprestamistas", id, "pagos"), {
          monto, fechaPago: new Date().toISOString(), extensionOtorgada: `${cantidad} ${unidad}`
        });

        await updateDoc(doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", id), {
          venceEn: base.toISOString()
        });

        moneyModalOverlay.classList.remove('is-open');
      } catch (err) {
        alert("Error en transacción: " + err.message);
      }
    });

    suspendForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = suspendPrestamistaId.value;
      const mode = suspendMode.value;
      const usr = cachedPrestamistas.find(p => p.id === id);
      if (!usr) return;

      const ahora = new Date();
      let nFecha = new Date();

      if (mode === 'total') {
        nFecha = new Date(ahora.getTime() - 1000);
      } else {
        const cantidad = parseInt(document.getElementById('quitarCantidad').value) || 1;
        const unidad = document.getElementById('quitarUnidad').value;
        let base = (usr.data.venceEn && new Date(usr.data.venceEn) > ahora) ? new Date(usr.data.venceEn) : ahora;

        if (unidad === 'horas') base.setHours(base.getHours() - cantidad);
        else base.setDate(base.getDate() - cantidad);
        nFecha = base;
      }

      try {
        await updateDoc(doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", id), {
          venceEn: nFecha.toISOString()
        });
        suspendModalOverlay.classList.remove('is-open');
      } catch (err) {
        alert("Error al suspender: " + err.message);
      }
    });

    editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = editPrestamistaId.value;
      try {
        await updateDoc(doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", id), {
          nombre: document.getElementById('editNombre').value.trim(),
          dni: document.getElementById('editDni').value.trim(),
          whatsapp: document.getElementById('editWhatsapp').value.trim(),
          edad: document.getElementById('editEdad').value.trim(),
          usuario: document.getElementById('editUsuario').value.trim(),
          clave: document.getElementById('editClave').value.trim()
        });
        editModalOverlay.classList.remove('is-open');
      } catch (err) {
        alert("Error al actualizar: " + err.message);
      }
    });

    function renderPrestamistas() {
      prestamistasGrid.innerHTML = '';
      const filter = searchInput.value.toLowerCase().trim();
      const ahora = new Date();

      let countActive = 0;

      const filtered = cachedPrestamistas.filter(({ data }) => {
        const fullTxt = `${data.nombre} ${data.dni} ${data.whatsapp} ${data.usuario}`.toLowerCase();
        return fullTxt.includes(filter);
      });

      totalUsersCount.textContent = cachedPrestamistas.length;

      if (filtered.length === 0) {
        prestamistasGrid.innerHTML = `<div style="text-align: center; color: var(--text-tertiary); padding: 40px; font-size: 13px;">No se encontraron cuentas que coincidan con la búsqueda.</div>`;
        return;
      }

      filtered.forEach(({ id, data }) => {
        const isSusp = !data.venceEn || new Date(data.venceEn) <= ahora;
        if (!isSusp) countActive++;

        const card = document.createElement('div');
        card.className = `prestamista-card ${isSusp ? 'is-suspended' : ''}`;
        card.setAttribute('data-id', id);

        const initial = data.nombre ? data.nombre.charAt(0).toUpperCase() : 'P';

        card.innerHTML = `
          <div class="card-user-meta">
            <div class="avatar-mesh-box">${initial}</div>
            <div class="user-info">
              <div class="user-header-line">
                <div class="user-name">${data.nombre}</div>
              </div>

                  <span>${data.dni || 'N/D'}</span>

                <div class="meta-badge" title="WhatsApp">
                  <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                  <span>${data.whatsapp || 'N/D'}</span>
                </div>
                <div class="meta-badge" title="Usuario de Acceso">
                  <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                  <span><strong>${data.usuario}</strong></span>
                </div>
                <div class="meta-badge" title="Contraseña">
                  <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  <code>${data.clave}</code>
                </div>
              </div>
              <div class="timer-badge ${isSusp ? 'suspended' : 'active'}" id="timer-${id}">
                <span class="pulse-dot"></span>
                <span class="time-txt">Calculando...</span>
              </div>
            </div>
          </div>

          <div class="card-actions-bar">
            <button class="action-icon-btn btn-pay" data-id="${id}" title="Registrar Abono ($)">
              <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </button>
            <button class="action-icon-btn btn-history" data-id="${id}" title="Ver Auditoría de Pagos">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            </button>
            <button class="action-icon-btn btn-pause" data-id="${id}" title="Suspender o Descontar Tiempo">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
            </button>
            <button class="action-icon-btn btn-edit-usr" data-id="${id}" title="Editar Ficha">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="action-icon-btn btn-remove-usr" data-id="${id}" title="Eliminar Registro">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        `;

        card.querySelector('.btn-pay').addEventListener('click', () => {
          moneyPrestamistaId.value = id;
          document.getElementById('montoPago').value = '';
          moneyModalOverlay.classList.add('is-open');
        });

        card.querySelector('.btn-history').addEventListener('click', () => cargarHistorialPagos(id));

        card.querySelector('.btn-pause').addEventListener('click', () => {
          suspendPrestamistaId.value = id;
          suspendMode.value = 'total';
          quitarCamposGroup.style.display = 'none';
          suspendModalOverlay.classList.add('is-open');
        });

        card.querySelector('.btn-edit-usr').addEventListener('click', () => {
          editPrestamistaId.value = id;
          document.getElementById('editNombre').value = data.nombre || '';
          document.getElementById('editDni').value = data.dni || '';
          document.getElementById('editWhatsapp').value = data.whatsapp || '';
          document.getElementById('editEdad').value = data.edad || '';
          document.getElementById('editUsuario').value = data.usuario || '';
          document.getElementById('editClave').value = data.clave || '';
          editModalOverlay.classList.add('is-open');
        });

        card.querySelector('.btn-remove-usr').addEventListener('click', async () => {
          if (confirm(`¿Eliminar la cuenta del prestamista "${data.nombre}"?`)) {
            await deleteDoc(doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", id));
          }
        });

        prestamistasGrid.appendChild(card);
      });

      activeUsersCount.textContent = countActive;
      actualizarTimers();
    }

    function actualizarTimers() {
      const ahora = new Date();
      cachedPrestamistas.forEach(({ id, data }) => {
        const badgeEl = document.getElementById(`timer-${id}`);
        const cardEl = document.querySelector(`.prestamista-card[data-id="${id}"]`);
        if (!badgeEl || !cardEl) return;

        const timeTxt = badgeEl.querySelector('.time-txt');

        if (!data.venceEn) {
          timeTxt.textContent = "Sin plazo definido";
          badgeEl.className = "timer-badge suspended";
          cardEl.classList.add('is-suspended');
          return;
        }

        const fVence = new Date(data.venceEn);
        const diffMs = fVence - ahora;

        if (diffMs <= 0) {
          timeTxt.textContent = "Suscripción Vencida";
          badgeEl.className = "timer-badge suspended";
          cardEl.classList.add('is-suspended');
        } else {
          cardEl.classList.remove('is-suspended');
          const totSeg = Math.floor(diffMs / 1000);
          const d = Math.floor(totSeg / (3600 * 24));
          const h = Math.floor((totSeg % (3600 * 24)) / 3600);
          const m = Math.floor((totSeg % 3600) / 60);
          const s = totSeg % 60;

          timeTxt.textContent = `${d}d ${h}h ${m}m ${s}s restantes`;
          badgeEl.className = "timer-badge active";
        }
      });
    }

    setInterval(actualizarTimers, 1000);

    onSnapshot(prestamistasRef, (snapshot) => {
      cachedPrestamistas = [];
      snapshot.forEach((docSnap) => {
        cachedPrestamistas.push({ id: docSnap.id, data: docSnap.data() });
      });
      localStorage.setItem('cout_cached_prestamistas', JSON.stringify(cachedPrestamistas));
      renderPrestamistas();
    }, (error) => {
      console.error("Error al sincronizar con Firebase:", error);
    });
  </script>
</body>
</html>
