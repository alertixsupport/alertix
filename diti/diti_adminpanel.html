<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Panel Administrativo Principal</title>
    <style>
        :root {
            --bg-base: #060707;
            --panel-bg: #0b0d0c;
            --border-subtle: #18221b;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0e1210;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* HEADER SUPERIOR CORPORATIVO */
        .app-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 24px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .hamburger-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hamburger-btn:hover {
            border-color: var(--accent-green);
            background: rgba(0, 230, 118, 0.05);
        }

        /* LOGO Y DATOS DE ADMIN CENTRADOS */
        .header-center-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .diti-logo-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffffff;
            display: inline-flex;
            align-items: baseline;
            gap: 2px;
            text-decoration: none;
        }

        .diti-logo-title .green-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--accent-green);
            margin-left: 2px;
        }

        .admin-meta-subtitle {
            font-size: 0.76rem;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.02em;
        }

        .admin-meta-subtitle strong {
            color: var(--accent-green);
        }

        /* ICONO DE CERRAR SESIÓN */
        .btn-logout-icon {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout-icon:hover {
            background: rgba(255, 77, 77, 0.1);
            border-color: rgba(255, 77, 77, 0.4);
            color: #ff6666;
        }

        /* MENÚ HAMBURGUESA LATERAL (SIDEBAR) CON CATEGORÍAS */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 4, 0.75);
            backdrop-filter: blur(5px);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100%;
            background: #090c0a;
            border-right: 1px solid var(--border-subtle);
            z-index: 999;
            display: flex;
            flex-direction: column;
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
        }

        .sidebar-menu.active {
            left: 0;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .sidebar-close:hover {
            color: #fff;
        }

        .sidebar-nav {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .nav-category-title {
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: var(--accent-green);
            text-transform: uppercase;
            margin-bottom: 6px;
            padding-left: 6px;
            border-left: 2px solid var(--accent-green);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            background: transparent;
            border: 1px solid transparent;
            margin-bottom: 4px;
        }

        .nav-item:hover, .nav-item.active {
            color: #fff;
            background: rgba(0, 230, 118, 0.08);
            border-color: rgba(0, 230, 118, 0.2);
        }

        .nav-item svg {
            color: var(--accent-green);
        }

        /* CONTENIDO PRINCIPAL */
        .main-content {
            flex-grow: 1;
            padding: 40px 20px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        .welcome-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .welcome-card h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .welcome-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Header Superior -->
    <header class="app-header">
        <div>
            <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Abrir Menú">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>

        <div class="header-center-brand">
            <a href="diti_adminpanel.html" class="diti-logo-title">
                diti<span class="green-dot"></span>app
            </a>
            <div class="admin-meta-subtitle">
                <span id="admin-display-name">Cargando...</span>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-logout-icon" onclick="cerrarSesion()" title="Cerrar Sesión">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </header>

    <!-- Menú Hamburguesa Lateral -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <nav class="sidebar-menu" id="sidebar-menu">
        <div class="sidebar-header">
            <div class="diti-logo-title" style="font-size: 1.3rem;">
                diti<span class="green-dot"></span>app
            </div>
            <button class="sidebar-close" onclick="toggleSidebar()">×</button>
        </div>
        <div class="sidebar-nav" id="sidebar-nav-links">
            <!-- Sincronizado en tiempo real y filtrado por permisos de admin -->
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="welcome-card">
            <h1 id="greeting-title">Bienvenido al Panel Gerencial</h1>
            <p>Desde este entorno centralizado puedes supervisar las operaciones de Diti App de acuerdo a tu nivel de autorización y los módulos asignados por la administración central.</p>
        </div>
    </main>

    <!-- Script con Validación Estricta de Login y Sincronización en Tiempo Real de Permisos -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 1. VALIDACIÓN ESTRICTA DE SESIÓN (Solo usuarios logeados desde login.html)
        const sesionRaw = sessionStorage.getItem("diti_admin_sesion");
        if (!sesionRaw) {
            window.location.replace("login.html");
        }

        const adminSesion = JSON.parse(sesionRaw);
        document.getElementById("admin-display-name").innerHTML = `${adminSesion.nombre} • <strong>@${adminSesion.usuario}</strong>`;
        document.getElementById("greeting-title").innerText = `Bienvenido, ${adminSesion.nombre}`;

        window.toggleSidebar = function() {
            document.getElementById("sidebar-menu").classList.toggle("active");
            document.getElementById("sidebar-overlay").classList.toggle("active");
        }

        window.cerrarSesion = function() {
            sessionStorage.removeItem("diti_admin_sesion");
            window.location.replace("login.html");
        }

        // 2. ESCUCHA EN TIEMPO REAL (ON-SNAPSHOT) PARA MENÚS Y PERMISOS ACTUALIZADOS DESDE REYDITI
        function iniciarSincronizacionEnVivo() {
            const navContainer = document.getElementById("sidebar-nav-links");
            navContainer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 10px;">Sincronizando permisos y módulos...</div>';

            // Escuchar cambios en los permisos del propio admin en tiempo real (diti_usuariosadmin)
            onSnapshot(doc(db, "diti_usuariosadmin", adminSesion.id), (adminDoc) => {
                let permisosActualizados = adminSesion.permisosMenu;
                let tipoAccesoActualizado = adminSesion.tipoAcceso;

                if (adminDoc.exists()) {
                    const dataAdmin = adminDoc.data();
                    permisosActualizados = dataAdmin.permisosMenu || [];
                    tipoAccesoActualizado = dataAdmin.tipoAcceso || "todas";
                    
                    // Actualizar sesión en memoria
                    adminSesion.permisosMenu = permisosActualizados;
                    adminSesion.tipoAcceso = tipoAccesoActualizado;
                    sessionStorage.setItem("diti_admin_sesion", JSON.stringify(adminSesion));
                }

                // Escuchar cambios en los módulos generales (diti_reyditimenu)
                onSnapshot(collection(db, "diti_reyditimenu"), (menuSnapshot) => {
                    navContainer.innerHTML = "";

                    if (menuSnapshot.empty) {
                        navContainer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 10px;">No hay módulos configurados.</div>';
                        return;
                    }

                    let categoriasMap = {};

                    menuSnapshot.forEach((docSnap) => {
                        const menu = docSnap.data();
                        const titulo = menu.titulo;
                        const redireccion = menu.redireccion || "#";
                        const categoria = menu.categoria ? menu.categoria.trim().toUpperCase() : "GENERAL";

                        // Validar si el admin tiene acceso manual y si esta página está habilitada para él
                        if (tipoAccesoActualizado === "manual") {
                            if (!permisosActualizados.includes(titulo)) {
                                return; // Si fue deshabilitado en reyditi.html, no se muestra
                            }
                        }

                        if (!categoriasMap[categoria]) {
                            categoriasMap[categoria] = [];
                        }

                        categoriasMap[categoria].push({ titulo, redireccion });
                    });

                    // Renderizar menú agrupado
                    for (let cat in categoriasMap) {
                        navContainer.innerHTML += `<div class="nav-category-title">${cat}</div>`;
                        
                        categoriasMap[cat].forEach(item => {
                            navContainer.innerHTML += `
                                <a href="${item.redireccion}" class="nav-item">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                    ${item.titulo}
                                </a>
                            `;
                        });
                    }
                });
            });
        }

        iniciarSincronizacionEnVivo();
    </script>
</body>
</html>
