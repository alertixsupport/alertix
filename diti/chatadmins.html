<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Central Administradores (Chat)</title>
    <style>
        :root {
            --bg-base: #060707;
            --panel-bg: #0b0d0c;
            --border-subtle: #18221b;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0e1210;
            --bubble-me: #0f2619;
            --bubble-other: #111513;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            height: 100vh;
            height: 100dvh; /* Soporte exacto para pantallas móviles */
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER FIJO ESTRICTO */
        .chat-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back, .btn-icon-top {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-back:hover, .btn-icon-top:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        .chat-title-wrapper {
            cursor: pointer;
            user-select: none;
        }

        .chat-title {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .chat-subtitle strong {
            color: var(--accent-green);
        }

        /* PANEL DESPLEGABLE DE PARTICIPANTES */
        .participants-dropdown {
            position: absolute;
            top: 100%;
            left: 20px;
            width: 300px;
            background: #0d1210;
            border: 1px solid var(--border-subtle);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            padding: 16px;
            display: none;
            z-index: 101;
        }

        .participants-dropdown.active {
            display: block;
        }

        .participants-dropdown h4 {
            font-size: 0.8rem;
            font-family: monospace;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .participant-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(25,35,28,0.4);
        }

        .participant-item:last-child {
            border-bottom: none;
        }

        .participant-avatar-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #18221b;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* ÁREA DE MENSAJES */
        .chat-messages-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: radial-gradient(circle at center, #090c0a 0%, #050606 100%);
        }

        .message-bubble {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
        }

        .message-bubble.me {
            background: var(--bubble-me);
            border: 1px solid rgba(0, 230, 118, 0.25);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message-bubble.other {
            background: var(--bubble-other);
            border: 1px solid var(--border-subtle);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            background: #151c18;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .msg-content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .msg-author {
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 4px;
        }

        .msg-reply-ref {
            background: rgba(0,0,0,0.3);
            border-left: 2px solid var(--accent-green);
            padding: 4px 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            border-radius: 4px;
        }

        .msg-text {
            font-size: 0.9rem;
            color: #fff;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-media {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
            max-height: 220px;
            object-fit: cover;
        }

        .msg-audio {
            width: 100%;
            margin-top: 6px;
            height: 38px;
        }

        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .msg-time {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .btn-reply-msg {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.72rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .btn-reply-msg:hover {
            color: var(--accent-green);
        }

        /* ÁREA DE ENTRADA */
        .chat-input-area {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-subtle);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .replying-banner {
            background: rgba(0, 230, 118, 0.05);
            border: 1px solid rgba(0, 230, 118, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            display: none;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
        }

        .replying-banner strong {
            color: var(--accent-green);
        }

        .replying-banner button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex-grow: 1;
            height: 44px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            padding: 0 16px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
        }

        .btn-media, .btn-mic, .btn-send {
            width: 44px;
            height: 44px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-media:hover, .btn-mic:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        .btn-mic.recording {
            background: rgba(255, 77, 77, 0.2);
            border-color: #ff4d4d;
            color: #ff4d4d;
            animation: pulseRec 1s infinite alternate;
        }

        @keyframes pulseRec {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .btn-send {
            background: var(--accent-green);
            color: #000;
            border: none;
        }

        .btn-send:hover {
            background: #00c864;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        /* MODALES Y MENÚ DE ENGRANAJE */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 4, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            width: 100%;
            max-width: 380px;
            background: #0d1210;
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-title {
            font-size: 1.05rem;
            color: #fff;
            font-weight: 600;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .modal-btn-option {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-btn-option:hover {
            border-color: var(--accent-green);
            background: rgba(0, 230, 118, 0.05);
        }

        .modal-btn-option.danger {
            color: #ff6666;
            border-color: rgba(255, 77, 77, 0.3);
        }

        .modal-btn-option.danger:hover {
            background: rgba(255, 77, 77, 0.1);
            border-color: #ff4d4d;
        }
    </style>
</head>
<body>

    <!-- Header Fijo -->
    <header class="chat-header">
        <div class="header-left">
            <a href="diti_adminpanel.html" class="btn-back" title="Volver al Panel">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            
            <div class="chat-title-wrapper" onclick="toggleParticipants()">
                <div class="chat-title">
                    Central Administradores
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div class="chat-subtitle"><span id="admin-count">0</span> administradores activos</div>
            </div>
        </div>

        <button class="btn-icon-top" onclick="abrirMenuEngranaje()" title="Opciones Gerenciales">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>

        <!-- Panel Desplegable Participantes -->
        <div class="participants-dropdown" id="participants-dropdown">
            <h4>Administradores Autorizados</h4>
            <div id="participants-list"></div>
        </div>
    </header>

    <!-- Contenedor de Mensajes -->
    <div class="chat-messages-container" id="chat-messages"></div>

    <!-- Área de Entrada -->
    <div class="chat-input-area">
        <div class="replying-banner" id="replying-banner">
            <div>Respondiendo a <strong id="replying-to-user">-</strong>: <span id="replying-to-text">-</span></div>
            <button onclick="cancelarRespuesta()">×</button>
        </div>

        <form class="chat-form" id="chat-form">
            <!-- Inputs ocultos para galería/fototeca -->
            <input type="file" id="media-input" accept="image/*" style="display: none;" onchange="enviarImagen(this)">
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="subirFotoPerfilGaleria(this)">

            <button type="button" class="btn-media" onclick="document.getElementById('media-input').click()" title="Adjuntar Imagen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </button>

            <button type="button" id="btn-mic" class="btn-mic" onclick="toggleGrabarAudio()" title="Nota de Voz">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>

            <input type="text" id="chat-input" class="chat-input" required placeholder="Escribe un mensaje corporativo..." autocomplete="off">
            
            <button type="submit" class="btn-send" title="Enviar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>

    <!-- Modal de Opciones del Engranaje -->
    <div class="modal-overlay" id="gear-modal">
        <div class="modal-container">
            <div class="modal-title">Ajustes Gerenciales</div>
            <button class="modal-btn-option" onclick="triggerCambiarAvatar()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Modificar Foto de Perfil (Galeria)
            </button>
            <button class="modal-btn-option danger" onclick="vaciarChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Vaciar Chat
            </button>
            <button class="modal-btn-option" style="justify-content: center; margin-top: 6px;" onclick="cerrarMenuEngranaje()">Cancelar</button>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const sesionRaw = sessionStorage.getItem("diti_admin_sesion");
        if (!sesionRaw) window.location.replace("login.html");

        let adminSesion = JSON.parse(sesionRaw);

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        const messagesContainer = document.getElementById("chat-messages");
        const chatForm = document.getElementById("chat-form");
        const chatInput = document.getElementById("chat-input");
        const adminCountEl = document.getElementById("admin-count");
        const participantsList = document.getElementById("participants-list");
        const dropdown = document.getElementById("participants-dropdown");

        let mensajeRespondido = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function reproducirSonidoEnvio() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        window.toggleParticipants = () => dropdown.classList.toggle("active");
        window.abrirMenuEngranaje = () => document.getElementById("gear-modal").classList.add("active");
        window.cerrarMenuEngranaje = () => document.getElementById("gear-modal").classList.remove("active");

        window.triggerCambiarAvatar = () => {
            cerrarMenuEngranaje();
            document.getElementById("avatar-file-input").click();
        }

        // Subir foto de perfil desde galería y guardar en colección 'fotoperfiladmin' y 'diti_usuariosadmin'
        window.subirFotoPerfilGaleria = (input) => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Img = e.target.result;
                try {
                    // Guardar en fotoperfiladmin asociado al usuario
                    await addDoc(collection(db, "fotoperfiladmin"), {
                        usuario: adminSesion.usuario,
                        avatar: base64Img,
                        timestamp: serverTimestamp()
                    });

                    // Actualizar también en diti_usuariosadmin
                    await updateDoc(doc(db, "diti_usuariosadmin", adminSesion.id), { avatar: base64Img });

                    adminSesion.avatar = base64Img;
                    sessionStorage.setItem("diti_admin_sesion", JSON.stringify(adminSesion));
                    alert("¡Foto de perfil actualizada con éxito!");
                } catch (err) {
                    console.error("Error guardando foto:", err);
                    alert("Error al guardar la foto de perfil.");
                }
            };
            reader.readAsDataURL(file);
        }

        // Vaciar Chat (Borrar documentos de la colección chatadmins)
        window.vaciarChat = async () => {
            cerrarMenuEngranaje();
            if (confirm("¿Está seguro de vaciar todo el historial del chat para todos los administradores?")) {
                try {
                    const snap = await getDocs(collection(db, "chatadmins"));
                    let promesas = [];
                    snap.forEach((d) => {
                        promesas.push(deleteDoc(doc(db, "chatadmins", d.id)));
                    });
                    await Promise.all(promesas);
                    alert("Chat vaciado con éxito.");
                } catch (err) {
                    console.error("Error al vaciar chat:", err);
                    alert("No se pudo vaciar el chat.");
                }
            }
        }

        // Sincronizar participantes
        onSnapshot(collection(db, "diti_usuariosadmin"), (snapshot) => {
            adminCountEl.innerText = snapshot.size;
            participantsList.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const iniciales = data.nombre ? data.nombre.substring(0,2).toUpperCase() : "AD";
                participantsList.innerHTML += `
                    <div class="participant-item">
                        <div class="participant-avatar-name">
                            ${data.avatar ? `<img src="${data.avatar}" class="mini-avatar">` : `<div class="mini-avatar">${iniciales}</div>`}
                            <span>${data.nombre}</span>
                        </div>
                        <div class="status-indicator">
                            <div class="status-dot"></div> Activo
                        </div>
                    </div>
                `;
            });
        });

        // Escuchar mensajes en tiempo real
        let primerCarga = true;
        onSnapshot(query(collection(db, "chatadmins"), orderBy("timestamp", "asc")), (snapshot) => {
            messagesContainer.innerHTML = "";
            if (snapshot.empty) {
                messagesContainer.innerHTML = `<div style="margin: auto; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Central Administradores lista.</div>`;
                primerCarga = false;
                return;
            }

            snapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const esMio = msg.usuarioId === adminSesion.id;
                const hora = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Recién';
                const iniciales = msg.nombreAutor ? msg.nombreAutor.substring(0,2).toUpperCase() : "AD";

                if (!primerCarga && !esMio && document.hidden && "Notification" in window && Notification.permission === "granted") {
                    new Notification(`Nuevo mensaje de ${msg.nombreAutor}`, {
                        body: msg.texto || "[Archivo multimedia]",
                        icon: msg.avatar || ""
                    });
                }

                let replyHtml = msg.replyTo ? `<div class="msg-reply-ref"><strong>${msg.replyTo.autor}:</strong> ${msg.replyTo.texto}</div>` : '';
                let mediaHtml = '';
                if (msg.imagen) mediaHtml = `<img src="${msg.imagen}" class="msg-media">`;
                
                // Soporte optimizado de audio para celulares y PC (audio/mp4 o audio/webm)
                if (msg.audio) {
                    mediaHtml = `<audio controls preload="metadata" src="${msg.audio}" class="msg-audio"></audio>`;
                }

                messagesContainer.innerHTML += `
                    <div class="message-bubble ${esMio ? 'me' : 'other'}">
                        ${!esMio ? (msg.avatar ? `<img src="${msg.avatar}" class="msg-avatar">` : `<div class="msg-avatar">${iniciales}</div>`) : ''}
                        <div class="msg-content-wrapper">
                            ${!esMio ? `<div class="msg-author">${msg.nombreAutor}</div>` : ''}
                            ${replyHtml}
                            ${msg.texto ? `<div class="msg-text">${msg.texto}</div>` : ''}
                            ${mediaHtml}
                            <div class="msg-footer">
                                <button class="btn-reply-msg" onclick='prepararRespuesta("${docSnap.id}", "${msg.nombreAutor}", ${JSON.stringify(msg.texto || "Multimedia")})'>Responder</button>
                                <span class="msg-time">${hora}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            primerCarga = false;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        // Enviar Texto
        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const texto = chatInput.value.trim();
            if (!texto) return;

            await addDoc(collection(db, "chatadmins"), {
                texto,
                usuarioId: adminSesion.id,
                nombreAutor: adminSesion.nombre,
                avatar: adminSesion.avatar || "",
                timestamp: serverTimestamp(),
                replyTo: mensajeRespondido
            });

            chatInput.value = "";
            cancelarRespuesta();
            reproducirSonidoEnvio();
        });

        // Enviar Imagen
        window.enviarImagen = (input) => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                await addDoc(collection(db, "chatadmins"), {
                    texto: "",
                    imagen: e.target.result,
                    usuarioId: adminSesion.id,
                    nombreAutor: adminSesion.nombre,
                    avatar: adminSesion.avatar || "",
                    timestamp: serverTimestamp()
                });
                reproducirSonidoEnvio();
            };
            reader.readAsDataURL(file);
        };

        // Grabación de Audio Profesional optimizada para Celulares
        window.toggleGrabarAudio = async () => {
            const btnMic = document.getElementById("btn-mic");
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    // Usar audio/mp4 si está disponible (ideal para iPhone/Safari), sino webm
                    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            await addDoc(collection(db, "chatadmins"), {
                                texto: "", // Ya no muestra [Nota de Voz], solo el audio limpio
                                audio: e.target.result,
                                usuarioId: adminSesion.id,
                                nombreAutor: adminSesion.nombre,
                                avatar: adminSesion.avatar || "",
                                timestamp: serverTimestamp()
                            });
                            reproducirSonidoEnvio();
                        };
                        reader.readAsDataURL(audioBlob);
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btnMic.classList.add("recording");
                } catch (err) {
                    alert("No se pudo acceder al micrófono del dispositivo.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btnMic.classList.remove("recording");
            }
        };

        window.prepararRespuesta = (id, autor, texto) => {
            mensajeRespondido = { id, autor, texto };
            document.getElementById("replying-to-user").innerText = autor;
            document.getElementById("replying-to-text").innerText = texto;
            document.getElementById("replying-banner").style.display = "flex";
            chatInput.focus();
        }

        window.cancelarRespuesta = () => {
            mensajeRespondido = null;
            document.getElementById("replying-banner").style.display = "none";
        }
    </script>
</body>
</html>
