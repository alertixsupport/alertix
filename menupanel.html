<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertix - Gestión de Menú y Categorías</title>
    <style>
        :root {
            --bg-base: #070709;
            --bg-surface: rgba(18, 18, 22, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-accent: rgba(220, 20, 60, 0.4);
            --red-primary: #dc143c;
            --red-glow: rgba(220, 20, 60, 0.35);
            --text-main: #f1f1f5;
            --text-muted: #8a8a9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(180, 0, 0, 0.12) 0%, transparent 60%),
                linear-gradient(180deg, #09090d 0%, #040406 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 75px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            z-index: 1000;
            background: rgba(10, 10, 14, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            border-color: var(--border-accent);
            background: rgba(220, 20, 60, 0.1);
            box-shadow: 0 0 12px var(--red-glow);
        }

        .brand-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge-dot {
            width: 7px;
            height: 7px;
            background: var(--red-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--red-primary);
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 40%, #a0a0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            padding: 40px 32px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .page-header-info {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .form-card {
            background: var(--bg-surface);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            margin-bottom: 40px;
        }

        .form-card h3 {
            font-size: 0.95rem;
            color: var(--red-primary);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-control {
            width: 100%;
            background: rgba(10, 10, 14, 0.7);
            border: 1px solid var(--border-subtle);
            border-radius: 9px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--red-primary);
            box-shadow: 0 0 12px var(--red-glow);
        }

        textarea.form-control {
            resize: vertical;
            font-family: monospace;
            font-size: 0.82rem;
        }

        .btn-group-form {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .submit-btn {
            background: linear-gradient(180deg, rgba(220, 20, 60, 0.9) 0%, rgba(140, 0, 30, 1) 100%);
            border: 1px solid rgba(255, 50, 50, 0.4);
            color: white;
            padding: 12px 24px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px var(--red-glow);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.5);
        }

        .cancel-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 12px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            display: none;
        }

        .list-header {
            margin-bottom: 16px;
        }

        .list-header h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item-row {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 18px 24px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .menu-item-row:hover {
            border-color: rgba(220, 20, 60, 0.3);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .item-icon-preview {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red-primary);
            flex-shrink: 0;
        }

        .item-icon-preview svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .menu-item-info strong {
            display: block;
            font-size: 0.96rem;
            color: #fff;
            margin-bottom: 2px;
        }

        .menu-item-info span {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .badge-categoria {
            display: inline-block;
            background: rgba(220, 20, 60, 0.12);
            border: 1px solid rgba(220, 20, 60, 0.3);
            color: #ff6b6b;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .menu-item-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .reorder-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .reorder-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            width: 28px;
            height: 20px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            transition: all 0.2s;
        }

        .reorder-btn:hover {
            background: var(--red-primary);
            border-color: var(--red-primary);
            color: #fff;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            border-color: var(--border-accent);
            background: rgba(220, 20, 60, 0.1);
        }

        .delete-btn:hover {
            border-color: #ff4d4d;
            background: rgba(255, 0, 0, 0.15);
            color: #ff6b6b;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="paneladmin.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Panel Principal
            </a>
            <div class="brand-title-area">
                <div class="brand-badge-dot"></div>
                <h1 class="brand-title">Alertix Console</h1>
            </div>
        </div>
    </header>

    <main>
        <div class="page-header-info">
            <h2 class="section-title">Gestión de Menú y Categorías</h2>
            <p class="section-desc">Organiza las páginas por secciones y categorías (ej. Socios, Administración) para estructurar el menú lateral.</p>
        </div>

        <div class="form-card">
            <h3 id="form-title">Nueva Página de Navegación</h3>
            <form id="menu-form">
                <input type="hidden" id="edit-doc-id" value="">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="titulo">Título de la Página</label>
                        <input type="text" id="titulo" class="form-control" placeholder="Ej. Usuarios o Tarjetas" required>
                    </div>
                    <div class="form-group">
                        <label for="redireccion">Redireccionamiento (.html)</label>
                        <input type="text" id="redireccion" class="form-control" placeholder="Ej. usuarios.html" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría / Sección</label>
                        <input type="text" id="categoria" class="form-control" placeholder="Ej. Socios o Administración" list="categorias-sugeridas" required>
                        <datalist id="categorias-sugeridas">
                            <option value="Socios">
                            <option value="Administración">
                            <option value="Monitoreo">
                            <option value="General">
                        </datalist>
                    </div>
                </div>

                <div class="form-group">
                    <label for="iconoSvg">Código SVG del Icono (Lucide / Heroicons 24x24)</label>
                    <textarea id="iconoSvg" class="form-control" rows="2" placeholder='<svg viewBox="0 0 24 24"><path d="..."></path></svg>'></textarea>
                </div>

                <div class="btn-group-form">
                    <button type="submit" class="submit-btn" id="save-btn">Guardar en Colección</button>
                    <button type="button" class="cancel-btn" id="cancel-edit-btn" onclick="resetForm()">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <div class="list-header">
            <h3>Estructura Actual del Menú</h3>
        </div>
        
        <div class="items-list" id="menu-items-container">
            <p style="color: var(--text-muted); text-align: center; padding: 20px;">Sincronizando elementos de menú...</p>
        </div>
    </main>

    <script type="module">
        import { db } from "./app.js";
        import { collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const userEmail = sessionStorage.getItem("alertix_user_email");
        if (!userEmail) window.location.href = "googleadmin.html";

        let menuDataCache = [];

        const menuForm = document.getElementById("menu-form");
        menuForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("edit-doc-id").value;
            const titulo = document.getElementById("titulo").value.trim();
            const redireccion = document.getElementById("redireccion").value.trim();
            const categoria = document.getElementById("categoria").value.trim() || "General";
            const iconoSvg = document.getElementById("iconoSvg").value.trim() || `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;

            try {
                if (editId) {
                    await updateDoc(doc(db, "menupanel", editId), { titulo, redireccion, categoria, iconoSvg });
                } else {
                    const nuevoOrden = menuDataCache.length + 1;
                    await addDoc(collection(db, "menupanel"), { titulo, redireccion, categoria, iconoSvg, orden: nuevoOrden, createdAt: serverTimestamp() });
                }
                resetForm();
                cargarMenuAdmin();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("No se pudo completar la operación.");
            }
        });

        async function cargarMenuAdmin() {
            const container = document.getElementById("menu-items-container");
            try {
                const q = query(collection(db, "menupanel"), orderBy("orden", "asc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">No hay páginas configuradas en el menú.</p>`;
                    menuDataCache = [];
                    return;
                }

                menuDataCache = [];
                let html = "";

                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    menuDataCache.push({ id: documento.id, ...data });

                    html += `
                        <div class="menu-item-row">
                            <div class="menu-item-left">
                                <div class="item-icon-preview">${data.iconoSvg}</div>
                                <div class="menu-item-info">
                                    <strong>${data.titulo}</strong>
                                    <span>Destino: ${data.redireccion}</span>
                                    <span class="badge-categoria">${data.categoria || 'General'}</span>
                                </div>
                            </div>
                            <div class="menu-item-actions">
                                <div class="reorder-container">
                                    <button class="reorder-btn" onclick="moverItem('${documento.id}', 'up')" title="Arriba">▲</button>
                                    <button class="reorder-btn" onclick="moverItem('${documento.id}', 'down')" title="Abajo">▼</button>
                                </div>
                                <button class="action-btn" onclick="prepararEdicion('${documento.id}')">Editar</button>
                                <button class="action-btn delete-btn" onclick="eliminarItem('${documento.id}')">Eliminar</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error("Error:", error);
            }
        }

        window.moverItem = async function(id, direccion) {
            const index = menuDataCache.findIndex(item => item.id === id);
            if (index === -1) return;

            if (direccion === 'up' && index > 0) {
                const actual = menuDataCache[index];
                const anterior = menuDataCache[index - 1];
                await updateDoc(doc(db, "menupanel", actual.id), { orden: index });
                await updateDoc(doc(db, "menupanel", anterior.id), { orden: index + 1 });
                cargarMenuAdmin();
            } else if (direccion === 'down' && index < menuDataCache.length - 1) {
                const actual = menuDataCache[index];
                const siguiente = menuDataCache[index + 1];
                await updateDoc(doc(db, "menupanel", actual.id), { orden: index + 2 });
                await updateDoc(doc(db, "menupanel", siguiente.id), { orden: index + 1 });
                cargarMenuAdmin();
            }
        };

        window.prepararEdicion = function(id) {
            const item = menuDataCache.find(i => i.id === id);
            if (!item) return;

            document.getElementById("edit-doc-id").value = item.id;
            document.getElementById("titulo").value = item.titulo;
            document.getElementById("redireccion").value = item.redireccion;
            document.getElementById("categoria").value = item.categoria || "General";
            document.getElementById("iconoSvg").value = item.iconoSvg;

            document.getElementById("form-title").innerText = "Editar Página de Navegación";
            document.getElementById("save-btn").innerText = "Actualizar Cambios";
            document.getElementById("cancel-edit-btn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = function() {
            menuForm.reset();
            document.getElementById("edit-doc-id").value = "";
            document.getElementById("form-title").innerText = "Nueva Página de Navegación";
            document.getElementById("save-btn").innerText = "Guardar en Colección";
            document.getElementById("cancel-edit-btn").style.display = "none";
        };

        window.eliminarItem = async function(id) {
            if (confirm("¿Estás seguro de eliminar este elemento?")) {
                await deleteDoc(doc(db, "menupanel", id));
                cargarMenuAdmin();
            }
        };

        cargarMenuAdmin();
    </script>
</body>
</html>
