<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diti App — Central Administradores (Chat)</title>
    <style>
        :root {
            --bg-base: #050706;
            --panel-bg: #090d0b;
            --border-subtle: #152219;
            --border-focus: #00e676;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #859489;
            --input-bg: #0b110e;
            --bubble-me: #0e2417;
            --bubble-other: #0d1210;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* ESTRUCTURA MAESTRA FIJA */
        html, body {
            background-color: var(--bg-base);
            height: 100%;
            height: 100dvh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* HEADER SUPERIOR FIJO ESTRICTO (INMUNE AL TECLADO) */
        .chat-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back, .btn-icon-top {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-back:hover, .btn-icon-top:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        .chat-title-wrapper {
            cursor: pointer;
            user-select: none;
        }

        .chat-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.01em;
        }

        .chat-subtitle {
            font-size: 0.73rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .chat-subtitle strong {
            color: var(--accent-green);
        }

        /* PANEL DESPLEGABLE DE PARTICIPANTES */
        .participants-dropdown {
            position: absolute;
            top: 100%;
            left: 20px;
            width: 280px;
            background: #0b110e;
            border: 1px solid var(--border-subtle);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.9);
            padding: 14px;
            display: none;
            z-index: 105;
        }

        .participants-dropdown.active {
            display: block;
        }

        .participants-dropdown h4 {
            font-size: 0.75rem;
            font-family: monospace;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .participant-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 0;
            font-size: 0.82rem;
            border-bottom: 1px solid rgba(21,34,25,0.4);
        }

        .participant-item:last-child {
            border-bottom: none;
        }

        .participant-avatar-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #121c16;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
        }

        /* ÁREA DE MENSAJES */
        .chat-messages-container {
            flex-grow: 1;
            padding: 75px 20px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: radial-gradient(circle at center, #070a08 0%, #030404 100%);
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        /* BOTÓN FLOTANTE SCROLL-TO-BOTTOM */
        .scroll-bottom-btn {
            position: fixed;
            bottom: 85px;
            right: 24px;
            background: #0d1e14;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,230,118,0.3);
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        .scroll-bottom-btn.active {
            opacity: 1;
            visibility: visible;
            animation: pulseScroll 2s infinite ease-in-out;
        }

        @keyframes pulseScroll {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(0,230,118,0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(0,230,118,0.6); }
        }

        /* BURBUJAS DE MENSAJES */
        .message-bubble {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            display: flex;
            gap: 10px;
        }

        .message-bubble.me {
            background: var(--bubble-me);
            border: 1px solid rgba(0, 230, 118, 0.22);
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .message-bubble.other {
            background: var(--bubble-other);
            border: 1px solid var(--border-subtle);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            background: #111a14;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .msg-content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .msg-author {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 3px;
            letter-spacing: 0.02em;
        }

        .msg-reply-ref {
            background: rgba(0,0,0,0.4);
            border-left: 2px solid var(--accent-green);
            padding: 5px 8px;
            font-size: 0.73rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            border-radius: 4px;
        }

        .msg-text {
            font-size: 0.88rem;
            color: #fff;
            line-height: 1.45;
            word-break: break-word;
            letter-spacing: -0.01em;
        }

        .msg-media {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 6px;
            max-height: 240px;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
        }

        .msg-audio {
            width: 100%;
            margin-top: 6px;
            height: 36px;
        }

        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .msg-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .btn-reply-msg {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .btn-reply-msg:hover {
            color: var(--accent-green);
        }

        /* ÁREA DE ENTRADA INFERIOR */
        .chat-input-area {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-subtle);
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            z-index: 50;
        }

        .replying-banner {
            background: rgba(0, 230, 118, 0.04);
            border: 1px solid rgba(0, 230, 118, 0.18);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.76rem;
            display: none;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
        }

        .replying-banner strong {
            color: var(--accent-green);
        }

        .replying-banner button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex-grow: 1;
            height: 42px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            padding: 0 16px;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.15);
        }

        .btn-media, .btn-mic, .btn-send {
            width: 42px;
            height: 42px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-media:hover, .btn-mic:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        .btn-mic.recording {
            background: rgba(255, 77, 77, 0.15);
            border-color: #ff4d4d;
            color: #ff4d4d;
            animation: pulseRec 1s infinite alternate;
        }

        @keyframes pulseRec {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .btn-send {
            background: var(--accent-green);
            color: #000;
            border: none;
        }

        .btn-send:hover {
            background: #00c864;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.35);
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 4, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            width: 100%;
            max-width: 380px;
            background: #0b110e;
            border: 1px solid rgba(0, 230, 118, 0.25);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-title {
            font-size: 1.02rem;
            color: #fff;
            font-weight: 600;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .modal-btn-option {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 11px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-btn-option:hover {
            border-color: var(--accent-green);
            background: rgba(0, 230, 118, 0.05);
        }

        .modal-btn-option.danger {
            color: #ff6666;
            border-color: rgba(255, 77, 77, 0.3);
        }

        .modal-btn-option.danger:hover {
            background: rgba(255, 77, 77, 0.1);
            border-color: #ff4d4d;
        }
    </style>
</head>
<body>

    <!-- Header Superior Fijo Absoluto -->
    <header class="chat-header">
        <div class="header-left">
            <a href="diti_adminpanel.html" class="btn-back" title="Volver al Panel">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            
            <div class="chat-title-wrapper" onclick="toggleParticipants()">
                <div class="chat-title">
                    Central Administradores
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div class="chat-subtitle"><span id="admin-count">0</span> administradores activos</div>
            </div>
        </div>

        <button class="btn-icon-top" onclick="abrirMenuEngranaje()" title="Opciones Gerenciales">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>

        <div class="participants-dropdown" id="participants-dropdown">
            <h4>Administradores Autorizados</h4>
            <div id="participants-list"></div>
        </div>
    </header>

    <!-- Contenedor de Mensajes -->
    <div class="chat-messages-container" id="chat-messages" onscroll="verificarScrollChat()"></div>

    <!-- Botón Flotante para Bajar al Último Mensaje -->
    <button class="scroll-bottom-btn" id="scroll-bottom-btn" onclick="irAlUltimoMensaje()" title="Bajar al último mensaje">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>

    <!-- Área de Entrada Inferior -->
    <div class="chat-input-area">
        <div class="replying-banner" id="replying-banner">
            <div>Respondiendo a <strong id="replying-to-user">-</strong>: <span id="replying-to-text">-</span></div>
            <button onclick="cancelarRespuesta()">×</button>
        </div>

        <form class="chat-form" id="chat-form">
            <input type="file" id="media-input" accept="image/*" style="display: none;" onchange="enviarImagen(this)">
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="subirFotoPerfilGaleria(this)">

            <button type="button" class="btn-media" onclick="document.getElementById('media-input').click()" title="Adjuntar Imagen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </button>

            <button type="button" id="btn-mic" class="btn-mic" onclick="toggleGrabarAudio()" title="Nota de Voz">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>

            <input type="text" id="chat-input" class="chat-input" required placeholder="Escribe un mensaje corporativo..." autocomplete="off">
            
            <button type="submit" class="btn-send" title="Enviar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>

    <!-- Modal del Engranaje -->
    <div class="modal-overlay" id="gear-modal">
        <div class="modal-container">
            <div class="modal-title">Ajustes Gerenciales</div>
            <button class="modal-btn-option" onclick="triggerCambiarAvatar()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Modificar Foto de Perfil (Galeria)
            </button>
            <button class="modal-btn-option danger" onclick="vaciarChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Vaciar Chat
            </button>
            <button class="modal-btn-option" style="justify-content: center; margin-top: 6px;" onclick="cerrarMenuEngranaje()">Cancelar</button>
        </div>
    </div>

    <!-- Script Corregido para Mantener el Scroll Abajo Estrictamente -->
    <script type="module">
        import { db } from "../app.js";
        import { collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp, doc, updateDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const sesionRaw = sessionStorage.getItem("diti_admin_sesion");
        if (!sesionRaw) window.location.replace("login.html");

        let adminSesion = JSON.parse(sesionRaw);

        const messagesContainer = document.getElementById("chat-messages");
        const chatForm = document.getElementById("chat-form");
        const chatInput = document.getElementById("chat-input");
        const adminCountEl = document.getElementById("admin-count");
        const participantsList = document.getElementById("participants-list");
        const dropdown = document.getElementById("participants-dropdown");
        const scrollBottomBtn = document.getElementById("scroll-bottom-btn");

        let mensajeRespondido = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function reproducirSonidoEnvio() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        window.toggleParticipants = () => dropdown.classList.toggle("active");
        window.abrirMenuEngranaje = () => document.getElementById("gear-modal").classList.add("active");
        window.cerrarMenuEngranaje = () => document.getElementById("gear-modal").classList.remove("active");

        window.verificarScrollChat = () => {
            const distanciaDesdeAbajo = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
            if (distanciaDesdeAbajo > 250) {
                scrollBottomBtn.classList.add("active");
            } else {
                scrollBottomBtn.classList.remove("active");
            }
        };

        window.irAlUltimoMensaje = () => {
            messagesContainer.scrollTo({
                top: messagesContainer.scrollHeight,
                behavior: 'smooth'
            });
            scrollBottomBtn.classList.remove("active");
        };

        window.triggerCambiarAvatar = () => {
            cerrarMenuEngranaje();
            document.getElementById("avatar-file-input").click();
        }

        window.subirFotoPerfilGaleria = (input) => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 300;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);

                    try {
                        await addDoc(collection(db, "fotoperfiladmin"), {
                            usuario: adminSesion.usuario,
                            avatar: compressedBase64,
                            timestamp: serverTimestamp()
                        });
                        await updateDoc(doc(db, "diti_usuariosadmin", adminSesion.id), { avatar: compressedBase64 });
                        adminSesion.avatar = compressedBase64;
                        sessionStorage.setItem("diti_admin_sesion", JSON.stringify(adminSesion));
                        alert("¡Foto de perfil actualizada con éxito!");
                    } catch (err) {
                        alert("Error al actualizar la foto.");
                    }
                };
            };
            reader.readAsDataURL(file);
        }

        window.vaciarChat = async () => {
            cerrarMenuEngranaje();
            if (confirm("¿Vaciar todo el historial del chat?")) {
                try {
                    const snap = await getDocs(collection(db, "chatadmins"));
                    let promesas = [];
                    snap.forEach((d) => promesas.push(deleteDoc(doc(db, "chatadmins", d.id))));
                    await Promise.all(promesas);
                    alert("Chat vaciado.");
                } catch (err) {
                    alert("No se pudo vaciar el chat.");
                }
            }
        }

        onSnapshot(collection(db, "diti_usuariosadmin"), (snapshot) => {
            adminCountEl.innerText = snapshot.size;
            participantsList.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const iniciales = data.nombre ? data.nombre.substring(0,2).toUpperCase() : "AD";
                participantsList.innerHTML += `
                    <div class="participant-item">
                        <div class="participant-avatar-name">
                            ${data.avatar ? `<img src="${data.avatar}" class="mini-avatar">` : `<div class="mini-avatar">${iniciales}</div>`}
                            <span>${data.nombre}</span>
                        </div>
                        <div class="status-indicator">
                            <div class="status-dot"></div> Activo
                        </div>
                    </div>
                `;
            });
        });

        // Sincronización en tiempo real con control estricto de posición inferior
        let primeraEjecucion = true;
        const q = query(collection(db, "chatadmins"), orderBy("timestamp", "asc"), limit(100));

        onSnapshot(q, (snapshot) => {
            messagesContainer.innerHTML = "";
            if (snapshot.empty) {
                messagesContainer.innerHTML = `<div style="margin: auto; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Central Administradores lista.</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const esMio = msg.usuarioId === adminSesion.id;
                const hora = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Recién';
                const iniciales = msg.nombreAutor ? msg.nombreAutor.substring(0,2).toUpperCase() : "AD";

                let replyHtml = msg.replyTo ? `<div class="msg-reply-ref"><strong>${msg.replyTo.autor}:</strong> ${msg.replyTo.texto}</div>` : '';
                let mediaHtml = '';
                if (msg.imagen) mediaHtml = `<img src="${msg.imagen}" class="msg-media">`;
                if (msg.audio) mediaHtml = `<audio controls preload="metadata" src="${msg.audio}" class="msg-audio"></audio>`;

                messagesContainer.innerHTML += `
                    <div class="message-bubble ${esMio ? 'me' : 'other'}">
                        ${!esMio ? (msg.avatar ? `<img src="${msg.avatar}" class="msg-avatar">` : `<div class="msg-avatar">${iniciales}</div>`) : ''}
                        <div class="msg-content-wrapper">
                            ${!esMio ? `<div class="msg-author">${msg.nombreAutor}</div>` : ''}
                            ${replyHtml}
                            ${msg.texto ? `<div class="msg-text">${msg.texto}</div>` : ''}
                            ${mediaHtml}
                            <div class="msg-footer">
                                <button class="btn-reply-msg" onclick='prepararRespuesta("${docSnap.id}", "${msg.nombreAutor}", ${JSON.stringify(msg.texto || "Multimedia")})'>Responder</button>
                                <span class="msg-time">${hora}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            // CORRECCIÓN CLAVE: Si es la primera carga o si el usuario está cerca del fondo (o envió un mensaje), mantener abajo automáticamente
            const distanciaDesdeAbajo = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
            if (primeraEjecucion || distanciaDesdeAbajo < 300) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                primeraEjecucion = false;
            }
        });

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const texto = chatInput.value.trim();
            if (!texto) return;

            await addDoc(collection(db, "chatadmins"), {
                texto,
                usuarioId: adminSesion.id,
                nombreAutor: adminSesion.nombre,
                avatar: adminSesion.avatar || "",
                timestamp: serverTimestamp(),
                replyTo: mensajeRespondido
            });

            chatInput.value = "";
            cancelarRespuesta();
            reproducirSonidoEnvio();
            
            // Forzar scroll al fondo inmediatamente al enviar
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 50);
        });

        window.enviarImagen = (input) => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.85);

                    try {
                        await addDoc(collection(db, "chatadmins"), {
                            texto: "",
                            imagen: optimizedBase64,
                            usuarioId: adminSesion.id,
                            nombreAutor: adminSesion.nombre,
                            avatar: adminSesion.avatar || "",
                            timestamp: serverTimestamp()
                        });
                        reproducirSonidoEnvio();
                        setTimeout(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; }, 50);
                    } catch (err) {
                        alert("Error al enviar la imagen. Verifique su conexión.");
                    }
                };
            };
            reader.readAsDataURL(file);
        };

        window.toggleGrabarAudio = async () => {
            const btnMic = document.getElementById("btn-mic");
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            await addDoc(collection(db, "chatadmins"), {
                                texto: "",
                                audio: e.target.result,
                                usuarioId: adminSesion.id,
                                nombreAutor: adminSesion.nombre,
                                avatar: adminSesion.avatar || "",
                                timestamp: serverTimestamp()
                            });
                            reproducirSonidoEnvio();
                            setTimeout(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; }, 50);
                        };
                        reader.readAsDataURL(audioBlob);
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btnMic.classList.add("recording");
                } catch (err) {
                    alert("No se pudo acceder al micrófono.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btnMic.classList.remove("recording");
            }
        };

        window.prepararRespuesta = (id, autor, texto) => {
            mensajeRespondido = { id, autor, texto };
            document.getElementById("replying-to-user").innerText = autor;
            document.getElementById("replying-to-text").innerText = texto;
            document.getElementById("replying-banner").style.display = "flex";
            chatInput.focus();
        }

        window.cancelarRespuesta = () => {
            mensajeRespondido = null;
            document.getElementById("replying-banner").style.display = "none";
        }
    </script>
</body>
</html>
